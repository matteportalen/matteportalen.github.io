<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hundrarutan – Matte-Portalen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF3FF; --ink:#1D2B53; --muted:#56668F; --card:#FFFFFF; --line:#C6D6F2;
  --good:#1E9E5E; --good-dark:#157548; --bad:#E5484D; --accent:#3D5AFE; --gold:#F2B707;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none !important}
.back{display:inline-block;color:var(--muted);font-weight:700;text-decoration:none;padding:6px 0;font-size:1rem}
h1{font-size:2.6rem;line-height:1;margin:14px 0 4px;font-weight:800}
h2{font-size:2rem;line-height:1.1;margin:10px 0 6px;font-weight:800}
.lead{margin:0 0 16px;color:var(--muted);font-size:1.1rem}
.stars{color:var(--gold);letter-spacing:1px}
.stars .off{color:#D5DDEC}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acard{background:var(--card);border-radius:18px;padding:12px 10px 10px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.acard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.acard .ico{width:76px;height:64px;display:grid;place-items:center}
.acard .ico svg{width:100%;height:100%}
.acard b{font-size:1.15rem;line-height:1.15}
.acard small{color:var(--muted);font-size:.85rem;line-height:1.2}
.acard .ak{font-size:.72rem;font-weight:800;color:#fff;background:var(--c,#3D8BFD);border-radius:999px;padding:0 8px}
.note{color:var(--muted);font-size:.95rem;margin-top:18px}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.info{font-weight:800;font-size:1.2rem}
.progress{height:10px;border-radius:5px;background:var(--card);overflow:hidden;margin-top:6px;box-shadow:inset 0 0 0 2px var(--line)}
.progress i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.task{background:var(--card);border-radius:22px;padding:12px 12px 12px;box-shadow:0 5px 0 var(--line);margin:12px 0;transition:background .15s}
.task.ok{background:#DDF5E7}
.instr{display:flex;gap:10px;align-items:center;font-weight:700;font-size:1.15rem;line-height:1.3}
.spk{flex:none;width:46px;height:46px;border-radius:50%;background:var(--bg);font-size:1.4rem;box-shadow:0 3px 0 var(--line)}
.content{margin-top:10px;text-align:center}
.feedback{min-height:1.4em;font-weight:800;font-size:1.1rem;margin-top:6px;text-align:center;color:var(--good)}
/* hundrarutan */
.h100{position:relative;display:grid;grid-template-columns:repeat(10,1fr);gap:2px;background:var(--line);padding:2px;border-radius:12px;max-width:420px;margin:0 auto}
.h100 i{font-style:normal;aspect-ratio:1;background:#fff;display:grid;place-items:center;font-weight:800;font-size:clamp(.62rem,3.2vw,.95rem);color:var(--ink);border-radius:3px}
.h100 i.dim{color:transparent;background:#F5F8FF}
.h100 i.col1{color:var(--muted)}
.h100 i.start{background:#3D8BFD;color:#fff}
.h100 i.goal{background:#FFF4CC;color:var(--accent);box-shadow:inset 0 0 0 3px var(--accent)}
.h100 i.goalok{background:#DDF5E7;color:var(--good-dark);box-shadow:inset 0 0 0 3px var(--good)}
.h100 i.frag{background:#FFF4CC;color:var(--ink)}
.h100 i.via{background:#E1ECFF;color:var(--ink)}
.h100 svg{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px);pointer-events:none;overflow:visible}
.ansrow{margin-top:10px;font-weight:800;font-size:1.6rem}
.box1{display:inline-block;min-width:2.2em;font-size:2rem;font-weight:800;border-radius:12px;border:3px solid var(--accent);color:var(--accent);background:#EEF1FF;line-height:1.2;padding:0 .2em}
/* trasig hundraruta */
.frag{display:inline-grid;gap:6px;margin:6px auto 0}
.frag .fc{width:min(15vw,62px);aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:clamp(1.1rem,5vw,1.6rem);background:#fff;box-shadow:inset 0 0 0 3px var(--line)}
.frag .fc.given{background:#3D8BFD;color:#fff;box-shadow:none}
.frag .fc.blank{background:#F5F8FF;color:var(--accent);cursor:pointer;box-shadow:inset 0 0 0 3px #C6D6F2}
.frag .fc.blank.sel{box-shadow:inset 0 0 0 4px var(--accent);background:#EEF1FF}
.frag .fc.right{background:#DDF5E7;color:var(--good-dark);box-shadow:inset 0 0 0 3px var(--good)}
.frag .fc.wrong{background:#FDE4E4;color:var(--bad);box-shadow:inset 0 0 0 3px var(--bad)}
.frag .fc.none{visibility:hidden}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:54px;border-radius:16px;background:var(--card);font-size:1.8rem;font-weight:800;box-shadow:0 4px 0 var(--line)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad .okbtn{background:var(--good);color:#fff;box-shadow:0 4px 0 var(--good-dark);font-size:1.4rem}
.go{display:block;width:100%;margin-top:12px;padding:13px;border-radius:18px;background:var(--good);color:#fff;font-size:1.3rem;font-weight:800;box-shadow:0 5px 0 var(--good-dark)}
.help{background:var(--card);border-radius:22px;padding:12px 12px 16px;box-shadow:0 5px 0 var(--line);text-align:center}
.help .said{color:var(--muted);margin:0 0 8px;font-weight:700}
.help .tip{background:#FFF4CC;border-radius:12px;padding:8px 12px;margin:10px 0 0;font-size:1.05rem;text-align:left}
.result{text-align:center;padding-top:20px}
.rbig{font-size:clamp(3.2rem,16vw,4.6rem);font-weight:800;line-height:1;margin:6px 0}
.rsub{color:var(--muted);font-size:1.15rem;margin:0 0 14px}
.big{display:block;width:100%;padding:12px 16px;border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:1.2rem;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:6;max-width:90vw;text-align:center}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:7}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
<section id="home" class="screen">
  <a class="back" href="../">← Till huvudmenyn</a>
  <h1>Hundrarutan</h1>
  <p class="lead">Upptäck mönstren: ett steg åt sidan är ett mer eller mindre, ett steg upp eller ner är tio.</p>
  <div class="areas" id="areas"></div>
  <p class="note">Tre stjärnor får du om alla tio uppgifter blir rätt direkt.</p>
</section>
<section id="game" class="screen" hidden>
  <div class="gtop"><button class="back" id="quit">← Avsluta</button><span class="info" id="info"></span></div>
  <div class="progress"><i id="prog"></i></div>
  <div class="task" id="task">
    <div class="instr"><button class="spk" id="spk" aria-label="Läs upp">🔊</button><span id="instr"></span></div>
    <div class="content" id="content"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </div>
  <div class="pad" id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="del" aria-label="Sudda">⌫</button><button data-k="0">0</button><button data-k="ok" class="okbtn">OK</button>
  </div>
  <div class="help" id="help" hidden>
    <p class="said" id="helpSaid"></p>
    <div id="helpVis"></div>
    <p class="tip" id="helpTip"></p>
    <button class="go" id="helpGo">Fortsätt</button>
  </div>
</section>
<section id="result" class="screen result" hidden>
  <h2 id="rTitle"></h2>
  <div class="rbig" id="rBig"></div>
  <p class="rsub" id="rSub"></p>
  <button class="go" id="rAgain">Spela igen</button>
  <button class="big" id="rHome">Välj något annat</button>
</section>
</div>
<div class="toast" id="toast" hidden></div>
<canvas id="fx" hidden></canvas>
<script src="../ljud.js"></script>
<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const KEY="mattespel-hundraruta-v1";
const data=(()=>{try{return Object.assign({stars:{}},JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return{stars:{}}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const num=(r,c)=>r*10+c+1, rc=n=>[Math.floor((n-1)/10),(n-1)%10];
const DIR={hoger:[0,1,"ett steg åt höger","+1"],vanster:[0,-1,"ett steg åt vänster","−1"],ner:[1,0,"ett steg ner","+10"],upp:[-1,0,"ett steg upp","−10"]};

/* ---------- Rita hundrarutan ---------- */
// cls: funktion (n) -> klass ; arrows: lista av [frånTal, tillTal]
function grid(cls,arrows,label){
  let h='<div class="h100">';
  for(let n=1;n<=100;n++){const k=cls(n)||"";h+=`<i class="${k}">${label?label(n):n}</i>`;}
  if(arrows&&arrows.length){
    h+='<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="ah" markerWidth="4" markerHeight="4" refX="2.6" refY="2" orient="auto"><path d="M0 0 L4 2 L0 4Z" fill="#E5484D"/></marker></defs>';
    arrows.forEach(([a,b])=>{const[ra,ca]=rc(a),[rb,cb]=rc(b),x1=ca*10+5,y1=ra*10+5,x2=cb*10+5,y2=rb*10+5,sx=(x2-x1)*.22,sy=(y2-y1)*.22;
      h+=`<line x1="${x1+sx}" y1="${y1+sy}" x2="${x2-sx}" y2="${y2-sy}" stroke="#E5484D" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah)" vector-effect="non-scaling-stroke" style="stroke-width:3.5px"/>`;});
    h+='</svg>';
  }
  return h+'</div>';
}

/* ---------- 1. Grannar (+1 / −1) ---------- */
function genGrannar(){
  const d=pickOne(["hoger","vanster"]),[dr,dc,txt,op]=DIR[d];let r,c;
  do{r=rnd(0,9);c=rnd(0,9);}while(c+dc<0||c+dc>9);
  const s=num(r,c),t=num(r,c+dc);
  const vis=grid(n=>n===s?"start":n===t?"goal":"",[[s,t]],n=>n===t?"?":n);
  return{kind:"keys",instr:`Vilket tal är ${txt} från ${s}?`,speak:`Vilket tal är ${txt} från ${s}?`,html:vis,answer:t,
    help:()=>({vis:grid(n=>n===s?"start":n===t?"goalok":"",[[s,t]]),tip:`Ett steg åt ${d==="hoger"?"höger är ett mer":"vänster är ett mindre"}: ${s} ${op[0]} 1 = ${t}.`})};
}
/* ---------- 2. Tio hopp (+10 / −10) ---------- */
function genTio(){
  const two=Math.random()<.3,d=pickOne(["ner","upp"]),[dr]=DIR[d],steps=two?2:1;let r,c;
  do{r=rnd(0,9);c=rnd(1,9);}while(r+dr*steps<0||r+dr*steps>9);
  const s=num(r,c),t=num(r+dr*steps,c),path=[s];for(let i=1;i<=steps;i++)path.push(num(r+dr*i,c));
  const arrows=path.slice(1).map((n,i)=>[path[i],n]);
  const vis=grid(n=>n===s?"start":n===t?"goal":(n-1)%10===0?"col1":"dim",arrows,n=>n===t?"?":n);
  const words=two?`två steg ${d}`:`ett steg ${d}`;
  return{kind:"keys",instr:`Starta på ${s}. Gå ${words}. Vilket tal hamnar du på?`,speak:`Starta på ${s}. Gå ${words}. Vilket tal hamnar du på?`,html:vis,answer:t,
    help:()=>({vis:grid(n=>n===s?"start":n===t?"goalok":path.includes(n)?"via":"",arrows),
      tip:`Ett steg ${d} är tio ${d==="ner"?"mer":"mindre"}. Entalen är desamma, bara tiotalen ändras: ${path.join(d==="ner"?" → ":" → ")}.`})};
}
/* ---------- 3. Flera steg ---------- */
function genSteg(){
  let s,path,moves;
  for(let tries=0;tries<200;tries++){
    const [r0,c0]=[rnd(1,8),rnd(1,8)];let r=r0,c=c0;path=[num(r,c)];moves=[];const n=rnd(2,4);let ok=true;
    for(let i=0;i<n;i++){const opts=Object.keys(DIR).filter(k=>{const[dr,dc]=DIR[k];return r+dr>=0&&r+dr<=9&&c+dc>=0&&c+dc<=9&&!path.includes(num(r+dr,c+dc));});
      if(!opts.length){ok=false;break;}const k=pickOne(opts);moves.push(k);r+=DIR[k][0];c+=DIR[k][1];path.push(num(r,c));}
    if(ok&&new Set(moves).size>1)break;
  }
  s=path[0];const t=path[path.length-1],arrows=path.slice(1).map((n,i)=>[path[i],n]);
  const vis=grid(n=>n===s?"start":n===t?"goal":"dim",arrows,n=>n===t?"?":n);
  const desc=moves.map(k=>DIR[k][3]).join(", ");
  return{kind:"keys",instr:`Starta på ${s} och följ pilarna. Vilket tal hamnar du på?`,speak:`Starta på ${s} och följ pilarna. Vilket tal hamnar du på?`,html:vis,answer:t,
    help:()=>({vis:grid(n=>n===s?"start":n===t?"goalok":path.includes(n)?"via":"",arrows),
      tip:`Gå ett steg i taget: ${path.join(" → ")}. Steg åt sidan är ±1 och steg upp eller ner är ±10 (${desc}).`})};
}
/* ---------- 4. Trasig hundraruta ---------- */
const SHAPES=[
  {name:"kors",cells:[[0,0],[-1,0],[1,0],[0,-1],[0,1]]},
  {name:"rad",cells:[[0,-2],[0,-1],[0,0],[0,1],[0,2]]},
  {name:"kolumn",cells:[[-2,0],[-1,0],[0,0],[1,0],[2,0]]},
  {name:"L",cells:[[-1,0],[0,0],[1,0],[1,1]]},
  {name:"trappa",cells:[[-1,-1],[0,-1],[0,0],[1,0],[1,1]]},
  {name:"block",cells:[[-1,-1],[-1,0],[-1,1],[0,-1],[0,0],[0,1],[1,-1],[1,0],[1,1]]}];
function genTrasig(){
  const sh=pickOne(SHAPES);let r,c;
  do{r=rnd(0,9);c=rnd(0,9);}while(!sh.cells.every(([dr,dc])=>r+dr>=0&&r+dr<=9&&c+dc>=0&&c+dc<=9));
  const cells=sh.cells.map(([dr,dc])=>({dr,dc,n:num(r+dr,c+dc)})),given=new Set([num(r,c)]);
  if(sh.name==="block"&&Math.random()<.5)given.add(pickOne(cells.filter(x=>x.n!==num(r,c))).n);
  const minR=Math.min(...cells.map(x=>x.dr)),minC=Math.min(...cells.map(x=>x.dc)),H=Math.max(...cells.map(x=>x.dr))-minR+1,W=Math.max(...cells.map(x=>x.dc))-minC+1;
  const blanks=cells.filter(x=>!given.has(x.n)).map(x=>x.n);
  const layout=(state,mark)=>{let h=`<div class="frag" style="grid-template-columns:repeat(${W},auto)">`;
    for(let i=0;i<H;i++)for(let j=0;j<W;j++){const x=cells.find(q=>q.dr-minR===i&&q.dc-minC===j);
      if(!x){h+=`<span class="fc none"></span>`;continue;}
      if(given.has(x.n)){h+=`<span class="fc given">${x.n}</span>`;continue;}
      const v=state.vals[x.n]||"";let cl="fc blank"+(state.sel===x.n?" sel":"");
      if(mark)cl="fc "+(+v===x.n?"right":"wrong");
      h+=`<span class="${cl}" data-n="${x.n}">${mark&&+v!==x.n?`${v||"–"}`:v||(state.sel===x.n?"_":"")}</span>`;}
    return h+"</div>";};
  return{kind:"fill",instr:"Hundrarutan har gått sönder! Fyll i talen som fattas.",speak:"Hundrarutan har gått sönder. Tryck på en tom ruta och skriv talet som ska stå där. Tryck på OK när alla är ifyllda.",
    blanks,layout,center:num(r,c),
    help:(state)=>({vis:layout(state,true)+`<div style="margin-top:10px">`+grid(n=>n===num(r,c)?"start":cells.some(x=>x.n===n)?"frag":"")+`</div>`,
      tip:`Utgå från ${num(r,c)}. Ett steg åt sidan är ett mer eller mindre, ett steg upp eller ner är tio mer eller mindre. De röda rutorna blev fel. Rätt tal syns i hundrarutan under.`})};
}

/* ---------- Områden ---------- */
const mini=(fill)=>{let s='<svg viewBox="0 0 76 64" aria-hidden="true"><rect x="2" y="2" width="72" height="60" rx="8" fill="#fff" stroke="#C6D6F2" stroke-width="2"/>';
  for(let r=0;r<4;r++)for(let c=0;c<5;c++){const f=fill(r,c);s+=`<rect x="${7+c*13.2}" y="${6+r*13.5}" width="11" height="11.5" rx="2.5" fill="${f||"#EAF3FF"}"/>`;}return s+'</svg>';};
const AREAS=[
  {id:"grannar",name:"Grannar",desc:"Ett steg åt sidan: +1 och −1",ak:"Åk 1",c:"#2BB673",gen:genGrannar,ico:mini((r,c)=>r===1&&c===2?"#3D8BFD":r===1&&c===3?"#FFC93C":"")},
  {id:"tio",name:"Tio hopp",desc:"Ett steg upp eller ner: +10 och −10",ak:"Åk 1–2",c:"#3D8BFD",gen:genTio,ico:mini((r,c)=>r===0&&c===2?"#3D8BFD":r===2&&c===2?"#FFC93C":r===1&&c===2?"#C9DBFF":"")},
  {id:"steg",name:"Flera steg",desc:"Följ pilarna till målet",ak:"Åk 2",c:"#7B61FF",gen:genSteg,ico:mini((r,c)=>r===0&&c===0?"#3D8BFD":(r===1&&c===0)||(r===1&&c===1)||(r===2&&c===1)?"#C9DBFF":r===2&&c===2?"#FFC93C":"")},
  {id:"trasig",name:"Trasig hundraruta",desc:"Fyll i talen som fattas",ak:"Åk 2",c:"#FF9F43",gen:genTrasig,ico:mini((r,c)=>r===1&&c===2?"#3D8BFD":(r===0&&c===2)||(r===2&&c===2)||(r===1&&c===1)||(r===1&&c===3)?"#FFF4CC":"")}
];
const starHtml=n=>`<span class="stars">${[1,2,3].map(i=>i<=n?"★":'<span class="off">★</span>').join("")}</span>`;
function show(id){document.querySelectorAll(".screen").forEach(s=>s.hidden=s.id!==id);window.scrollTo(0,0);}
function openHome(){G=null;if("speechSynthesis" in window)speechSynthesis.cancel();
  $("areas").innerHTML=AREAS.map(a=>`<button class="acard" data-a="${a.id}" style="--c:${a.c}"><span class="ico">${a.ico}</span><b>${a.name}</b><small>${a.desc}</small><span class="ak">${a.ak}</span>${starHtml(data.stars[a.id]||0)}</button>`).join("");
  show("home");}
$("areas").onclick=e=>{const b=e.target.closest("[data-a]");if(b)start(AREAS.find(a=>a.id===b.dataset.a));};

/* ---------- Uppläsning ---------- */
let svVoice=null;function loadVoices(){try{svVoice=speechSynthesis.getVoices().find(v=>/^sv/i.test(v.lang))||null}catch(e){}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
function speak(text){if(!("speechSynthesis" in window))return toast("Uppläsning fungerar inte i den här webbläsaren.");loadVoices();
  if(!svVoice&&speechSynthesis.getVoices().length)return toast("Den här datorn har ingen svensk röst för uppläsning.");
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="sv-SE";if(svVoice)u.voice=svVoice;u.rate=.9;speechSynthesis.speak(u);}
$("spk").onclick=()=>{if(G&&G.t)speak(G.t.speak);};

/* ---------- Spelet ---------- */
const ROUND=10;let G=null;
function start(area){G={area,n:ROUND,i:-1,missed:0,pending:[]};show("game");next();}
function next(){
  G.i++;if(G.i>=G.n)return finish();
  let t=null;if(G.pending.length&&G.pending[0].at<=G.i)t=G.pending.shift().t;
  if(!t){for(let k=0;k<6;k++){t=G.area.gen();if(t.instr+(t.answer||t.center)!==G.lastKey)break;}}
  G.lastKey=t.instr+(t.answer||t.center);G.t=t;G.first=true;G.input="";G.busy=false;
  if(t.kind==="fill")G.state={vals:{},sel:t.blanks[0]};
  if("speechSynthesis" in window)speechSynthesis.cancel();
  $("info").textContent=`${G.i+1} av ${G.n}`;$("prog").style.width=(G.i/G.n*100)+"%";
  $("instr").textContent=t.instr;$("feedback").textContent="";$("task").className="task";$("help").hidden=true;$("task").hidden=false;$("pad").hidden=false;
  render();
}
function render(){
  const t=G.t,c=$("content");
  if(t.kind==="keys"){c.innerHTML=t.html+`<div class="ansrow">Svar: <span class="box1" id="box">${G.input||"?"}</span></div>`;}
  else{c.innerHTML=t.layout(G.state,false);
    c.querySelectorAll(".fc.blank").forEach(el=>el.onclick=()=>{if(G.busy)return;G.state.sel=+el.dataset.n;G.input=G.state.vals[G.state.sel]||"";render();});}
}
function press(k){
  if(!G||G.busy)return;const t=G.t;
  if(t.kind==="keys"){
    if(k==="del")G.input=G.input.slice(0,-1);
    else if(k==="ok"){if(G.input!=="")(+G.input===t.answer?done():wrong(G.input));return;}
    else if(G.input.length<3)G.input+=k;
    $("box").textContent=G.input||"?";return;}
  // fill
  const st=G.state;
  if(k==="del"){st.vals[st.sel]=(st.vals[st.sel]||"").slice(0,-1);render();return;}
  if(k==="ok"){
    if(t.blanks.some(n=>!st.vals[n])){const nx=t.blanks.find(n=>!st.vals[n]);st.sel=nx;render();$("feedback").textContent="Fyll i alla rutor först.";$("feedback").style.color="var(--muted)";return;}
    $("feedback").style.color="";t.blanks.every(n=>+st.vals[n]===n)?done():wrong("");return;}
  const v=(st.vals[st.sel]||"");if(v.length<3){st.vals[st.sel]=v+k;}
  // hoppa vidare till nästa tomma ruta när talet är komplett (två siffror, eller 100)
  const cur=st.vals[st.sel];if(cur.length>=String(st.sel).length){const nx=t.blanks.find(n=>!st.vals[n]);if(nx)st.sel=nx;}
  render();
}
document.querySelectorAll("#pad button").forEach(b=>b.onclick=()=>press(b.dataset.k));
document.addEventListener("keydown",e=>{if($("game").hidden||!G)return;if(!$("help").hidden){if(e.key==="Enter"){e.preventDefault();$("helpGo").click();}return;}
  if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==="Backspace"){e.preventDefault();press("del");}else if(e.key==="Enter"){e.preventDefault();press("ok");}});
const PRAISE=["Rätt!","Snyggt!","Bra!","Toppen!","Klockrent!"];
function done(){G.busy=true;window.Ljud&&Ljud.ok();$("task").className="task ok";$("feedback").textContent=G.first?pickOne(PRAISE):"Nu blev det rätt!";
  if(G.t.kind==="fill")$("content").innerHTML=G.t.layout(G.state,true);setTimeout(next,1000);}
function wrong(given){
  G.busy=true;window.Ljud&&Ljud.bad();if(G.first)G.missed++;G.first=false;
  const hp=G.t.help(G.state);
  $("helpSaid").textContent=given?`Du svarade ${given}. Så här är det:`:"Några rutor blev fel. Så här är det:";
  $("helpVis").innerHTML=hp.vis;$("helpTip").textContent="Tips: "+hp.tip;
  setTimeout(()=>{$("task").hidden=true;$("pad").hidden=true;$("help").hidden=false;$("helpGo").focus({preventScroll:true});},450);
}
$("helpGo").onclick=()=>{G.pending.push({t:G.t,at:G.i+3});G.n++;next();};
$("quit").onclick=openHome;
function finish(){
  const right=Math.max(0,ROUND-G.missed),st=right===ROUND?3:right>=ROUND-2?2:1,id=G.area.id;
  if(st>(data.stars[id]||0)){data.stars[id]=st;save();}
  $("rTitle").textContent=st===3?"Alla rätt direkt!":st===2?"Bra jobbat!":"Klart!";
  $("rBig").innerHTML=starHtml(st);$("rSub").textContent=`${right} av ${ROUND} rätt på första försöket.`;
  show("result");if(st===3){window.Ljud&&Ljud.fanfare();confetti();}
}
$("rAgain").onclick=()=>start(G.area);$("rHome").onclick=openHome;
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cols=["#3D8BFD","#FF9F43","#2BB673","#FFC93C","#7B61FF","#FF6B6B"];
  const c=$("fx"),x=c.getContext("2d"),dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);c.hidden=false;
  const P=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*120,y:H*.3,vx:(Math.random()-.5)*16,vy:-Math.random()*15-4,r:Math.random()*7+5,c:pickOne(cols),a:Math.random()*6,va:(Math.random()-.5)*.4}));
  const t0=performance.now();(function f(now){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(now-t0<2800)requestAnimationFrame(f);else{x.clearRect(0,0,W,H);c.hidden=true;}})(t0);
}
openHome();
</script>
</body>
