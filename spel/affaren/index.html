<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Affären – Matte-Portalen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6E8; --ink:#1D2B53; --muted:#6B5F7A; --card:#FFFFFF; --line:#F0D9B8;
  --good:#1E9E5E; --good-dark:#157548; --bad:#E5484D; --accent:#E5484D; --gold:#F2B707;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible{outline:3px solid #3D5AFE;outline-offset:3px}
[hidden]{display:none !important}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 40px}
.stars{color:var(--gold);letter-spacing:2px}.stars .off{color:#EADFCB}
h1{font-size:2.6rem;line-height:1;margin:12px 0 4px;font-weight:800}
h2{font-size:1.6rem;margin:18px 0 8px;font-weight:800}
.lead{margin:0 0 12px;color:var(--muted);font-weight:700}
.back{color:var(--muted);font-weight:700;padding:6px 0;font-size:1rem}

/* ---------- Affären (scenen) ---------- */
.shop{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(#FCE9C9,#F8DDB0);box-shadow:0 5px 0 #D9B07A;height:var(--h,340px);user-select:none;-webkit-user-select:none;--w:34px}
.awn{position:absolute;left:0;right:0;top:0;height:34px;background:repeating-linear-gradient(90deg,var(--a1,#E5484D) 0 32px,#fff 32px 64px)}
.awn::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px;background:radial-gradient(circle at 16px 0,var(--a1,#E5484D) 15px,transparent 16px) 0 0/64px 14px,radial-gradient(circle at 48px 0,#fff 15px,transparent 16px) 0 0/64px 14px}
.lights{position:absolute;left:0;right:0;top:48px;height:14px;display:flex;justify-content:space-around}
.lights i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);animation:tw 1.6s infinite alternate}
.lights i:nth-child(2n){animation-delay:.8s}
@keyframes tw{to{opacity:.45}}
.sign{position:absolute;left:50%;top:52px;transform:translateX(-50%);background:#8A5A2B;color:#FFE7A3;font-weight:800;border-radius:10px;padding:0 14px;font-size:.95rem;box-shadow:0 3px 0 #5E3B18;white-space:nowrap;z-index:1}
.shelves{position:absolute;left:3%;right:3%;top:80px;display:flex;flex-direction:column;gap:4px}
.shelf{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 6px;padding:0 4px 4px;border-bottom:7px solid #B07A3F;box-shadow:0 4px 0 rgba(90,50,10,.15)}
.ware{display:flex;flex-direction:column;align-items:center;width:var(--w,46px)}
.spr{width:var(--w,46px);height:var(--w,46px);background:url(bilder/varor.png) no-repeat;background-size:calc(var(--w,46px)*8) auto;background-position:calc(var(--x)*var(--w,46px)*-1) calc(var(--y)*var(--w,46px)*-1)}
.tag{font-size:.64rem;font-weight:800;background:#fff;border-radius:6px;padding:0 4px;line-height:1.35;box-shadow:0 1px 0 rgba(0,0,0,.15);white-space:nowrap;margin-top:-4px}
.tag.offer{background:#FFD43B}
.tag.slut{background:#E5484D;color:#fff}
.ware{position:relative}
.ware .cnt{position:absolute;top:-3px;right:-5px;background:#1D2B53;color:#fff;font-size:.6rem;font-style:normal;font-weight:800;border-radius:8px;padding:0 4px;line-height:1.4}
.ware.out .spr{opacity:.25;filter:grayscale(1)}
.onc .ware .cnt{display:none}
/* påfyllningen */
.lrows{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;background:var(--card);border-radius:16px;padding:8px 12px;box-shadow:0 3px 0 var(--line)}
.lrow .spr{--w:46px;flex:none}
.lrow .nm{flex:1 1 150px;min-width:0;line-height:1.2}.lrow .nm b{display:block}.lrow .nm small{color:var(--muted);font-weight:700}
.step{display:flex;align-items:center;gap:6px;margin-left:auto}
.step button{width:40px;height:40px;border-radius:12px;background:#F3E6CB;font-weight:800;font-size:1.3rem}
.step span{min-width:1.4em;text-align:center;font-weight:800;font-size:1.2rem}
.lrow .bst{padding:8px 12px;border-radius:12px;background:#1E9E5E;color:#fff;font-weight:800;box-shadow:0 3px 0 #157548}
.lrow .bst:disabled{background:#E5E0D6;color:#9A8F80;box-shadow:none}
.lrow.full{opacity:.6}
.order{background:#fff;border-radius:18px;box-shadow:0 0 0 3px #3D5AFE,0 4px 0 var(--line);padding:12px;margin:0 0 12px}
.counter{position:absolute;left:0;right:0;bottom:0;height:36%;background:linear-gradient(#C8874A,#A86F36);border-top:7px solid #8A5A2B;z-index:2}
.keeper{position:absolute;right:3%;bottom:31%;width:clamp(78px,22%,120px);z-index:1}
.cust{position:absolute;left:3%;bottom:31%;width:clamp(78px,22%,120px);z-index:1;transition:transform .5s cubic-bezier(.3,1.2,.5,1),opacity .4s}
.cust.away{transform:translateX(-140%);opacity:0}
.keeper svg,.cust svg{width:100%;height:auto;display:block}
.flowers{position:absolute;bottom:35%;display:flex;gap:2px;z-index:3}
.flowers.l{left:30%}.flowers.r{right:30%}
.pot{width:20px;height:30px;position:relative}
.pot::before{content:"";position:absolute;left:3px;right:3px;bottom:0;height:12px;background:#C2410C;border-radius:0 0 5px 5px}
.pot::after{content:"";position:absolute;left:3px;top:0;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 4px 0 -2px #2BB673}
.bubble{position:relative;margin:12px 0 4px;background:#fff;border-radius:16px;padding:8px 48px 8px 14px;font-weight:800;font-size:clamp(1rem,4.2vw,1.2rem);line-height:1.25;box-shadow:0 3px 0 var(--line)}
.bubble::after{content:"";position:absolute;left:40px;bottom:100%;border:10px solid transparent;border-bottom-color:#fff}
.bubble .spk{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:#FFF1D6;font-size:1rem}
.reg{position:absolute;right:27%;bottom:35%;width:72px;z-index:3}
.reg .scr{background:#1D2B53;color:#7CF2A8;font-weight:800;font-variant-numeric:tabular-nums;border-radius:6px 6px 0 0;text-align:center;font-size:1rem;padding:1px 4px;min-height:1.6em}
.reg .box{height:26px;background:var(--rc,#6B7894);border-radius:0 0 6px 6px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.onc{position:absolute;left:4%;right:4%;bottom:2%;height:30%;z-index:4;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;z-index:2}
.onc .ware{--w:46px}
.onc .ware.pick{cursor:pointer;border-radius:12px;padding:2px;transition:transform .12s}
.onc .ware.pick.sel{background:rgba(61,90,254,.25);box-shadow:0 0 0 3px #3D5AFE;transform:translateY(-4px)}
.qty{font-weight:800;color:#fff;font-size:1.3rem;text-shadow:0 2px 0 rgba(0,0,0,.3)}
/* pengarna (egen enkel design, inte kopior av riktiga sedlar och mynt) */
.coin{display:inline-grid;place-items:center;border-radius:50%;font-weight:800;color:#3B2A14;line-height:1;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 2px 0 rgba(0,0,0,.2)}
.coin small{font-size:.5em;display:block;margin-top:-2px}
.coin.s{background:radial-gradient(circle at 35% 30%,#fff,#D5DBE3 45%,#9AA5B4)}
.coin.g{background:radial-gradient(circle at 35% 30%,#FFF4C4,#F2C94C 45%,#B8860B)}
.note{display:inline-grid;place-items:center;border-radius:6px;font-weight:800;color:#fff;line-height:1;flex:none;position:relative;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.25);text-shadow:0 1px 0 rgba(0,0,0,.3)}
.note::before{content:"";position:absolute;inset:4px;border:2px solid rgba(255,255,255,.45);border-radius:4px}
.note::after{content:"";position:absolute;right:8%;top:50%;width:26%;aspect-ratio:1;transform:translateY(-50%);border-radius:50%;background:rgba(255,255,255,.25)}
/* ---------- Panelen under scenen ---------- */
.panel{max-width:620px;margin:10px auto 0}
.ask{font-weight:800;font-size:1.2rem;text-align:center;margin:0 0 6px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.ans{min-width:96px;height:52px;border-radius:14px;border:3px solid #3D5AFE;background:#fff;display:inline-grid;place-items:center;font-size:1.7rem;font-weight:800;padding:0 10px}
.ans.bad{border-color:var(--bad);background:#FFE3E5;color:var(--bad)}.ans.ok{border-color:var(--good);background:#E3F7EC;color:var(--good-dark)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:50px;border-radius:16px;background:var(--card);font-size:1.7rem;font-weight:800;box-shadow:0 4px 0 var(--line)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad .okbtn{background:var(--good);color:#fff;box-shadow:0 4px 0 var(--good-dark);font-size:1.4rem}
.tray{min-height:76px;background:#fff;border-radius:16px;box-shadow:inset 0 0 0 3px #3D5AFE;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:8px;position:relative}
.tray.bad{box-shadow:inset 0 0 0 3px var(--bad);background:#FFF1F2}.tray.ok{box-shadow:inset 0 0 0 3px var(--good);background:#EDFAF2}
.tray:empty::before{content:"Tryck på pengarna i kassalådan";color:#9AA5B4;font-weight:700}
.tray button{animation:drop .25s}
@keyframes drop{from{transform:translateY(-14px) scale(.8);opacity:0}}
.traysum{text-align:center;font-weight:800;color:var(--muted);margin:4px 0}
.drawer{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:#6B4423;border-radius:16px;padding:10px;margin-top:8px;box-shadow:inset 0 4px 0 rgba(0,0,0,.25)}
.drawer button{padding:2px}
.drawer button:active{transform:scale(.94)}
.row2{display:flex;gap:8px;margin-top:10px}
.row2 button{flex:1;padding:12px;border-radius:16px;font-weight:800;font-size:1.15rem}
.done{background:var(--good);color:#fff;box-shadow:0 4px 0 var(--good-dark)}
.help{background:var(--card);box-shadow:0 4px 0 var(--line)}
.fb{min-height:1.4em;text-align:center;font-weight:800;margin:8px 0;color:var(--good-dark);line-height:1.3}
.fb.hint{background:#FFE9EC;color:#9B2C3A;border-radius:14px;padding:8px 12px}
.line{display:block;width:100%;height:auto;margin:6px 0}
.go{display:block;width:100%;margin-top:12px;padding:14px;border-radius:20px;font-weight:800;font-size:1.35rem;color:#fff;background:linear-gradient(180deg,#FF6B6B,#E5484D);box-shadow:0 6px 0 #A8323A}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #A8323A}
.alt{display:block;width:100%;margin-top:12px;padding:12px;border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:1.2rem}
/* ---------- Spelskärmen ---------- */
#game{min-height:100dvh}
.hud{display:flex;align-items:center;gap:8px;padding:8px 12px 6px;max-width:760px;margin:0 auto}
.hb{width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:0 3px 0 var(--line);font-size:1.2rem;font-weight:800;display:grid;place-items:center;flex:none}
.hud .t{font-weight:800}
.hud .kassa{margin-left:auto;background:#1D2B53;color:#FFE7A3;border-radius:999px;padding:3px 12px;font-weight:800;white-space:nowrap}
#gwrap{max-width:760px;margin:0 auto;padding:0 12px 24px}
/* ---------- Menyn ---------- */
.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lvl{background:var(--card);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 var(--line);text-align:left}
.lvl[aria-pressed="true"]{box-shadow:0 0 0 3px #E5484D,0 4px 0 var(--line)}
.lvl b{display:block;font-size:1.15rem}.lvl small{display:block;color:var(--muted);font-weight:700;line-height:1.2}
.mine{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 14px;box-shadow:0 4px 0 var(--line);margin-top:14px;width:100%;text-align:left}
.mine b{font-size:1.2rem;display:block}.mine small{color:var(--muted);font-weight:700}
.mine .k{margin-left:auto;background:#1D2B53;color:#FFE7A3;border-radius:999px;padding:3px 12px;font-weight:800;white-space:nowrap}
.ups{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.up{background:var(--card);border-radius:18px;padding:10px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.up .ic{height:52px;display:flex;align-items:center;justify-content:center;gap:2px}
.up .ic .spr{--w:40px}
.up b{font-size:1.05rem;line-height:1.15}.up small{color:var(--muted);font-weight:700;font-size:.85rem;line-height:1.2}
.up .buy{margin-top:6px;width:100%;padding:8px;border-radius:12px;font-weight:800;background:#1E9E5E;color:#fff;box-shadow:0 3px 0 #157548}
.up .buy:disabled{background:#E5E0D6;color:#9A8F80;box-shadow:none;cursor:default}
.up.own{background:#EDFAF2}
.up .own{margin-top:6px;font-weight:800;color:var(--good-dark)}
.res{text-align:center}
.res .big{font-size:2.6rem;font-weight:800;line-height:1.1}
.res .stars{font-size:2.6rem}
.res p{color:var(--muted);font-weight:700;margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:9;max-width:90vw;text-align:center}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
@media(min-width:700px){.shop{--h:400px;--w:44px}.onc .ware{--w:58px}.tag{font-size:.76rem}.keeper,.cust{width:130px}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<section id="home" class="screen">
<div class="wrap">
  <h1>Affären</h1>
  <p class="lead">Du står i kassan! Räkna ihop, ge växel och hjälp kunderna. Pengarna du tjänar bygger ut din affär.</p>
  <div id="homeShop"></div>
  <h2>Vilken nivå?</h2>
  <div class="levels" id="levels"></div>
  <button class="go" id="play">Öppna affären ▶</button>
  <button class="mine" id="lagerBtn"><span><b>🚚 Fyll på hyllorna</b><small id="lagerInfo">Beställ varor som håller på att ta slut</small></span></button>
  <button class="mine" id="mineBtn"><span><b>🏪 Min affär</b><small>Köp nya varor och saker till affären</small></span><span class="k" id="mineK"></span></button>
</div>
</section>
<section id="mine" class="screen" hidden>
<div class="wrap">
  <button class="back" id="mineBack">← Affären</button>
  <h1>Min affär</h1>
  <p class="lead">I kassan: <b id="mineKassa"></b>. Det du köper syns i affären när du spelar.</p>
  <div id="mineShop"></div>
  <h2>Varor</h2><div class="ups" id="upsVaror"></div>
  <h2>Inredning</h2><div class="ups" id="upsInred"></div>
</div>
</section>
<section id="lager" class="screen" hidden>
<div class="wrap">
  <button class="back" id="lagerBack">← Affären</button>
  <h1>Fyll på hyllorna</h1>
  <p class="lead">I kassan: <b id="lagerKassa"></b>. Välj hur många du vill beställa och räkna ut vad det kostar.</p>
  <div id="order"></div>
  <div class="lrows" id="lrows"></div>
</div>
</section>
<section id="game" class="screen" hidden>
  <div class="hud"><button class="hb" id="quit" aria-label="Stäng affären">✕</button><span class="t" id="hudT"></span><span class="kassa" id="hudK"></span></div>
  <div id="gwrap">
    <div id="gameShop"></div>
    <div class="panel" id="panel"></div>
  </div>
</section>
<section id="result" class="screen" hidden>
<div class="wrap res">
  <h2 id="rTitle"></h2>
  <div id="rStars"></div>
  <div class="big" id="rKassa"></div>
  <p id="rSub"></p>
  <button class="go" id="rAgain">Ny dag ▶</button>
  <button class="alt" id="rLager">🚚 Fyll på hyllorna</button>
  <button class="alt" id="rMine">🏪 Min affär</button>
  <button class="alt" id="rHome">Till menyn</button>
</div>
</section>
<div class="toast" id="toast" hidden></div>
<canvas id="fx" hidden></canvas>
<script src="../../ljud.js"></script>
<script src="../../djur.js"></script>
<script src="../../huvud.js" data-titel="Affären" data-ikon="🏪" data-hem="../../" data-helskarm="game"></script>
<script>
/* Affären: eleven står i kassan. En dag = 8 kunder med olika önskemål: räkna ihop, räkna kundens pengar, ge växel
   (tryck på mynt och sedlar i kassalådan, alla rätta kombinationer godtas) och välja två varor för en viss summa.
   Pengarna man tjänar sparas och köper nya varor och inredning i "Min affär". Mynt och sedlar har en egen enkel design.
   Varubilderna: Kenneys "Food Kit" (CC0), bilder/varor.png (8 i bredd, 64 px). */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const KEY="mattespel-affaren-v1";
const data=(()=>{try{return Object.assign({stars:{},kassa:0,own:[],niva:1,dagar:0,lager:{}},JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return{stars:{},kassa:0,own:[],niva:1,dagar:0}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Varor och inredning ---------- */
const VAROR=["äpple","banan","apelsin","päron","citron","morot","ägg","ost","jordgubbe","körsbär","vindruvor","vattenmelon","croissant","limpa","muffins","cupcake","munk","kaka","tårta","våffla",
  "isglass","glasspokal","glassbägare","choklad","chokladbit","klubba","läsk","läskflaska","mjölk","honung","korv med bröd","smörgås","pizza","pannkakor"];
const KAT={frukt:[0,1,2,3,4,5,6,7],bar:[8,9,10,11],bageri:[12,13,14,15,16,17,18,19],glass:[20,21,22],godis:[23,24,25,29],kyl:[26,27,28],grill:[30,31,32,33]};
const UPS=[
  {id:"bar",typ:"varor",name:"Bärlådan",desc:"Jordgubbar, körsbär, vindruvor och melon",pris:40},
  {id:"godis",typ:"varor",name:"Godishyllan",desc:"Choklad, klubbor och honung",pris:60},
  {id:"bageri",typ:"varor",name:"Bageridisken",desc:"Bullar, munkar, kakor och tårta",pris:90},
  {id:"kyl",typ:"varor",name:"Kylen",desc:"Läsk och mjölk",pris:120},
  {id:"glass",typ:"varor",name:"Glassfrysen",desc:"Isglass och glasspokaler",pris:150},
  {id:"grill",typ:"varor",name:"Grillen",desc:"Korv med bröd, pizza och pannkakor",pris:220},
  {id:"skylt",typ:"inred",name:"Skylt",desc:"Affären får ditt djurs namn",pris:30},
  {id:"blommor",typ:"inred",name:"Blommor",desc:"Krukor på disken",pris:50},
  {id:"markis",typ:"inred",name:"Grön markis",desc:"Ny färg på markisen",pris:70},
  {id:"lampor",typ:"inred",name:"Ljusslinga",desc:"Lampor som blinkar",pris:100},
  {id:"guld",typ:"inred",name:"Guldkassa",desc:"En kassaapparat i guld",pris:300}];
const has=id=>data.own.includes(id);
const sortiment=()=>[...KAT.frukt,...["bar","godis","bageri","kyl","glass","grill"].filter(has).flatMap(k=>KAT[k])];
/* Lager: varje vara finns i högst 4 exemplar på hyllan. Kunderna handlar ur lagret, och man fyller på i "Fyll på hyllorna"
   (eleven räknar ut vad beställningen kostar, "3 äpplen som kostar 2 kr styck", och betalar ur kassan). */
const FULL=4;
const INK=[2,2,2,2,1,1,1,4, 3,3,3,4, 3,3,2,3,2,1,4,2, 2,4,3, 2,1,1, 2,3,2, 3, 3,3,4,3]; // inköpspris per vara
if(!data.lager)data.lager={};
function initLager(){sortiment().forEach(i=>{if(data.lager[i]==null)data.lager[i]=FULL;});}

function show(id){document.querySelectorAll(".screen").forEach(s=>s.hidden=s.id!==id);window.scrollTo(0,0);if(window.MPS)MPS.visa(id);}
const starHtml=n=>`<span class="stars">${[1,2,3].map(i=>i<=n?"★":'<span class="off">★</span>').join("")}</span>`;

document.addEventListener("click",e=>{const b=e.target.closest(".buy[data-u]");if(!b)return;const u=UPS.find(x=>x.id===b.dataset.u);if(!u||has(u.id)||data.kassa<u.pris)return;

/* ---------- Fyll på hyllorna ---------- */
let L={q:{},ord:null};
function openLager(){initLager();
  // grossisten hjälper till om kassan är tom och hyllorna nästan tomma, så att man aldrig kör fast
  const tot=sortiment().reduce((a,i)=>a+lag(i),0),billig=Math.min(...sortiment().map(i=>INK[i]));
  if(tot<6&&data.kassa<billig*2){KAT.frukt.forEach(i=>data.lager[i]=FULL);save();toast("Grossisten bjöd på en låda frukt! 🍎");}
  L.ord=null;renderLager();show("lager");}
function renderLager(){$("lagerKassa").textContent=`${data.kassa} kr`;
  $("lrows").innerHTML=sortiment().map(i=>{const left=lag(i),max=FULL-left,q=Math.min(L.q[i]||Math.min(max,FULL-left),max);L.q[i]=q;
    return `<div class="lrow${max?"":" full"}">${spr(i)}<span class="nm"><b>${NAMN(i)}</b><small>${left} av ${FULL} kvar · ${INK[i]} kr styck</small></span>${max?`<span class="step"><button data-m="${i}" aria-label="Färre">−</button><span>${q}</span><button data-p="${i}" aria-label="Fler">+</button></span><button class="bst" data-b="${i}" ${q?"":"disabled"}>Beställ</button>`:"<small><b>Full</b></small>"}</div>`;}).join("");
  $("lrows").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const i=+b.dataset.m;L.q[i]=Math.max(0,(L.q[i]||0)-1);renderLager();});
  $("lrows").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const i=+b.dataset.p;L.q[i]=Math.min(FULL-lag(i),(L.q[i]||0)+1);renderLager();});
  $("lrows").querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{const i=+b.dataset.b;L.ord={i,q:L.q[i],inp:"",tries:0,msg:""};renderOrder();window.scrollTo({top:0,behavior:"smooth"});});
  renderOrder();}
function renderOrder(){const o=L.ord,el=$("order");if(!o){el.innerHTML="";return;}
  el.innerHTML=`<div class="order"><p class="ask">${ANTAL(o.q,o.i)} som kostar ${INK[o.i]} kr styck. Vad kostar det?</p><p class="ask"><span class="ans${o.bad?" bad":""}">${o.inp||" "}</span> kr</p><div class="fb${o.hint?" hint":""}">${o.msg}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button data-k="del" aria-label="Sudda">⌫</button><button data-k="0">0</button><button data-k="ok" class="okbtn">OK</button></div>
    <button class="alt" id="ordX" style="margin-top:8px">Avbryt</button></div>`;
  el.querySelectorAll(".pad [data-k]").forEach(b=>b.onclick=()=>orderKey(b.dataset.k));$("ordX").onclick=()=>{L.ord=null;renderOrder();};}
function orderKey(k){const o=L.ord;if(!o)return;
  if(k==="del"){o.inp=o.inp.slice(0,-1);o.bad=false;renderOrder();return;}
  if(k!=="ok"){if(o.bad){o.inp="";o.bad=false;}if(o.inp.length<3)o.inp+=k;renderOrder();return;}
  if(!o.inp)return;const cost=o.q*INK[o.i],v=+o.inp,lista=Array(o.q).fill(INK[o.i]).join(" + ");
  if(v!==cost){o.tries++;window.Ljud&&Ljud.bad&&Ljud.bad();
    if(o.tries<2){o.bad=true;o.hint=true;o.msg=o.q>1?`Det är ${INK[o.i]} kr ${o.q} gånger: ${lista} = ?`:`En kostar ${INK[o.i]} kr.`;renderOrder();return;}
    o.msg=`Det kostar ${lista} = ${cost} kr.`;}
  if(data.kassa<cost){o.hint=true;o.msg=`Det kostar ${cost} kr, men i kassan finns bara ${data.kassa} kr. Beställ färre.`;o.inp="";renderOrder();return;}
  data.kassa-=cost;data.lager[o.i]=Math.min(FULL,lag(o.i)+o.q);save();window.Ljud&&Ljud.kaching&&Ljud.kaching();
  toast(`${o.tries?"":"Rätt! "}${ANTAL(o.q,o.i)} för ${cost} kr ligger nu på hyllan.`);L.q[o.i]=0;L.ord=null;renderLager();}
$("lagerBack").onclick=()=>openHome();

/* ---------- Dagen ---------- */
let G=null;
function startDay(){const N=NIVA[data.niva],sor=sortiment(),prices={};
  initLager();sor.forEach(i=>prices[i]=Math.max(INK[i]+1,rnd(N.pris[0],N.pris[1])));
  // erbjudande på nivå 4: "2 för X kr" på en vara
  let offer=null;if(data.niva===4){const i=pick(sor);offer={i,p:prices[i]*2-rnd(2,Math.max(3,Math.floor(prices[i]/2)))};}
  // kunderna: blandade uppgifter, alla sorter varje dag
  const typer=shuffle(["summa","summa","vaxel","vaxel","rakna","budget","vaxla",data.niva===4?"styck":pick(["rakna","vaxel","summa"])]);
  G={N,niva:data.niva,prices,offer,typer,k:0,miss:0,kassa:0,slut:[]};
  show("game");nextCust();}
function custCfg(){const pet=lasDjur(),an=pick(WARD.animal.items.map(x=>x.id).filter(a=>a!==pet.animal));
  return{animal:an,color:"natur",glasses:pick(["inga","inga","runda","sol"]),hat:pick(["ingen","ingen","keps","mossa","party"]),neck:pick(["ingen","rosett","halsduk"])};}
function hud(){$("hudT").textContent=`Dag ${data.dagar+1} · Kund ${Math.min(G.k+1,KUNDER)} av ${KUNDER}`;$("hudK").textContent=`💰 ${G.kassa} kr`;}
function nextCust(){if(G.k>=KUNDER)return endDay();
  const typ=G.typer[G.k];FB={m:"",h:false};G.bad=false;G.t=makeTask(typ);G.t.cust=custCfg();G.tries=0;G.inp="";G.tray=[];G.sel=new Set();G.done=false;G.helped=false;
  hud();render(true);
  if(G.t.typ==="slut"){G.done=true;G.slut.push(G.t.want);fb(`Kunden gick utan att handla. Fyll på ${NAMN(G.t.want)} efter dagen!`,true);window.Ljud&&Ljud.bad&&Ljud.bad();renderPanel();}}
// ett slumpat köp: 1–3 varor vars summa ryms under gränsen
function basket(n,limit){const sor=iLager();n=Math.min(n,sor.length);for(let k=0;k<200;k++){const it=shuffle(sor.slice()).slice(0,n),tot=it.reduce((s,i)=>s+G.prices[i],0);if(tot<=limit)return{it,tot};}
  const i=sor.reduce((a,b)=>G.prices[a]<G.prices[b]?a:b);return{it:[i],tot:G.prices[i]};}
// kunden betalar med en sedel eller ett mynt som är större än summan
function payFor(tot){const opts=G.N.val.filter(v=>v>tot);return opts.length?(Math.random()<.7?opts[0]:pick(opts.slice(0,2))):null;}
function makeTask(typ){const N=G.N,max=N.max,inne=iLager(),borta=sortiment().filter(i=>lag(i)===0);
  // kunden vill ha något som är slut: oftare ju mer som är slut (rakna behöver inga varor)
  if(typ!=="rakna"&&borta.length&&(inne.length<2||Math.random()<borta.length/sortiment().length*.7))return{typ:"slut",want:pick(borta)};
  if(typ==="budget"&&inne.length<5)typ="summa";
  if(typ==="styck"&&!inne.some(i=>lag(i)>=2))typ="summa";
  if(typ==="summa"){const b=basket(data.niva===1?2:rnd(2,3),max);return{typ,items:b.it,ans:b.tot,earn:b.tot};}
  if(typ==="styck"){const ok=inne.filter(i=>G.prices[i]*2<=max&&lag(i)>=2),i=pick(ok.length?ok:inne.filter(i=>lag(i)>=2)),n=rnd(2,Math.max(2,Math.min(lag(i),4,Math.floor(max/G.prices[i])))),useOffer=G.offer&&lag(G.offer.i)>=4&&Math.random()<.5;
    if(useOffer){const n2=pick([2,4]),i2=G.offer.i;return{typ,items:Array(n2).fill(i2),qty:n2,unit:i2,offer:true,ans:n2/2*G.offer.p,earn:n2/2*G.offer.p};}
    return{typ,items:Array(n).fill(i),qty:n,unit:i,ans:n*G.prices[i],earn:n*G.prices[i]};}
  if(typ==="vaxel"){for(let k=0;k<100;k++){const b=basket(rnd(1,2),max-1),pay=payFor(b.tot);if(pay&&pay-b.tot>0&&(data.niva>1||pay-b.tot<=15))return{typ,items:b.it,tot:b.tot,pay,ans:pay-b.tot,earn:b.tot};}
    const i0=inne[0];return{typ:"summa",items:[i0],ans:G.prices[i0],earn:G.prices[i0]};}
  // växla en sedel eller ett mynt, ibland till bara en sorts pengar ("till bara tiokronor")
  if(typ==="vaxla"){const note=pick({1:[10,20],2:[20,50],3:[50,100],4:[100,200]}[data.niva]),smaller=G.N.val.filter(v=>v<note);
    const only=Math.random()<.45?pick(smaller.filter(d=>d>=2&&note%d===0&&note/d<=10)):null;
    return{typ,note,only:only||null,ans:note,earn:0};}
  if(typ==="rakna"){const vals=G.N.val.filter(v=>v<max);for(let k=0;k<100;k++){const n=rnd(3,data.niva===1?4:6),m=Array.from({length:n},()=>pick(vals)).sort((a,b)=>b-a),s=m.reduce((a,b)=>a+b,0);if(s<=max&&s>3)return{typ,money:m,ans:s,earn:Math.min(s,10*data.niva)};}
    return{typ,money:[10,5,2],ans:17,earn:10};}
  // budget: två varor som kostar exakt summan, bara ett par går
  const sor=inne;for(let k=0;k<300;k++){const it=shuffle(sor.slice()).slice(0,5);const ps=it.map(i=>G.prices[i]);
    const [a,b]=shuffle([0,1,2,3,4]).slice(0,2),sum=ps[a]+ps[b];if(sum>max)continue;
    let pairs=0;for(let x=0;x<5;x++)for(let y=x+1;y<5;y++)if(ps[x]+ps[y]===sum)pairs++;
    if(pairs===1&&new Set(ps).size===5)return{typ:"budget",items:it,sum,ans:[a,b].sort(),earn:sum};}
  return makeTask("summa");}
const NAMN=i=>VAROR[i];
// flera av samma vara ("3 bananer"); n = 1 ger ental
const PLUR=["äpplen","bananer","apelsiner","päron","citroner","morötter","ägg","ostar","jordgubbar","körsbär","klasar vindruvor","vattenmeloner","croissanter","limpor","muffins","cupcakes","munkar","kakor","tårtor","våfflor",
  "isglassar","glasspokaler","glassbägare","chokladkakor","chokladbitar","klubbor","läskburkar","läskflaskor","mjölkpaket","burkar honung","korv med bröd","smörgåsar","pizzor","pannkakor"];
const ANTAL=(n,i)=>`${n} ${n===1?VAROR[i]:PLUR[i]}`;
const ENSAM={10:"tiokrona",20:"tjugolapp",50:"femtiolapp",100:"hundralapp",200:"tvåhundralapp"};
const FLERA={1:"enkronor",2:"tvåkronor",5:"femkronor",10:"tiokronor",20:"tjugolappar",50:"femtiolappar",100:"hundralappar"};
function sayFor(t){
  if(t.typ==="slut")return `Hej! Har ni ${NAMN(t.want)}? … Åh, det är slut! Då går jag någon annanstans.`;
  if(t.typ==="summa")return `Hej! Jag vill köpa ${t.items.length===2?"de här två":"de här"}. Vad blir det?`;
  if(t.typ==="styck")return t.offer?`Jag tar ${ANTAL(t.qty,t.unit)}. Det är 2 för ${G.offer.p} kr! Vad blir det?`:`Jag vill ha ${ANTAL(t.qty,t.unit)}. De kostar ${G.prices[t.unit]} kr styck. Vad blir det?`;
  if(t.typ==="vaxla")return `Hej! Kan du växla min ${ENSAM[t.note]}${t.only?` till bara ${FLERA[t.only]}`:""}?`;
  if(t.typ==="vaxel")return `Det blir ${t.tot} kr. Här är ${t.pay} kr. Kan jag få tillbaka?`;
  if(t.typ==="rakna")return `Här är mina pengar. Hur mycket är det?`;
  return `Jag har ${t.sum} kr. Vilka två saker kostar exakt ${t.sum} kr tillsammans?`;}
function render(enter){const t=G.t;let onc="";
  if(t.typ==="summa"||t.typ==="vaxel")onc=t.items.map(i=>`<span class="ware">${spr(i)}<span class="tag">${G.prices[i]} kr</span></span>`).join("")+(t.typ==="vaxel"?`<span style="margin-left:10px">${moneyHtml(t.pay,true)}</span>`:"");
  else if(t.typ==="styck")onc=`<span class="ware">${spr(t.unit)}<span class="tag${t.offer?" offer":""}">${t.offer?`2 för ${G.offer.p} kr`:G.prices[t.unit]+" kr/st"}</span></span><span class="qty">× ${t.qty}</span>`;
  else if(t.typ==="vaxla")onc=moneyHtml(t.note,true);
  else if(t.typ==="slut")onc=`<span class="ware out">${spr(t.want)}<span class="tag slut">Slut</span></span>`;
  else if(t.typ==="rakna")onc=t.money.map(v=>moneyHtml(v,true)).join("");
  else onc=t.items.map((i,j)=>`<span class="ware pick${G.sel.has(j)?" sel":""}" data-j="${j}">${spr(i)}<span class="tag">${G.prices[i]} kr</span></span>`).join("");
  $("gameShop").innerHTML=shopHtml({prices:G.prices,offer:G.offer,cust:t.cust,away:enter,say:sayFor(t),onc,reg:t.typ==="vaxel"?`${t.tot} kr`:""});
  if(enter&&!reduced())requestAnimationFrame(()=>requestAnimationFrame(()=>{const c=$("cust");if(c)c.classList.remove("away");}));else{const c=$("cust");if(c)c.classList.remove("away");}
  $("spk").onclick=()=>speak(sayFor(t).replace(/kr\b/g,"kronor"));
  document.querySelectorAll("#onc .pick").forEach(x=>x.onclick=()=>pickWare(+x.dataset.j));
  renderPanel();}
function renderPanel(){const t=G.t,p=$("panel");
  if(G.done){p.innerHTML=`<div class="fb" id="fb"></div><button class="go" id="nextC">${G.k+1>=KUNDER?"Stäng för idag":"Nästa kund ➜"}</button>`;$("nextC").onclick=()=>{G.k++;nextCust();};fbShow();return;}
  if(t.typ==="vaxel"||t.typ==="vaxla"){
    const sum=G.tray.reduce((a,b)=>a+b,0),vx=t.typ==="vaxla",top=vx?t.note:t.pay;
    p.innerHTML=`<p class="ask">${vx?`Växla ${t.note} kr${t.only?` till ${FLERA[t.only]}`:""}:`:"Ge tillbaka växel:"}</p><div class="tray" id="tray">${G.tray.map((v,i)=>`<button data-i="${i}" aria-label="Ta bort ${v} kr">${moneyHtml(v)}</button>`).join("")}</div>
      <div class="traysum">På disken: ${sum} kr</div><div id="lineBox"></div>
      <div class="drawer">${G.N.val.filter(v=>v<top).map(v=>`<button data-v="${v}" aria-label="${v} kronor">${moneyHtml(v,1.3)}</button>`).join("")}</div>
      <div class="fb" id="fb"></div><div class="row2">${vx?"":'<button class="help" id="help">💡 Räkna uppåt</button>'}<button class="done" id="klar">Klar ✓</button></div>`;
    p.querySelectorAll(".drawer [data-v]").forEach(b=>b.onclick=()=>{if(G.tray.length>=12)return;G.tray.push(+b.dataset.v);window.Ljud&&Ljud.clonk&&Ljud.clonk();G.bad=false;keepFb();renderPanel();});
    p.querySelectorAll("#tray [data-i]").forEach(b=>b.onclick=()=>{G.tray.splice(+b.dataset.i,1);keepFb();renderPanel();});
    $("klar").onclick=checkChange;if(!vx)$("help").onclick=()=>{G.helped=true;$("lineBox").innerHTML=countUp(t.tot,t.pay);};
    if(G.helped&&!vx)$("lineBox").innerHTML=countUp(t.tot,t.pay);
    fbShow();return;}
  if(t.typ==="budget"){p.innerHTML=`<p class="ask">Tryck på två varor på disken.</p><div class="fb" id="fb"></div>`;fbShow();return;}
  const lab=t.typ==="rakna"?"Pengarna är:":"Det blir:";
  p.innerHTML=`<p class="ask">${lab} <span class="ans${G.bad?" bad":""}" id="ans">${G.inp||" "}</span> kr</p><div class="fb" id="fb"></div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button data-k="del" aria-label="Sudda">⌫</button><button data-k="0">0</button><button data-k="ok" class="okbtn">OK</button></div>`;
  p.querySelectorAll(".pad [data-k]").forEach(b=>b.onclick=()=>key(b.dataset.k));fbShow();}
// återkopplingen ligger kvar när panelen ritas om
let FB={m:"",h:false};
function fb(m,h){FB={m,h};fbShow();}
function fbShow(){const f=$("fb");if(!f)return;f.innerHTML=FB.m;f.className="fb"+(FB.h?" hint":"");}
function keepFb(){if(FB.h)FB={m:"",h:false};}
// räkna uppåt från priset till betalningen: först till närmaste tiotal (eller femtal), sedan med stora steg
function countUp(from,to){const st=[from];let x=from;
  // först upp till närmaste tiotal, sedan ett stort hopp till det sista hela tiotalet, sist resten (37 → 40 → 50, 63 → 70 → 100)
  while(x<to){const ten=Math.floor(to/10)*10;const n=x%10?Math.min(to,Math.ceil(x/10)*10):(ten>x?ten:to);st.push(n);x=n;}
  const W=600,H=86,pad=30,X=v=>pad+(v-from)/(to-from)*(W-2*pad);let s=`<svg class="line" viewBox="0 0 ${W} ${H}" aria-label="Räkna uppåt från ${from} till ${to}"><line x1="${pad}" y1="64" x2="${W-pad}" y2="64" stroke="#1D2B53" stroke-width="3"/>`;
  st.forEach((v,i)=>{s+=`<line x1="${X(v)}" y1="57" x2="${X(v)}" y2="71" stroke="#1D2B53" stroke-width="3"/><text x="${X(v)}" y="86" font-size="16" font-weight="800" text-anchor="middle" fill="#1D2B53" font-family="Baloo 2, Trebuchet MS, sans-serif">${v}</text>`;
    if(i){const a=X(st[i-1]),b=X(v),m=(a+b)/2;s+=`<path d="M${a} 60 Q${m} ${20} ${b} 60" fill="none" stroke="#1E9E5E" stroke-width="3"/><text x="${m}" y="30" font-size="17" font-weight="800" text-anchor="middle" fill="#157548" font-family="Baloo 2, Trebuchet MS, sans-serif">+${v-st[i-1]}</text>`;}});
  return s+`</svg>`;}

/* ---------- Svara ---------- */
function key(k){if(!G||G.done)return;
  if(k==="del"){G.inp=G.inp.slice(0,-1);G.bad=false;renderPanel();return;}
  if(k==="ok"){if(G.inp!=="")checkNum();return;}
  if(G.bad){G.inp="";G.bad=false;keepFb();}
  if(G.inp.length<3){G.inp+=k;renderPanel();}}
function why(t){
  if(t.typ==="summa")return `${t.items.map(i=>G.prices[i]).join(" + ")} = ${t.ans} kr`;
  if(t.typ==="styck")return t.offer?`${t.qty} st är ${t.qty/2} gånger 2 för ${G.offer.p} kr: ${Array(t.qty/2).fill(G.offer.p).join(" + ")} = ${t.ans} kr`:`${t.qty} · ${G.prices[t.unit]} = ${t.ans} kr`;
  if(t.typ==="rakna")return `${t.money.join(" + ")} = ${t.ans} kr`;
  return "";}
function checkNum(){const t=G.t,v=+G.inp;
  if(v===t.ans){serve(`Rätt! ${why(t)}`);return;}
  G.tries++;if(G.tries===1)G.miss++;window.Ljud&&Ljud.bad&&Ljud.bad();
  if(G.tries>=2){G.inp=String(t.ans);serve(`Det blir ${why(t)}.`,true);return;}
  G.bad=true;
  fb(t.typ==="rakna"?"Inte riktigt. Börja med de största pengarna och räkna vidare.":t.typ==="styck"?(t.offer?"Inte riktigt. Hur många par blir det?":"Inte riktigt. Det är samma pris flera gånger."):"Inte riktigt. Räkna ihop prislapparna en gång till.",true);renderPanel();}
function checkChange(){const t=G.t,sum=G.tray.reduce((a,b)=>a+b,0);if(!G.tray.length){fb("Tryck på pengarna i kassalådan först.",true);return;}
  if(t.typ==="vaxla"){const fel=t.only&&G.tray.some(v=>v!==t.only);
    if(sum===t.note&&!fel){serve(`Rätt! ${G.tray.length>6&&t.only?`${G.tray.length} · ${t.only}`:G.tray.join(" + ")} = ${t.note} kr.`);return;}
    G.tries++;if(G.tries===1)G.miss++;window.Ljud&&Ljud.bad&&Ljud.bad();
    if(G.tries>=2){serve(t.only?`${t.note} kr är ${t.note/t.only} ${FLERA[t.only]}: ${t.note/t.only} · ${t.only} = ${t.note}.`:`Pengarna ska bli ${t.note} kr tillsammans, till exempel ${exempel(t.note)}.`,true);return;}
    fb(fel?`Kunden vill bara ha ${FLERA[t.only]}. Hur många ${FLERA[t.only]} blir ${t.note} kr?`:sum<t.note?`Det är ${sum} kr. Det ska bli ${t.note} kr.`:`Det är ${sum} kr, det är för mycket. Det ska bli ${t.note} kr.`,true);renderPanel();return;}
  if(sum===t.ans){serve(`Rätt! ${t.pay} − ${t.tot} = ${t.ans} kr tillbaka.`);return;}
  G.tries++;if(G.tries===1)G.miss++;window.Ljud&&Ljud.bad&&Ljud.bad();
  if(G.tries>=2){G.helped=true;serve(`Tillbaka ska det vara ${t.ans} kr: räkna uppåt från ${t.tot} till ${t.pay}.`,true);return;}
  fb(sum<t.ans?"Det är för lite. Räkna uppåt från priset till det kunden betalade.":"Det är för mycket. Räkna uppåt från priset till det kunden betalade.",true);renderPanel();}
// ett exempel på växel med de största valörerna under beloppet
function exempel(n){const out=[];let r=n;for(const v of G.N.val.filter(v=>v<n).reverse())while(r>=v){out.push(v);r-=v;}return out.join(" + ");}
function pickWare(j){if(!G||G.done)return;const t=G.t;if(G.sel.has(j))G.sel.delete(j);else{if(G.sel.size>=2)return;G.sel.add(j);}
  render(false);if(G.sel.size<2)return;
  const [a,b]=[...G.sel].sort(),pa=G.prices[t.items[a]],pb=G.prices[t.items[b]];
  if(pa+pb===t.sum){serve(`Rätt! ${pa} + ${pb} = ${t.sum} kr`);return;}
  G.tries++;if(G.tries===1)G.miss++;window.Ljud&&Ljud.bad&&Ljud.bad();
  if(G.tries>=2){G.sel=new Set(t.ans);serve(`De två är ${t.ans.map(j=>G.prices[t.items[j]]).join(" + ")} = ${t.sum} kr.`,true);return;}
  fb(`${pa} + ${pb} = ${pa+pb} kr. Det ska bli ${t.sum} kr.`,true);setTimeout(()=>{if(G&&!G.done){G.sel=new Set();render(false);}},900);}
function serve(msg,shown){const t=G.t;G.done=true;
  const lon=LON(G.tries===0,G.niva);G.kassa+=lon;
  // varorna går från hyllan
  const salt=t.typ==="budget"?t.ans.map(j=>t.items[j]):t.items||[];salt.forEach(i=>{data.lager[i]=Math.max(0,lag(i)-1);});save();
  fb(msg+` Affären tjänar ${lon} kr.`,shown);
  if(!shown){window.Ljud&&Ljud.kaching&&Ljud.kaching();}
  hud();renderPanel();
  if(t.typ==="vaxel"&&G.helped){const lb=document.querySelector("#panel #lineBox");if(lb)lb.innerHTML=countUp(t.tot,t.pay);}
  const c=$("cust");if(c&&!reduced()){c.animate([{transform:"translateY(0)"},{transform:"translateY(-16px)"},{transform:"translateY(0)"}],{duration:450});}}
function endDay(){const st=G.miss===0?3:G.miss<=2?2:1,old=data.stars[G.niva]||0;data.stars[G.niva]=Math.max(old,st);
  const bonus=G.miss===0?Math.round(20*MULT[G.niva]):0;G.kassa+=bonus;
  data.kassa+=G.kassa;data.dagar=(data.dagar||0)+1;save();
  $("rTitle").textContent=G.miss===0?"Alla kunder fick rätt direkt! 🎉":"Affären har stängt för idag";
  $("rStars").innerHTML=starHtml(st);$("rKassa").textContent=`+${G.kassa} kr`;
  const next=UPS.filter(u=>!has(u.id)).sort((a,b)=>a.pris-b.pris)[0];
  const lagt=sortiment().filter(i=>lag(i)<=1).length;
  $("rSub").innerHTML=`${KUNDER-G.miss} av ${KUNDER} kunder fick rätt direkt.${bonus?` ${bonus} kr i bonus för en dag utan fel!`:""}${G.slut.length?` ${G.slut.length} ${G.slut.length===1?"kund":"kunder"} gick för att varan var slut.`:""}<br>I kassan totalt: <b>${data.kassa} kr</b>.`+(lagt?`<br>🚚 ${lagt} ${lagt===1?"vara håller":"varor håller"} på att ta slut.`:"")+(next?(data.kassa>=next.pris?` Du har råd med <b>${next.name}</b>!`:` ${next.pris-data.kassa} kr kvar till ${next.name}.`):"");
  show("result");if(st===3&&window.Ljud&&Ljud.fanfare){Ljud.fanfare();confetti();}}
$("rAgain").onclick=()=>startDay();$("rMine").onclick=()=>openMine();$("rLager").onclick=()=>openLager();$("rHome").onclick=()=>openHome();
$("quit").onclick=()=>{G=null;openHome();};

/* ---------- Uppläsning (bara med 🔊) ---------- */
let svVoice=null;function loadVoices(){try{svVoice=speechSynthesis.getVoices().find(v=>/^sv/i.test(v.lang))||null}catch(e){}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
function speak(text){if(!("speechSynthesis" in window))return toast("Uppläsning fungerar inte i den här webbläsaren.");loadVoices();
  if(!svVoice&&speechSynthesis.getVoices().length)return toast("Den här datorn har ingen svensk röst för uppläsning.");
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="sv-SE";if(svVoice)u.voice=svVoice;u.rate=.9;speechSynthesis.speak(u);}
document.addEventListener("keydown",e=>{if(!G||$("game").hidden||G.done&&e.key!=="Enter")return;
  if(G.done){const b=$("nextC");if(b){e.preventDefault();b.click();}return;}
  if(G.t.typ==="vaxel"){if(e.key==="Enter"){e.preventDefault();checkChange();}return;}
  if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==="Backspace"){e.preventDefault();key("del");}else if(e.key==="Enter"){e.preventDefault();key("ok");}});
function confetti(){
  if(reduced())return;
  const cols=["#3D8BFD","#FF9F43","#2BB673","#FFC93C","#7B61FF","#FF6B6B"];
  const c=$("fx"),x=c.getContext("2d"),dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);c.hidden=false;
  const P=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*120,y:H*.3,vx:(Math.random()-.5)*16,vy:-Math.random()*15-4,r:Math.random()*7+5,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.4}));
  const t0=performance.now();(function f(now){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(now-t0<2800)requestAnimationFrame(f);else{x.clearRect(0,0,W,H);c.hidden=true;}})(t0);
}
openHome();
</script>
