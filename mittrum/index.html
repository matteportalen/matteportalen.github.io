<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mitt rum – Pluggparken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF3FF;--ink:#1D2B53;--muted:#56668F;--card:#fff;--line:#C6D6F2;--good:#1E9E5E;--good-dark:#157548;--accent:#3D5AFE;--gold:#F2B707;--font:"Baloo 2","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:680px;margin:0 auto;padding:10px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none !important}
h1{font-size:1.9rem;margin:8px 0 2px;display:flex;align-items:center;gap:10px}
.lead{margin:0 0 10px;color:var(--muted);font-weight:700}
.room{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 5px 0 var(--line),0 14px 30px rgba(29,43,83,.12);background:#fff}
.room svg{display:block;width:100%;height:auto}
.room [data-fx]{cursor:pointer}
.bar{display:flex;align-items:center;gap:10px;margin:12px 0 8px;flex-wrap:wrap}
.mynt{font-weight:800;font-size:1.15rem;background:var(--card);border-radius:999px;padding:4px 14px;box-shadow:0 3px 0 var(--line)}
.inred{margin-left:auto;padding:10px 18px;border-radius:16px;background:var(--accent);color:#fff;font-weight:800;box-shadow:0 4px 0 #2A3DB8}
.inred:active{transform:translateY(3px);box-shadow:0 1px 0 #2A3DB8}
.inred[aria-pressed="true"]{background:var(--good);box-shadow:0 4px 0 var(--good-dark)}
.panel{background:var(--card);border-radius:20px;box-shadow:0 4px 0 var(--line);padding:10px 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tabs button{flex:none;padding:6px 12px;border-radius:999px;background:var(--bg);font-weight:800;font-size:.95rem}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:6px}
.it{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;border-radius:14px;background:var(--bg);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:.95rem;text-align:center;line-height:1.15}
.it .em{font-size:1.6rem}
.it small{font-weight:700;color:var(--muted)}
.it.sel{background:#E3E9FF;box-shadow:0 0 0 3px var(--accent)}
.it{position:relative}.it .sasm{position:absolute;top:4px;right:6px;font-size:.95rem}
.tabs button.sas{background:#FFF1D6;color:#8A4B00}.tabs button.sas[aria-pressed="true"]{background:#E06A00;color:#fff}
.sasinfo{grid-column:1/-1;margin:0;font-weight:700;color:var(--muted);text-align:center;font-size:.92rem}
.it.prov{background:#FFF6D6;box-shadow:0 0 0 3px var(--gold)}
.msg{min-height:1.4em;font-weight:800;text-align:center;margin:8px 0 2px}
.kop{display:block;margin:6px auto 0;padding:10px 18px;border-radius:16px;background:var(--good);color:#fff;font-weight:800;box-shadow:0 4px 0 var(--good-dark)}
.kop:disabled{opacity:.5}
.tip{color:var(--muted);font-weight:700;font-size:.92rem;text-align:center;margin:8px 0 0}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}}
@keyframes swim{0%{transform:translateX(0)}50%{transform:translateX(34px) scaleX(1)}50.01%{transform:translateX(34px) scaleX(-1)}100%{transform:translateX(0) scaleX(-1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.sway{animation:sway .9s ease-in-out 2;transform-box:fill-box;transform-origin:50% 100%}
.hopp{animation:hop .5s ease-out;transform-box:fill-box}
.fisk{animation:swim 6s linear infinite;transform-box:fill-box;transform-origin:center}
.fisk.fort{animation-duration:1.4s}
.snurr{animation:spin 1s linear infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 1.2s ease-in-out infinite}
.gung{animation:bob 1.6s ease-in-out infinite;transform-box:fill-box}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <h1><span aria-hidden="true">🏠</span>Mitt rum</h1>
  <p class="lead" id="lead">Här bor ditt djur. Tryck på sakerna i rummet!</p>
  <div class="room" id="room"></div>
  <div class="bar"><span class="mynt" id="mynt">🪙 0</span><button class="inred" id="inred" aria-pressed="false">🛒 Inred</button></div>
  <div class="panel" id="panel" hidden>
    <div class="tabs" id="tabs"></div>
    <div class="items" id="items"></div>
    <p class="msg" id="msg"></p>
    <button class="kop" id="kop" hidden></button>
    <p class="tip">Tryck på en sak för att prova den i rummet. Köp den om du vill behålla den. Mynt får du när du tränar och tar stjärnor.</p>
  </div>
</div>
<script src="../ljud.js"></script>
<script src="../djur.js"></script>
<script src="../huvud.js" data-titel="Mitt rum" data-ikon="🏠"></script>
<script>
/* Mitt rum: ett rum att inreda för mynt (MPMynt i huvud.js, köp sparas som "rum:plats:id" i matteportalen-mynt).
   Valen och lägena (lampan, gardinen …) sparas i matteportalen-rum. Allt ritas i SVG i samma platta stil som Affärens inredning. */
const $=id=>document.getElementById(id);
const KEY="matteportalen-rum";
const RUM={
 tapet:{n:"Tapet",items:[["slat","Slät","🟦",0],["prickar","Prickig","🔵",40],["rander","Randig","〰️",40],["rutor","Rutig","🔲",60],["stjarnor","Stjärnor","⭐",120],["regnbage","Regnbåge","🌈",200]]},
 golv:{n:"Golv",items:[["tra","Trägolv","🪵",0],["rutigt","Rutigt golv","🏁",40],["blatt","Blått golv","🟦",50],["gras","Gräsmatta","🌱",120]]},
 fonster:{n:"Fönster",items:[["dag","Dagsljus","☀️",0],["kvall","Solnedgång","🌇",60],["natt","Stjärnnatt","🌙",100],["hav","Havsutsikt","🌊",120],["rymd","Rymden","🪐",250],["sno","Snöig kväll","❄️",100,"jul"]]},
 sang:{n:"Säng",items:[["enkel","Säng","🛏️",0],["hangmatta","Hängmatta","🏝️",120],["himmel","Himmelssäng","👑",150],["raket","Raketsäng","🚀",300]]},
 tak:{n:"I taket",items:[["inget","Inget","➖",0],["lampa","Taklampa","💡",40],["slinga","Ljusslinga","✨",80],["disco","Discokula","🪩",200],["hjartslinga","Hjärtslinga","💕",80,"hjarta"]]},
 matta:{n:"Matta",items:[["ingen","Ingen","➖",0],["rund","Rund matta","🟠",30],["fluffig","Fluffig matta","☁️",50],["regnbage","Regnbågsmatta","🌈",80],["handduk","Badlakan","🏖️",50,"sommar"]]},
 hylla:{n:"Hylla",items:[["ingen","Ingen","➖",0],["bok","Bokhylla","📚",60],["leksak","Leksakshylla","🧸",90],["akvarium","Akvarium","🐠",180],["pumpor","Pumpalyktor","🎃",90,"halloween"]]},
 tavla:{n:"Tavla",items:[["ingen","Ingen","➖",0],["sol","Soltavla","🌞",30],["karta","Världskarta","🗺️",50],["portratt","Porträtt","🖼️",80],["hjarta","Hjärttavla","💖",40,"hjarta"]]},
 vaxt:{n:"Växt",items:[["ingen","Ingen","➖",0],["kaktus","Kaktus","🌵",30],["kruk","Krukväxt","🪴",40],["palm","Palm","🌴",90],["julgran","Julgran","🎄",120,"jul"],["paskris","Påskris","🪶",80,"pask"],["solros","Solros","🌻",60,"sommar"]]},
 husdjur:{n:"Husdjur",items:[["ingen","Inget","➖",0],["hamster","Hamster","🐹",100],["fagel","Fågel i bur","🐦",120],["robot","Liten robot","🤖",150],["spoke","Litet spöke","👻",120,"halloween"],["kyckling","Kyckling","🐥",100,"pask"]]}};
const START={tapet:"slat",golv:"tra",fonster:"dag",sang:"enkel",tak:"inget",matta:"ingen",hylla:"ingen",tavla:"ingen",vaxt:"ingen",husdjur:"ingen"};
const data=(()=>{try{const d=JSON.parse(localStorage.getItem(KEY)||"{}");return{val:Object.assign({},START,d.val||{}),fx:Object.assign({lampa:true,gardin:false},d.fx||{})};}catch(e){return{val:Object.assign({},START),fx:{lampa:true,gardin:false}};}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}};
const item=(slot,id)=>RUM[slot].items.find(x=>x[0]===id);
const SN=window.sasongNu?sasongNu():null,kanKopa=it=>!it[4]||(SN&&SN.id===it[4]);
const owned=(slot,id)=>{const it=item(slot,id);return !it||!it[3]||(MPMynt.get().kopt||[]).includes("rum:"+slot+":"+id);};
// det som visas: valen, eller en sak man provar
let prov=null;const vis=()=>prov?Object.assign({},data.val,{[prov.slot]:prov.id}):data.val;

/* ---------- Ritningen (400 × 300) ---------- */
const INK="#1D2B53";
function tapet(id){let s=`<rect width="400" height="214" fill="#E8F0FF"/>`;
  if(id==="prickar"){s=`<rect width="400" height="214" fill="#FFF1E0"/>`;for(let y=14;y<214;y+=28)for(let x=(y/28%2)*14+10;x<400;x+=28)s+=`<circle cx="${x}" cy="${y}" r="4" fill="#FFB86B" opacity=".6"/>`;}
  if(id==="rander"){s=`<rect width="400" height="214" fill="#E6F7EE"/>`;for(let x=0;x<400;x+=36)s+=`<rect x="${x}" width="18" height="214" fill="#C8EEDB"/>`;}
  if(id==="rutor"){s=`<rect width="400" height="214" fill="#FCEBF3"/>`;for(let x=0;x<400;x+=40)s+=`<rect x="${x}" width="20" height="214" fill="#F7D3E4" opacity=".7"/>`;for(let y=0;y<214;y+=40)s+=`<rect y="${y}" width="400" height="20" fill="#F7D3E4" opacity=".7"/>`;}
  if(id==="stjarnor"){s=`<rect width="400" height="214" fill="#2B3A67"/>`;for(let i=0;i<40;i++){const x=(i*97)%400,y=(i*53)%205+5;s+=`<circle cx="${x}" cy="${y}" r="${i%3?1.4:2.4}" fill="#FFE07A"${i%5?"":' class="blink"'}/>`;}}
  if(id==="regnbage"){const c=["#FFB3B3","#FFD7A8","#FFF1A8","#C9F2C2","#BFE3FF","#D9CCFF"];s="";c.forEach((f,i)=>{s+=`<rect y="${i*36}" width="400" height="36" fill="${f}"/>`;});}
  return s+`<rect y="206" width="400" height="10" fill="#fff" opacity=".85"/>`;}
function golv(id){let s=`<rect y="214" width="400" height="86" fill="#D9A86C"/>`;for(let y=226;y<300;y+=14)s+=`<line x1="0" y1="${y}" x2="400" y2="${y}" stroke="#C49158" stroke-width="2"/>`;
  if(id==="rutigt"){s=`<rect y="214" width="400" height="86" fill="#fff"/>`;for(let y=214;y<300;y+=22)for(let x=((y-214)/22%2)*22;x<400;x+=44)s+=`<rect x="${x}" y="${y}" width="22" height="22" fill="#1D2B53" opacity=".8"/>`;}
  if(id==="blatt")s=`<rect y="214" width="400" height="86" fill="#7FA8E8"/><rect y="214" width="400" height="6" fill="#6890D4"/>`;
  if(id==="gras"){s=`<rect y="214" width="400" height="86" fill="#7DCB6E"/>`;for(let i=0;i<60;i++){const x=(i*67)%400,y=222+(i*31)%74;s+=`<path d="M${x} ${y} l3 -8 l3 8" stroke="#4FA84A" stroke-width="2" fill="none"/>`;}}
  return s;}
function fonster(id,stangd){const x=26,y=22,w=120,h=86;let utsikt;
  if(id==="dag")utsikt=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#BDE3FF"/><circle cx="${x+92}" cy="${y+24}" r="12" fill="#FFD84D"/><ellipse cx="${x+34}" cy="${y+30}" rx="18" ry="7" fill="#fff"/><path d="M${x} ${y+h} Q${x+40} ${y+62} ${x+80} ${y+h} Q${x+100} ${y+70} ${x+w} ${y+h}Z" fill="#7DCB6E"/>`;
  if(id==="kvall")utsikt=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#FFB37A"/><rect x="${x}" y="${y}" width="${w}" height="${h/2}" fill="#FF8FA3"/><circle cx="${x+60}" cy="${y+h-16}" r="16" fill="#FFE07A"/><rect x="${x}" y="${y+h-14}" width="${w}" height="14" fill="#5C3A6B"/>`;
  if(id==="natt"){utsikt=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#1B2550"/><path d="M${x+92} ${y+12} a14 14 0 1 0 6 24 a11 11 0 1 1 -6 -24z" fill="#FFE9A8"/>`;for(let i=0;i<10;i++)utsikt+=`<circle cx="${x+8+(i*37)%104}" cy="${y+8+(i*23)%60}" r="1.6" fill="#fff" class="blink" style="animation-delay:${i*.3}s"/>`;}
  if(id==="hav")utsikt=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#BDE8FF"/><rect x="${x}" y="${y+50}" width="${w}" height="${h-50}" fill="#3D8BFD"/><path d="M${x} ${y+60} q10 -5 20 0 t20 0 t20 0 t20 0 t20 0 t20 0" stroke="#fff" stroke-width="2" fill="none"/><path d="M${x+70} ${y+50} l8 -18 l0 18z" fill="#fff"/><path d="M${x+66} ${y+50} h18 l-3 5 h-12z" fill="#E5484D"/>`;
  if(id==="rymd"){utsikt=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#0E1735"/><circle cx="${x+40}" cy="${y+50}" r="18" fill="#FF9F43"/><ellipse cx="${x+40}" cy="${y+50}" rx="30" ry="6" fill="none" stroke="#FFE07A" stroke-width="3"/><circle cx="${x+96}" cy="${y+22}" r="7" fill="#7FA8E8"/>`;for(let i=0;i<12;i++)utsikt+=`<circle cx="${x+5+(i*41)%110}" cy="${y+6+(i*29)%84}" r="1.2" fill="#fff"/>`;}
  if(id==="sno"){utsikt=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#3B4F8A"/><path d="M${x} ${y+h} V${y+62} Q${x+30} ${y+52} ${x+60} ${y+62} T${x+w} ${y+60} V${y+h}Z" fill="#F3F7FF"/><path d="M${x+84} ${y+62} l10 -22 l10 22z" fill="#2B7A4B"/><rect x="${x+92}" y="${y+62}" width="4" height="6" fill="#8B5A2B"/>`;
    for(let i=0;i<14;i++)utsikt+=`<circle cx="${x+6+(i*43)%108}" cy="${y+6+(i*31)%54}" r="1.8" fill="#fff" class="blink" style="animation-delay:${i*.2}s"/>`;}
  const gw=stangd?w/2+4:22;
  return`<g data-fx="gardin">${utsikt}<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#fff" stroke-width="8"/><path d="M${x+w/2} ${y} V${y+h} M${x} ${y+h/2} H${x+w}" stroke="#fff" stroke-width="5"/>
    <rect x="${x-10}" y="${y-10}" width="${w+20}" height="7" rx="3" fill="#8B5A2B"/>
    <path d="M${x-8} ${y-6} h${gw} q-6 ${h/2} 4 ${h+10} h${-gw+2} z" fill="#E5484D" opacity=".92"/><path d="M${x+w+8} ${y-6} h${-gw} q6 ${h/2} -4 ${h+10} h${gw-2} z" fill="#E5484D" opacity=".92"/>
    <rect x="${x-12}" y="${y+h+4}" width="${w+24}" height="8" rx="3" fill="#fff"/></g>`;}
function sang(id){
  if(id==="hangmatta")return`<g data-fx="sang"><path d="M262 120 V214 M388 120 V214" stroke="#8B5A2B" stroke-width="6"/><path d="M262 132 Q325 196 388 132" stroke="#E8B878" stroke-width="22" fill="none"/><path d="M270 138 Q325 186 380 138" stroke="#FF9F43" stroke-width="5" fill="none" stroke-dasharray="8 6"/></g>`;
  if(id==="raket")return`<g data-fx="sang"><path d="M268 214 V160 Q268 120 325 104 Q382 120 382 160 V214 Z" fill="#E8EDF7" stroke="#AEB9CC" stroke-width="3"/><circle cx="325" cy="148" r="14" fill="#BDE3FF" stroke="#AEB9CC" stroke-width="3"/><path d="M268 190 L250 214 H268Z M382 190 L400 214 H382Z" fill="#E5484D"/><rect x="278" y="178" width="94" height="22" rx="8" fill="#3D8BFD"/><rect x="284" y="172" width="30" height="14" rx="6" fill="#fff"/></g>`;
  const himmel=id==="himmel"?`<path d="M262 92 H392" stroke="#C99A0A" stroke-width="5"/><path d="M262 92 Q270 140 266 190 M392 92 Q384 140 388 190" stroke="#FF9FD0" stroke-width="10" fill="none" opacity=".8"/><path d="M262 92 Q327 118 392 92" fill="#FFB3D9" opacity=".8"/><path d="M262 92 V214 M392 92 V214" stroke="#C99A0A" stroke-width="5"/>`:"";
  return`<g data-fx="sang">${himmel}<rect x="262" y="150" width="130" height="18" rx="6" fill="${id==="himmel"?"#C99A0A":"#8B5A2B"}"/><rect x="262" y="162" width="130" height="40" rx="6" fill="#fff"/><rect x="262" y="176" width="130" height="30" rx="6" fill="${id==="himmel"?"#7B61FF":"#3D8BFD"}"/><rect x="270" y="164" width="34" height="14" rx="6" fill="#F3F5FA" stroke="#D5DDEC" stroke-width="2"/><rect x="262" y="200" width="8" height="16" fill="#8B5A2B"/><rect x="384" y="200" width="8" height="16" fill="#8B5A2B"/></g>`;}
function tak(id,pa){
  if(id==="lampa")return`<g data-fx="lampa"><line x1="200" y1="0" x2="200" y2="24" stroke="${INK}" stroke-width="2"/><path d="M182 40 Q200 14 218 40 Z" fill="#FF9F43"/>${pa?`<ellipse cx="200" cy="44" rx="7" ry="5" fill="#FFF3B0"/><path d="M184 42 L150 120 H250 L216 42Z" fill="#FFF3B0" opacity=".28"/>`:`<ellipse cx="200" cy="44" rx="7" ry="5" fill="#DDD"/>`}</g>`;
  if(id==="slinga"){let s=`<g data-fx="lampa"><path d="M0 8 Q50 26 100 8 T200 8 T300 8 T400 8" stroke="#2B7A4B" stroke-width="2" fill="none"/>`;const c=["#FF5FA2","#FFC93C","#3D8BFD","#2BB673"];
    for(let i=0;i<20;i++){const x=10+i*20,y=8+Math.abs(Math.sin((x/100)*Math.PI))*14;s+=`<circle cx="${x}" cy="${y+4}" r="4" fill="${pa?c[i%4]:"#C6D6F2"}"${pa?` class="blink" style="animation-delay:${i*.15}s"`:""}/>`;}return s+"</g>";}
  if(id==="disco"){let s=`<g data-fx="lampa"><line x1="200" y1="0" x2="200" y2="16" stroke="${INK}" stroke-width="2"/><g class="${pa?"snurr":""}"><circle cx="200" cy="34" r="18" fill="#C6D6F2"/>`;
    for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)if(i*i+j*j<=5)s+=`<rect x="${196+i*7}" y="${30+j*7}" width="6" height="6" fill="${(i+j)%2?"#fff":"#AEB9CC"}"/>`;
    s+=`</g>`;if(pa)["#FF5FA2","#3D8BFD","#FFC93C","#2BB673"].forEach((c,i)=>{s+=`<circle cx="${60+i*95}" cy="${100+(i%2)*60}" r="10" fill="${c}" opacity=".35" class="blink" style="animation-delay:${i*.3}s"/>`;});return s+"</g>";}
  if(id==="hjartslinga"){let g=`<g data-fx="lampa"><path d="M0 8 Q50 26 100 8 T200 8 T300 8 T400 8" stroke="#FF7EB6" stroke-width="2" fill="none"/>`;
    for(let i=0;i<14;i++){const x=14+i*28,y=12+Math.abs(Math.sin((x/100)*Math.PI))*14,c=i%2?"#E5484D":"#FF7EB6";g+=`<path d="M${x} ${y+12} C${x-9} ${y+5} ${x-6} ${y-3} ${x} ${y+2} C${x+6} ${y-3} ${x+9} ${y+5} ${x} ${y+12}Z" fill="${pa?c:"#F3C6D6"}"${pa?` class="blink" style="animation-delay:${i*.2}s"`:""}/>`;}
    return g+"</g>";}
  return"";}
function matta(id){if(id==="rund")return`<ellipse cx="200" cy="262" rx="92" ry="22" fill="#FF9F43"/><ellipse cx="200" cy="262" rx="70" ry="15" fill="none" stroke="#FFD3A0" stroke-width="4"/>`;
  if(id==="fluffig")return`<ellipse cx="200" cy="262" rx="96" ry="24" fill="#F3F5FA" stroke="#D5DDEC" stroke-width="6" stroke-dasharray="3 5"/>`;
  if(id==="regnbage"){const c=["#FF6B6B","#FF9F43","#FFC93C","#2BB673","#3D8BFD","#7B61FF"];return c.map((f,i)=>`<ellipse cx="200" cy="262" rx="${96-i*12}" ry="${24-i*3}" fill="${f}"/>`).join("");}
  if(id==="handduk")return`<g transform="rotate(-4 200 262)"><rect x="120" y="244" width="160" height="38" rx="5" fill="#fff"/>${[0,1,2,3,4].map(i=>`<rect x="${120+i*32+16}" y="244" width="16" height="38" fill="${["#3D8BFD","#FF7EB6","#FFC93C","#2BB673","#3D8BFD"][i]}"/>`).join("")}</g>`;
  return"";}
function hylla(id){

  if(id==="pumpor"){const p=(x,r,pa)=>`<path d="M${x} ${214-2*r} v-6" stroke="#2BB673" stroke-width="3"/><ellipse cx="${x}" cy="${214-r}" rx="${r*1.2}" ry="${r}" fill="#FF8A1F"/><path d="M${x-r*.4} ${214-2*r+3} Q${x-r*.7} ${214-r} ${x-r*.4} ${211} M${x+r*.4} ${214-2*r+3} Q${x+r*.7} ${214-r} ${x+r*.4} ${211}" stroke="#E06A00" stroke-width="1.5" fill="none"/>
      <path d="M${x-r*.6} ${214-r*1.2} l${r*.25} -${r*.3} l${r*.25} ${r*.3}z M${x+r*.1} ${214-r*1.2} l${r*.25} -${r*.3} l${r*.25} ${r*.3}z M${x-r*.6} ${214-r*.6} Q${x} ${214-r*.1} ${x+r*.6} ${214-r*.6} Q${x} ${214-r*.35} ${x-r*.6} ${214-r*.6}z" fill="${pa?"#FFE07A":"#7A3A00"}"/>`;
    return`<g data-fx="pumpor">${data.fx.pumpa!==false?`<ellipse cx="62" cy="200" rx="44" ry="16" fill="#FFD27A" opacity=".18"/>`:""}${p(44,20,data.fx.pumpa!==false)}${p(92,14,data.fx.pumpa!==false)}</g>`;}

  return"";}

  if(id==="julgran"){let g=`<rect x="149" y="194" width="10" height="20" fill="#8B5A2B"/><path d="M154 112 L184 198 H124Z" fill="#2B7A4B"/><path d="M154 112 L176 168 H132Z" fill="#33925A"/><path d="M154 112 L168 140 H140Z" fill="#3FAA68"/>`;
    [[142,182,"#E5484D"],[166,178,"#FFC93C"],[150,160,"#3D8BFD"],[162,150,"#E5484D"],[146,140,"#FFC93C"],[170,192,"#3D8BFD"],[136,194,"#FF7EB6"]].forEach(([x,y,c],i)=>{g+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${c}" class="blink" style="animation-delay:${i*.25}s"/>`;});
    return`<g data-fx="sway">${g}<path d="M154 104 l3 6 6.5 .5-5 4.3 1.6 6.4-6.1-3.6-6.1 3.6 1.6-6.4-5-4.3 6.5-.5z" fill="#F2C230"/></g>`;}
  if(id==="paskris"){let g=`<path d="M140 214 H168 L172 186 H136Z" fill="#BDE3FF" stroke="#8FC3EA" stroke-width="2"/><path d="M154 188 Q150 150 132 124 M154 188 Q156 146 160 112 M154 188 Q164 154 182 130 M156 160 Q144 150 140 140 M157 140 Q168 132 172 120" stroke="#8B5A2B" stroke-width="2.5" fill="none"/>`;
    [[132,124,"#FF7EB6"],[160,112,"#FFC93C"],[182,130,"#2BB673"],[140,140,"#3D8BFD"],[172,120,"#FF9F43"],[146,150,"#7B61FF"]].forEach(([x,y,c])=>{g+=`<ellipse cx="${x}" cy="${y}" rx="4" ry="9" fill="${c}" transform="rotate(20 ${x} ${y})"/>`;});
    return`<g data-fx="sway">${g}</g>`;}
  if(id==="solros")return`<g data-fx="sway"><path d="M138 214 H170 L166 190 H142Z" fill="#E07A4E"/><path d="M154 190 V130" stroke="#2BB673" stroke-width="5"/><path d="M154 170 Q138 160 136 150 Q150 154 154 164 M154 158 Q170 148 174 138 Q160 144 154 154" fill="#2BB673"/>${[...Array(12)].map((_,i)=>`<ellipse cx="154" cy="112" rx="5" ry="12" fill="#FFC93C" transform="rotate(${i*30} 154 124)"/>`).join("")}<circle cx="154" cy="124" r="9" fill="#8B5A2B"/></g>`;
  return"";}
function husdjur(id,pa){

    <g transform="translate(${pa?0:0} 0)"><ellipse cx="350" cy="262" rx="12" ry="9" fill="#F4A259"/><circle cx="341" cy="256" r="3" fill="#F4A259"/><circle cx="356" cy="259" r="1.4" fill="${INK}"/><circle cx="361" cy="263" r="1.6" fill="#FF7EB6"/></g></g>`;
  if(id==="fagel")return`<g data-fx="husdjur"><path d="M330 214 V188 Q350 168 370 188 V214" fill="none" stroke="#C99A0A" stroke-width="3"/><path d="M336 190 V214 M343 182 V214 M350 180 V214 M357 182 V214 M364 190 V214" stroke="#C99A0A" stroke-width="1.5"/><rect x="326" y="212" width="48" height="6" rx="2" fill="#C99A0A"/>
    <g class="gung"><ellipse cx="350" cy="202" rx="9" ry="7" fill="#3D8BFD"/><circle cx="356" cy="197" r="5" fill="#3D8BFD"/><path d="M361 197 L366 199 L361 200Z" fill="#FFC93C"/><circle cx="357" cy="196" r="1.2" fill="${INK}"/></g></g>`;

  if(id==="spoke")return`<g data-fx="husdjur"><g class="gung"><path d="M334 262 V236 Q334 214 350 214 Q366 214 366 236 V262 l-5 -5 l-5 5 l-6 -5 l-6 5 l-5 -5z" fill="#fff" stroke="#D5DDEC" stroke-width="2"/><ellipse cx="344" cy="234" rx="3" ry="4" fill="${INK}"/><ellipse cx="356" cy="234" rx="3" ry="4" fill="${INK}"/><ellipse cx="350" cy="245" rx="4" ry="${pa?5:3}" fill="${INK}"/></g></g>`;
  if(id==="kyckling")return`<g data-fx="husdjur"><g class="${pa?"gung":""}"><ellipse cx="350" cy="262" rx="15" ry="13" fill="#FFD84D"/><circle cx="350" cy="240" r="11" fill="#FFD84D"/><circle cx="346" cy="238" r="1.8" fill="${INK}"/><circle cx="354" cy="238" r="1.8" fill="${INK}"/><path d="M347 243 h6 l-3 4z" fill="#FF9F43"/><path d="M336 260 q-6 -2 -4 6" stroke="#E8B820" stroke-width="2" fill="none"/><path d="M344 275 v4 M356 275 v4" stroke="#FF9F43" stroke-width="2"/></g></g>`;
  return"";}
function draw(){const v=vis(),cfg=window.lasDjur?lasDjur():{},fx=data.fx;
  const djur=window.owlSVG?owlSVG(cfg).replace(/^<svg[^>]*>/,"").replace(/<\/svg>$/,""):"";
  $("room").innerHTML=`<svg viewBox="0 0 400 300" role="img" aria-label="Mitt rum">${tapet(v.tapet)}${golv(v.golv)}${fonster(v.fonster,fx.gardin)}${tavla(v.tavla,cfg)}${hylla(v.hylla)}${vaxt(v.vaxt)}${sang(v.sang)}${matta(v.matta)}
    <g data-fx="djur" id="djurG"><g transform="translate(166 162) scale(.62)">${djur}</g></g>${husdjur(v.husdjur,fx.hus)}${tak(v.tak,fx.lampa)}
    ${v.tak!=="inget"&&!fx.lampa?`<rect width="400" height="300" fill="#0E1735" opacity=".25" pointer-events="none"/>`:""}</svg>`;
  const m=MPMynt.get();$("mynt").textContent=`🪙 ${m.m} mynt`;}
// tryck på saker i rummet
$("room").addEventListener("click",e=>{const g=e.target.closest("[data-fx]");if(!g)return;const f=g.dataset.fx,L=window.Ljud;
  if(f==="gardin"){data.fx.gardin=!data.fx.gardin;save();draw();L&&L.whoosh&&L.whoosh();return;}
  if(f==="lampa"){data.fx.lampa=!data.fx.lampa;save();draw();L&&L.pop&&L.pop();return;}
  if(f==="husdjur"){data.fx.hus=!data.fx.hus;save();draw();L&&L.chirp&&L.chirp();return;}
  if(f==="pumpor"){data.fx.pumpa=data.fx.pumpa===false;save();draw();L&&L.pop&&L.pop();return;}
  if(f==="fisk"){g.querySelectorAll(".fisk").forEach(x=>{x.classList.add("fort");setTimeout(()=>x.classList.remove("fort"),2500);});L&&L.pop&&L.pop();return;}
  if(f==="djur"){const d=$("djurG");d.classList.remove("hopp");void d.getBBox();d.classList.add("hopp");L&&L.hop&&L.hop();return;}
  g.classList.remove("sway");void g.getBBox();g.classList.add("sway");L&&L.pop&&L.pop();});

/* ---------- Inred: prova och köp ---------- */
let flik="tapet";
const sasongLista=()=>SN?Object.entries(RUM).flatMap(([k,v])=>v.items.filter(it=>it[4]===SN.id).map(it=>[k,it])):[];
function panel(){const tabs=Object.entries(RUM).map(([k,v])=>[k,v.n]);if(SN&&sasongLista().length)tabs.unshift(["sasong",SASONGER[SN.id].ikon+" "+SASONGER[SN.id].namn]);
  $("tabs").innerHTML=tabs.map(([k,n])=>`<button data-tab="${k}" aria-pressed="${k===flik}"${k==="sasong"?' class="sas"':""}>${n}</button>`).join("");
  const v=vis(),lista=flik==="sasong"?sasongLista():RUM[flik].items.filter(it=>owned(flik,it[0])||kanKopa(it)).map(it=>[flik,it]);
  $("items").innerHTML=(flik==="sasong"?`<p class="sasinfo">Säsongssaker går bara att köpa ${sasongSlut(SN)}. Det du köper har du kvar för alltid.</p>`:"")+lista.map(([k,[id,n,em,pris,sa]])=>{const har=owned(k,id),cls=data.val[k]===id?" sel":v[k]===id?" prov":"";
    return`<button class="it${cls}" data-slot="${k}" data-id="${id}">${sa?`<span class="sasm" aria-hidden="true">${SASONGER[sa].ikon}</span>`:""}<span class="em">${em}</span>${n}<small>${har?(data.val[k]===id?"Vald":"Din"):`🪙 ${pris}`}</small></button>`;}).join("");
  const p=prov&&item(prov.slot,prov.id),m=MPMynt.get().m;
  if(p&&!owned(prov.slot,prov.id)){$("kop").hidden=false;$("kop").disabled=m<p[3];$("kop").textContent=m<p[3]?`${p[1]} kostar ${p[3]} 🪙, du har ${m}`:`Köp ${p[1].toLowerCase()} för ${p[3]} 🪙`;$("msg").textContent=`Du provar: ${p[1]}`;}
  else $("kop").hidden=true;}
$("tabs").onclick=e=>{const b=e.target.closest("[data-tab]");if(!b)return;flik=b.dataset.tab;prov=null;$("msg").textContent="";draw();panel();};
$("items").onclick=e=>{const b=e.target.closest("[data-id]");if(!b)return;const id=b.dataset.id,k=b.dataset.slot;
  if(owned(k,id)){data.val[k]=id;prov=null;save();$("msg").textContent=`${item(k,id)[1]} är vald.`;window.Ljud&&Ljud.ok&&Ljud.ok();}
  else if(kanKopa(item(k,id)))prov={slot:k,id};
  draw();panel();};
$("kop").onclick=()=>{if(!prov)return;const p=item(prov.slot,prov.id);
  if(MPMynt.kop("rum:"+prov.slot+":"+prov.id,p[3])){data.val[prov.slot]=prov.id;save();$("msg").textContent=`Köpt! ${p[1]} är din. 🎉`;prov=null;window.Ljud&&Ljud.kaching&&Ljud.kaching();draw();panel();}};
$("inred").onclick=()=>{const on=$("panel").hidden;$("panel").hidden=!on;$("inred").setAttribute("aria-pressed",String(on));$("inred").textContent=on?"✓ Klar":"🛒 Inred";
  if(!on){prov=null;draw();}else{if(SN&&sasongLista().some(([k,it])=>!owned(k,it[0])))flik="sasong";panel();}};
draw();
</script>
