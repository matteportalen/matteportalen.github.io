<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dela upp och dela – Matte-Portalen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF3FF; --ink:#1D2B53; --muted:#56668F; --card:#FFFFFF; --line:#C6D6F2;
  --good:#1E9E5E; --good-dark:#157548; --bad:#E5484D; --accent:#3D5AFE; --gold:#F2B707;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --u:13px;--hu:8px;
}
@media (min-width:700px){:root{--u:16px;--hu:10px}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none !important}
.back{display:inline-block;color:var(--muted);font-weight:700;text-decoration:none;padding:6px 0;font-size:1rem}
h1{font-size:2.3rem;line-height:1;margin:14px 0 8px;font-weight:800;display:flex;align-items:center;gap:10px}
h1 .ic{display:grid;place-items:center;width:58px;height:58px;border-radius:16px;background:#FFE7C2;box-shadow:0 3px 0 rgba(29,43,83,.15);font-size:2rem;flex:none}
h2{font-size:2rem;line-height:1.1;margin:10px 0 6px;font-weight:800}
.lead{margin:0 0 14px;color:var(--muted);font-size:1.1rem}
.beta{font-size:.85rem;background:#FFE14D;color:#6A4A00;border-radius:8px;padding:2px 9px;transform:rotate(-6deg);box-shadow:0 2px 0 #E0B800;letter-spacing:.5px}
.stars{color:var(--gold);letter-spacing:1px}.stars .off{color:#D5DDEC}
.how{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--line);margin-bottom:12px}
.how p{margin:0 0 8px;font-weight:700}
.how .ex{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;font-weight:800;font-size:1.5rem}
.levels{display:grid;gap:10px;margin-top:14px}
.lv{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 var(--line);text-align:left;width:100%}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.lv[disabled]{opacity:.55;cursor:default}.lv[disabled]:active{transform:none;box-shadow:0 4px 0 var(--line)}
.lv .t{min-width:62px;height:54px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1rem;flex:none;line-height:1.05;text-align:center;padding:0 6px}
.lv b{font-size:1.12rem;display:block;line-height:1.15}
.lv small{color:var(--muted);font-size:.88rem;display:block;line-height:1.25}
.lv .st{margin-left:auto;flex:none}
.lv .t .fr i{background:#fff}
/* bråk: täljaren över nämnaren */
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle}
.fr b{display:block;padding:0 3px}
.fr i{display:block;height:3px;background:var(--ink);border-radius:2px;align-self:stretch;margin:3px 0}
/* spelet */
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.info{font-weight:800;font-size:1.2rem}
.progress{height:10px;border-radius:5px;background:var(--card);overflow:hidden;margin-top:6px;box-shadow:inset 0 0 0 2px var(--line)}
.progress i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.task{background:var(--card);border-radius:22px;padding:12px;box-shadow:0 5px 0 var(--line);margin:12px 0 10px;transition:background .15s}
.task.ok{background:#DDF5E7}
.instr{display:flex;gap:10px;align-items:center;font-weight:800;font-size:1.1rem;line-height:1.3;min-height:48px}
.spk{flex:none;width:44px;height:44px;border-radius:50%;background:var(--bg);font-size:1.3rem;box-shadow:0 3px 0 var(--line)}
.eq{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 8px;font-weight:800;font-size:clamp(1.5rem,6.5vw,2rem);margin:8px 0 2px;min-height:76px}
.eq .op{color:var(--muted)}
.eq .box{display:inline-grid;place-items:center;min-width:1.6em;height:1.45em;border-radius:10px;border:3px solid var(--accent);background:#EEF1FF;color:var(--accent);padding:0 4px;line-height:1}
.eq .box.wait{border:2px solid #AFC4EA;background:#fff;color:var(--ink)}
.eq button.box{font:inherit;font-weight:800;cursor:pointer}
.eq .fr .box{min-width:1.9em}
.eq .box.idle{border:2px dashed #AFC4EA;background:#fff;color:#AFC4EA}
.eq .box.bad{border-color:var(--bad);background:#FDE4E4;color:var(--bad)}
.eq .done{color:var(--good-dark)}
.sub{text-align:center;color:var(--muted);font-weight:800;font-size:1.15rem;min-height:1.5em}
.check{text-align:center;font-weight:800;color:var(--good-dark);font-size:1.1rem;min-height:0}
.feedback{min-height:1.4em;font-weight:800;font-size:1.05rem;margin-top:6px;text-align:center;color:var(--good-dark);line-height:1.3}
.feedback.bad{color:#9B2C3A;background:#FFE9EC;border-radius:12px;padding:6px 10px}
.feedback.tip{color:#6A4A00;background:#FFF4CC;border-radius:12px;padding:6px 10px}
/* brickorna med klossar */
.board{display:grid;gap:10px}
.tray{position:relative;background:#FFF9EF;border-radius:18px;padding:8px 10px 10px;box-shadow:0 4px 0 #EBDDC4;border:3px solid transparent;min-width:0}
.tray h3{margin:0 0 4px;font-size:1rem;display:flex;align-items:center;gap:8px;justify-content:space-between;font-weight:800}
.tray h3 .v{font-size:1.6rem;line-height:1}
.tray h3 .v.no{color:#C8B79A}
.tray .mat{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px}
.board.split .mat{min-height:calc(var(--u)*10 + 8px)}
.board .mat.none{min-height:0}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.part{cursor:pointer}
.part.sel{border-color:var(--accent);background:#F3F5FF;box-shadow:0 4px 0 #C7CFF5}
.part.act{border-color:var(--gold);background:#FFF8DC}
.part.fin{opacity:.6}
.part.fail{border-color:var(--bad);background:#FFF1F2}
.part.fail .k{background:#FFC7CF;border-radius:5px;animation:blink 1s ease-in-out 2}
@keyframes blink{50%{background:#FF8C9B}}
.part .tag{font-size:.85rem;color:var(--muted);font-weight:700}
.part.sel .tag{color:var(--accent)}
.tens,.ones{display:flex;flex-wrap:wrap;align-items:flex-end;touch-action:none;border-radius:10px;padding:2px}
.tens{gap:0}
.ones{display:grid;grid-template-columns:repeat(5,calc(var(--u) + 8px))}
.k{display:grid;place-items:center;pointer-events:none}
.kt{width:calc(var(--u) + 8px);height:calc(var(--u)*10 + 4px)}
.kt svg{width:var(--u);height:calc(var(--u)*10);display:block}
.ke{width:calc(var(--u) + 8px);height:calc(var(--u) + 8px)}
.ke svg{width:var(--u);height:var(--u);display:block}
.k.pop{animation:pop .35s ease-out backwards}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.empty{color:#B4A383;font-weight:700;font-size:.92rem;align-self:center;padding:4px}
.xch{display:block;margin:6px 0 0 auto;border-radius:12px;background:#fff;box-shadow:0 3px 0 #E3D3B5;font-weight:800;font-size:.9rem;padding:4px 10px;min-height:40px}
.xch:active{transform:translateY(2px);box-shadow:0 1px 0 #E3D3B5}
/* högarna */
.hogar{display:grid;grid-template-columns:repeat(var(--d),1fr);gap:8px}
.hog{background:#fff;border-radius:16px;box-shadow:0 3px 0 var(--line);padding:6px 4px;min-height:calc(var(--hu)*10 + 34px);display:flex;flex-direction:column;align-items:center;gap:4px}
.hog .row{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:2px}
.hog .row+.row{border-top:2px dashed #E3D3B5;padding-top:4px}
.hog .row .tt{display:flex;gap:2px}
.hog .row .oo{display:grid;grid-template-columns:repeat(3,var(--hu));gap:2px}
.hog .kt{width:var(--hu);height:calc(var(--hu)*10)}.hog .kt svg{width:var(--hu);height:calc(var(--hu)*10)}
.hog .ke{width:var(--hu);height:var(--hu)}.hog .ke svg{width:var(--hu);height:var(--hu)}
.hog .lab{margin-top:auto;font-weight:800;color:var(--good-dark);font-size:1.25rem;line-height:1}
.hogtitle{font-weight:800;font-size:1rem;margin:2px 0 -4px;color:var(--muted)}
.ghost{position:fixed;pointer-events:none;z-index:20;transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.over{outline:3px dashed var(--accent);outline-offset:2px}
.btns{display:flex;gap:10px;margin-top:10px}
.btns button{flex:1;padding-left:8px;padding-right:8px}
.go{display:block;width:100%;padding:14px 16px;border-radius:18px;background:var(--good);color:#fff;box-shadow:0 5px 0 var(--good-dark);font-weight:800;font-size:1.25rem}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--good-dark)}
.big{display:block;width:100%;padding:12px 16px;border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:1.15rem}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}
.pad button{height:54px;border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--line);font-size:1.7rem;font-weight:800}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad .okbtn{background:var(--good);color:#fff;box-shadow:0 4px 0 var(--good-dark);font-size:1.3rem}
.result{text-align:center;padding-top:20px}
.result .go,.result .big{margin-top:12px}
.rbig{font-size:clamp(3.2rem,16vw,4.6rem);font-weight:800;line-height:1;margin:6px 0}
.rsub{color:var(--muted);font-size:1.15rem;margin:0 0 14px}
.pet{width:64px;margin:12px auto 0}.pet svg{width:100%;height:auto;display:block}
.pet.hop{animation:hop .5s ease-out}@keyframes hop{40%{transform:translateY(-12px)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:800;z-index:9;max-width:90vw;text-align:center}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
<section id="home" class="screen">
  <h1><span class="ic" aria-hidden="true">🧱</span>Dela upp och dela<span class="beta">Beta</span></h1>
  <p class="lead">Dela upp täljaren i delar som är lätta att dela. Dela varje del för sig och lägg ihop.</p>
  <div class="how">
    <p>Så här kan man tänka:</p>
    <div class="ex" id="howEx"></div>
  </div>
  <div class="levels" id="levels"></div>
</section>
<section id="game" class="screen" hidden>
  <div class="gtop"><button class="back" id="quit">← Avsluta</button><span class="info" id="info"></span></div>
  <div class="progress"><i id="prog"></i></div>
  <div class="task" id="task">
    <div class="instr"><button class="spk" id="spk" aria-label="Läs upp">🔊</button><span id="instr"></span></div>
    <div class="eq" id="eq"></div>
    <div class="sub" id="sub"></div>
    <div class="check" id="check"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </div>
  <div class="board" id="board"></div>
  <div class="btns" id="splitBtns"><button class="big" id="resetBtn">↺ Börja om</button><button class="big" id="addBtn" hidden>＋ Ny del</button><button class="go" id="doneBtn">Klar ✓</button></div>
  <button class="go" id="fixBtn" style="margin-top:10px" hidden>↩ Ändra uppdelningen</button>
  <div class="pad" id="pad" hidden>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="del" aria-label="Sudda">⌫</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="0">0</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="ok" class="okbtn">OK</button>
  </div>
  <button class="go" id="nextBtn" style="margin-top:10px" hidden>Nästa tal →</button>
  <div class="pet" id="pet" aria-hidden="true"></div>
</section>
<section id="result" class="screen result" hidden>
  <h2 id="rTitle"></h2>
  <div class="rbig" id="rBig"></div>
  <p class="rsub" id="rSub"></p>
  <button class="go" id="rAgain">Räkna igen</button>
  <button class="big" id="rHome">Välj en annan nivå</button>
</section>
</div>
<div class="toast" id="toast" hidden></div>
<canvas id="fx" hidden></canvas>
<script src="../ljud.js"></script>
<script src="../djur.js"></script>
<script src="../klossar.js"></script>
<script src="../huvud.js" data-titel="Dela upp och dela" data-ikon="🧱"></script>
<script>
/* Dela upp och dela: uppdelningsstrategin för division med tiobasmaterial.
   Eleven delar upp täljaren (klossarna) i delar, delar ut varje del i lika många högar som nämnaren säger
   och skriver kvoten för varje del och sedan hela kvoten: 42/3 = 30/3 + 12/3 = 10 + 4 = 14.
   Uppdelningen kontrolleras matematiskt (alla delar som går jämnt upp godtas) och avslöjas aldrig.
   En del som inte går jämnt upp syns när den delas ut (det blir klossar över); det räknas inte som fel. */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const KEY="mattespel-delaupp-v1",ROUND=6,ART=MPKlossar;
const data=(()=>{try{return Object.assign({stars:{}},JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return{stars:{}}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const val=o=>o.t*10+o.e,cp=o=>JSON.parse(JSON.stringify(o));
const fr=(a,b)=>`<span class="fr"><b>${a}</b><i></i><b>${b}</b></span>`;
const ord=(n,en,fl)=>`${n} ${n===1?en:fl}`;
const desc=o=>[o.t?ord(o.t,"tiostav","tiostavar"):"",o.e?ord(o.e,"ental","ental"):""].filter(Boolean).join(" och ")||"ingenting";

/* ---------- Nivåer ---------- */
// alltid tal där tiotalen inte går jämnt att dela, så att man behöver tänka ut en uppdelning
const LEVELS=[
 {id:1,name:"Dela upp med klossar",desc:"Tvåsiffriga tal, nämnaren 2–5",ex:fr(42,3),c:"#FF9F43",maxP:2,gen:()=>{
   // första talet i rundan delas med 2 och visar hur det går till (50/2 = 40/2 + 10/2); sedan nämnaren 3–5,
   // för att dela i två högar är bara att halvera (lärarens fynd)
   if(G.k===0){const n=pick([30,34,36,38,50,52,54,56,58,70,72,74,76]);return{n,d:2};}
   for(;;){const d=rnd(3,5),n=d*rnd(11,Math.floor((d<=3?60:80)/d));if(Math.floor(n/10)%d!==0)return{n,d};}}},
 {id:2,name:"Större tal",desc:"Tal upp till 99, nämnaren 3–9. Två eller tre delar",ex:fr(91,7),c:"#7B61FF",maxP:3,gen:()=>{
   for(;;){const d=pick([3,4,5,6,6,7,7,8,8,9,9]),n=d*rnd(Math.max(6,Math.ceil(30/d)),Math.floor(99/d));if(Math.floor(n/10)%d!==0)return{n,d};}}},
 {id:3,name:"Utan klossar",desc:"Skriv uppdelningen själv. Tal upp till 400",ex:fr(156,6),c:"#17AFC4",noMat:true,gen:()=>{
   for(;;){const d=rnd(3,9),n=d*rnd(11,Math.floor(400/d));if(n>=60&&Math.floor(n/10)%d!==0)return{n,d};}}}
];

/* ---------- Skärmar ---------- */
function show(id){document.querySelectorAll(".screen").forEach(s=>s.hidden=s.id!==id);window.scrollTo(0,0);if(window.MPS)MPS.visa(id);}
const starHtml=n=>`<span class="stars">${[1,2,3].map(i=>i<=n?"★":'<span class="off">★</span>').join("")}</span>`;
$("howEx").innerHTML=`${fr(91,7)}<span>=</span>${fr(70,7)}<span>+</span>${fr(21,7)}<span>=</span><span>10 + 3</span><span>=</span><span style="color:var(--good-dark)">13</span>`;
function openHome(){G=null;
  $("levels").innerHTML=LEVELS.map((l,ix)=>`<button class="lv" data-l="${l.id}" style="--c:${l.c}"${l.soon?" disabled":""}><span class="t">${l.ex}</span><span><b>${ix+1}. ${l.name}</b><small>${l.desc}</small></span><span class="st">${l.soon?"":starHtml(data.stars[l.id]||0)}</span></button>`).join("");
  show("home");}
$("levels").onclick=e=>{const b=e.target.closest("[data-l]");if(b&&!b.disabled)start(+b.dataset.l);};
$("quit").onclick=openHome;$("rHome").onclick=openHome;$("rAgain").onclick=()=>start(G?G.lv:1);

/* ---------- Spelet ---------- */
let G=null,T=null,lastSay="";
function start(lv){G={lv,L:LEVELS.find(l=>l.id===lv),k:0,err:0,seen:new Set()};$("pet").innerHTML=window.owlSVG&&window.lasDjur?owlSVG(lasDjur()):"";show("game");next();}
function next(){if(G.k>=ROUND)return finish();
  let t;for(let i=0;i<60;i++){t=G.L.gen();if(!G.seen.has(t.n+"/"+t.d))break;}G.seen.add(t.n+"/"+t.d);
  T={n:t.n,d:t.d,src:{t:Math.floor(t.n/10),e:t.n%10},parts:[{t:0,e:0},{t:0,e:0}],ps:["",""],act:0,badP:[],sel:0,phase:G.L.noMat?"write":"split",cur:0,hog:null,snap:null,vals:null,qs:[],inp:"",tries:0,splitTries:0,miss:false,fresh:null,fail:false};
  $("info").textContent=`Tal ${G.k+1} av ${ROUND}`;$("task").className="task";fb("");$("check").textContent="";
  render();}

function fb(m,cls){const f=$("feedback");f.textContent=m;f.className="feedback"+(cls?" "+cls:"");}
function say(html,txt){$("instr").innerHTML=html;lastSay=txt||html.replace(/<[^>]+>/g,"");}
const tray=k=>k==="src"?T.src:T.parts[+k];

const PLUS='<span class="op">+</span>',EQ='<span class="op">=</span>';
const box=(v,c)=>`<span class="box ${c||""}">${v||(c==="idle"?"?":"&nbsp;")}</span>`;
function render(){
  const {n,d,phase}=T,P=T.parts,M=!G.L.noMat;
  // instruktionen
  if(phase==="split")say(`Dela upp ${n} i ${G.L.maxP>2?"två eller tre":"två"} delar. Varje del ska gå att dela lika i ${d} högar.`);
  else if(phase==="write")say(`Dela upp ${n} i delar som går att dela med ${d}. Skriv delarna ovanför bråkstrecken.`,`Dela upp ${n} i delar som går att dela med ${d}. Skriv delarna.`);
  else if(phase==="deal")say(`Dela ut del ${T.cur+1} (${T.vals[T.cur]}) i ${d} lika högar. Tryck på klossarna.`);
  else if(phase==="q")M?say(`Hur mycket fick varje hög från del ${T.cur+1}?`,`Hur mycket fick varje hög från del ${T.cur+1}? ${T.vals[T.cur]} delat med ${d}.`):say(`Räkna ut ${T.vals[T.cur]} delat med ${d}.`);
  else if(phase==="sum")say(M?"Lägg ihop. Hur mycket finns det i varje hög?":"Lägg ihop kvoterna.");
  else say(M?`Varje hög fick ${n/d}.`:`${n} delat med ${d} är ${n/d}.`);
  // likheten
  let h=fr(n,d)+EQ;
  if(phase==="split"){h+=box("","idle");$("sub").textContent=`${n} = ${P.map(p=>val(p)||"…").join(" + ")}`;}
  else if(phase==="write"){
    h+=T.ps.map((v,i)=>`<span class="fr"><b><button class="box ${T.badP.includes(i)?"bad":i===T.act?"":"wait"}" data-p="${i}" aria-label="Del ${i+1}">${v||"&nbsp;"}</button></b><i></i><b>${d}</b></span>`).join(PLUS);
    const s=T.ps.map(Number).reduce((a,b)=>a+b,0);
    $("sub").textContent=T.ps.some(v=>v)?`${T.ps.map(v=>v||"…").join(" + ")}${T.ps.every(v=>v)?` = ${s}`:""}`:"";}
  else{const S=T.vals;
    h+=S.map(a=>fr(a,d)).join(PLUS)+EQ;
    h+=S.map((a,i)=>T.qs[i]!=null?`<span class="done">${T.qs[i]}</span>`:phase==="q"&&i===T.cur?box(T.inp,T.bad?"bad":""):box("","idle")).join(PLUS);
    h+=EQ+(phase==="sum"?box(T.inp,T.bad?"bad":""):phase==="done"?`<span class="done">${n/d}</span>`:box("","idle"));
    $("sub").textContent="";}
  $("eq").innerHTML=h;
  $("splitBtns").hidden=phase!=="split";$("addBtn").hidden=!(phase==="split"&&G.L.maxP>P.length);$("fixBtn").hidden=!T.fail;
  $("pad").hidden=!(phase==="q"||phase==="sum"||phase==="write");$("nextBtn").hidden=phase!=="done";
  if(!M){$("board").className="board";$("board").innerHTML=phase==="write"?`<div class="btns">${T.ps.length<3?'<button class="big" data-add3="1">＋ En del till</button>':'<button class="big" data-rem3="1">− Ta bort en del</button>'}</div>`:"";return;}
  // brickorna
  const F=T.fresh;T.fresh=null;
  const mat=(o,key)=>{
    const pop=(kind,i,cnt)=>F&&F.tray===key&&F.kind===kind&&i>=cnt-(F.n||1)?` pop" style="animation-delay:${(i-(cnt-(F.n||1)))*40}ms`:"";
    if(!o.t&&!o.e)return`<div class="empty">${key==="src"?"Alla klossar är flyttade":phase==="split"?"Tryck eller dra hit klossar":""}</div>`;
    return(o.t?`<button class="tens" data-kind="t" aria-label="${ord(o.t,"tiostav","tiostavar")}">${Array.from({length:o.t},(_,i)=>`<span class="k kt${pop("t",i,o.t)}">${ART.t}</span>`).join("")}</button>`:"")+
      (o.e?`<button class="ones" data-kind="e" aria-label="${ord(o.e,"ental","ental")}">${Array.from({length:o.e},(_,i)=>`<span class="k ke${pop("e",i,o.e)}">${ART.e}</span>`).join("")}</button>`:"");};
  let b="";
  if(phase==="split")b+=`<div class="tray" data-tray="src"><h3><span>Talet ${n}</span></h3><div class="mat${val(T.src)?"":" none"}">${mat(T.src,"src")}</div>${T.src.t?'<button class="xch" data-x="src">🔄 Växla en tiostav</button>':""}</div>`;
  b+=`<div class="parts" style="grid-template-columns:repeat(${P.length},1fr)">${P.map((p,i)=>{
    const cls=phase==="split"?(i===T.sel?" sel":""):T.fail&&i===T.cur?" fail":phase==="deal"&&i===T.cur?" act":i<T.cur||phase==="sum"||phase==="done"||(phase==="q"&&i<T.cur)?" fin":"";
    const v=phase==="split"?val(p):T.vals[i];
    const tag=phase==="split"?(i===T.sel?"vald":""):T.qs[i]!=null?"✓ Utdelad":i===T.cur&&phase==="deal"?"Dela ut nu":"";
    const x=phase==="deal"&&i===T.cur&&!T.fail&&p.t?`<button class="xch" data-x="${i}">🔄 Växla</button>`:"";
    return`<div class="tray part${cls}" data-tray="${i}"><h3><span>Del ${i+1} <span class="tag">${tag}</span></span><span class="v${v?"":" no"}">${v||"0"}</span></h3><div class="mat${p.t||p.e||phase==="split"?"":" none"}">${mat(p,String(i))}</div>${x}</div>`;}).join("")}</div>`;
  if(T.hog){b+=`<div class="hogtitle">${d} högar</div><div class="hogar" style="--d:${d};gap:${d>5?4:8}px">${T.hog.map(hg=>`<div class="hog">${hg.map((r,ri)=>r.t||r.e?`<div class="row">${r.t?`<span class="tt">${Array.from({length:r.t},(_,i)=>`<span class="k kt${F&&F.hog&&F.part===ri&&F.kind==="t"&&i===r.t-1?" pop":""}">${ART.t}</span>`).join("")}</span>`:""}${r.e?`<span class="oo">${Array.from({length:r.e},(_,i)=>`<span class="k ke${F&&F.hog&&F.part===ri&&F.kind==="e"&&i===r.e-1?" pop":""}">${ART.e}</span>`).join("")}</span>`:""}</div>`:"").join("")}${phase==="done"?`<span class="lab">${n/d}</span>`:""}</div>`).join("")}</div>`;}
  $("board").innerHTML=b;$("board").className="board"+(phase==="split"?" split":"");
  if(F&&F.hog)$("board").querySelectorAll(".hog").forEach((el,i)=>el.querySelectorAll(".pop").forEach(k=>k.style.animationDelay=i*90+"ms"));}

/* ---------- Flytta, växla och dela ut ---------- */
function move(kind,from,to){if(from===to)return;const a=tray(from),b=tray(to);if(!a[kind])return;
  a[kind]--;b[kind]++;T.fresh={tray:to,kind};if(to!=="src")T.sel=+to;fb("");window.Ljud&&Ljud.pop&&Ljud.pop();render();}
function tap(kind,from){
  if(T.phase==="split"){move(kind,from,from==="src"?String(T.sel):"src");return;}
  if(T.phase==="deal"&&+from===T.cur&&!T.fail)deal(kind);}
function vaxla(key){const o=tray(key);if(!o.t)return;o.t--;o.e+=10;T.fresh={tray:key,kind:"e",n:10};
  fb("En tiostav blev 10 ental.","");window.Ljud&&Ljud.whoosh&&Ljud.whoosh();render();}
function deal(kind){const p=T.parts[T.cur],d=T.d;
  if(p[kind]<d){
    if(kind==="t"){fb(`Det finns bara ${ord(p.t,"tiostav","tiostavar")}. Det räcker inte till en i varje hög. Tryck på 🔄 Växla, så blir en tiostav 10 ental.`,"tip");return;}
    if(p.t){fb(`Det finns bara ${ord(p.e,"ental","ental")}. Det räcker inte till ett i varje hög. Växla en tiostav till 10 ental.`,"tip");return;}
    return failPart();}
  p[kind]-=d;T.hog.forEach(h=>h[T.cur][kind]++);T.fresh={hog:true,part:T.cur,kind};fb("");window.Ljud&&Ljud.pop&&Ljud.pop();render();
  afterDeal();}
function afterDeal(){const v=val(T.parts[T.cur]);
  if(v===0){T.phase="q";T.inp="";T.tries=0;T.bad=false;setTimeout(()=>{fb("");render();},250);return;}
  if(v<T.d&&!T.parts[T.cur].t)setTimeout(failPart,450);}
function failPart(){if(T.fail)return;const o=T.vals[T.cur],r=o%T.d;T.fail=true;
  fb(`${o} går inte att dela lika i ${T.d} högar. Det blir ${ord(r,"kloss","klossar")} över. Ändra uppdelningen och prova igen.`,"bad");
  window.Ljud&&Ljud.bad&&Ljud.bad();render();}
function startDeal(){T.phase="deal";T.cur=0;T.snap=cp(T.parts);T.vals=T.parts.map(val);T.hog=Array.from({length:T.d},()=>T.parts.map(()=>({t:0,e:0})));T.qs=[];
  fb("");render();if(val(T.parts[0])<T.d)setTimeout(failPart,400);}
$("doneBtn").onclick=()=>{if(!T||T.phase!=="split")return;
  if(val(T.src)){fb(`Flytta alla klossar till delarna. Det finns ${desc(T.src)} kvar.`,"tip");return;}
  const full=T.parts.filter(p=>val(p));
  if(full.length<2){fb(T.parts.length>2?"Lägg klossar i minst två delar.":"Lägg några klossar i båda delarna.","tip");return;}
  T.parts=full;  startDeal();};
$("resetBtn").onclick=()=>{if(!T)return;T.src={t:Math.floor(T.n/10),e:T.n%10};T.parts=[{t:0,e:0},{t:0,e:0}];T.sel=0;fb("");render();};
$("addBtn").onclick=()=>{if(!T||T.phase!=="split"||T.parts.length>=G.L.maxP)return;T.parts.push({t:0,e:0});T.sel=T.parts.length-1;fb("");render();};
$("fixBtn").onclick=()=>{if(!T)return;T.parts=cp(T.snap);T.src={t:0,e:0};T.phase="split";T.hog=null;T.fail=false;T.qs=[];T.sel=T.cur;fb("");render();};

/* tryck och dra (mus, finger och penna) */
let drag=null,noClick=false;
$("board").addEventListener("pointerdown",e=>{const a=e.target.closest("[data-kind]");if(!a||!T||T.phase!=="split")return;
  drag={kind:a.dataset.kind,from:a.closest("[data-tray]").dataset.tray,x:e.clientX,y:e.clientY,g:null,over:null};});
addEventListener("pointermove",e=>{if(!drag)return;
  if(!drag.g){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;
    const g=document.createElement("div");g.className="ghost k "+(drag.kind==="t"?"kt":"ke");g.innerHTML=ART[drag.kind];document.body.appendChild(g);drag.g=g;}
  drag.g.style.left=e.clientX+"px";drag.g.style.top=e.clientY+"px";
  const el=document.elementFromPoint(e.clientX,e.clientY),t=el&&el.closest("[data-tray]");
  if(drag.over&&drag.over!==t)drag.over.classList.remove("over");if(t&&t.dataset.tray!==drag.from){t.classList.add("over");drag.over=t;}else drag.over=null;});
function endDrag(e,ok){if(!drag)return;const d=drag;drag=null;if(!d.g)return;
  d.g.remove();noClick=true;setTimeout(()=>noClick=false,50);
  if(ok&&d.over){d.over.classList.remove("over");move(d.kind,d.from,d.over.dataset.tray);}}
addEventListener("pointerup",e=>endDrag(e,true));addEventListener("pointercancel",e=>endDrag(e,false));
$("board").addEventListener("click",e=>{if(!T||noClick)return;
  const x=e.target.closest("[data-x]");if(x){vaxla(x.dataset.x);return;}
  const a=e.target.closest("[data-kind]");if(a){tap(a.dataset.kind,a.closest("[data-tray]").dataset.tray);return;}
  const p=e.target.closest(".part");if(p&&T.phase==="split"){T.sel=+p.dataset.tray;render();}});

$("eq").addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(!b||!T||T.phase!=="write")return;T.act=+b.dataset.p;render();});
$("board").addEventListener("click",e=>{if(!T||T.phase!=="write")return;
  if(e.target.closest("[data-add3]")){T.ps.push("");T.act=T.ps.length-1;T.badP=[];fb("");render();}
  else if(e.target.closest("[data-rem3]")){T.ps.pop();T.act=Math.min(T.act,T.ps.length-1);T.badP=[];fb("");render();}});
/* ---------- Svaren ---------- */
function key(k){if(!T||!["q","sum","write"].includes(T.phase))return;
  if(T.phase==="write"){const i=T.act;
    if(k==="del"){T.ps[i]=T.ps[i].slice(0,-1);T.badP=T.badP.filter(x=>x!==i);render();return;}
    if(k==="ok"){if(!T.ps[i])return;const nx=T.ps.findIndex((v,j)=>!v||T.badP.includes(j));if(nx>=0){T.act=nx;render();}else skrivDelar();return;}
    if(T.badP.includes(i)){T.ps[i]="";T.badP=T.badP.filter(x=>x!==i);}
    if(T.ps[i].length<3)T.ps[i]+=k;render();return;}
  if(k==="del"){T.inp=T.inp.slice(0,-1);T.bad=false;render();return;}
  if(k==="ok"){if(T.inp)check();return;}
  if(T.inp.length<3){T.inp=(T.bad?"":T.inp)+k;T.bad=false;render();}}
// nivå 3: eleven har skrivit delarna; kontrollera summan och att varje del går jämnt att dela (räknas inte som fel)
function skrivDelar(){const a=T.ps.map(Number),d=T.d,n=T.n,s=a.reduce((x,y)=>x+y,0);let msg="";T.badP=[];
  if(a.some(x=>!x)){T.badP=a.map((x,i)=>x?-1:i).filter(i=>i>=0);msg="Varje del måste vara större än 0.";}
  else if(s!==n){T.badP=a.map((_,i)=>i);msg=`${a.join(" + ")} = ${s}, men delarna ska tillsammans bli ${n}.`;}
  else{const bad=a.map((x,i)=>x%d?i:-1).filter(i=>i>=0);
    if(bad.length){T.badP=bad;const x=a[bad[0]],q=Math.floor(x/d);msg=`${x} går inte att dela jämnt med ${d}: ${d} · ${q} = ${d*q}, och det blir ${x-d*q} över.`;}}
  if(msg){T.splitTries++;if(T.splitTries>=2)msg+=` Tips: tiotal är lätta att dela, ${d} · 10 = ${d*10} och ${d} · 20 = ${d*20}.`;
    T.act=T.badP[0];fb(msg,"bad");window.Ljud&&Ljud.bad&&Ljud.bad();render();return;}
  T.vals=a;T.phase="q";T.cur=0;T.inp="";T.tries=0;T.bad=false;fb("Delarna stämmer!");window.Ljud&&Ljud.ok&&Ljud.ok();render();}
function nextPart(){T.inp="";T.bad=false;T.tries=0;
  if(T.cur+1<T.vals.length){T.cur++;
    if(G.L.noMat){T.phase="q";render();}else{T.phase="deal";render();if(val(T.parts[T.cur])<T.d)setTimeout(failPart,400);}}
  else{T.phase="sum";render();}}
function check(){const v=+T.inp,d=T.d;
  if(T.phase==="q"){const i=T.cur,a=T.vals[i],q=a/d;
    if(v===q){window.Ljud&&Ljud.ok&&Ljud.ok();T.qs[i]=q;fb(`Rätt! ${a} delat med ${d} är ${q}.`);nextPart();return;}
    T.miss=true;T.tries++;T.bad=true;window.Ljud&&Ljud.bad&&Ljud.bad();
    if(G.L.noMat){
      if(T.tries<2){fb(`Tänk: ${d} · ? = ${a}. Vilket tal ska stå där?`,"bad");render();}
      else{fb(`${a} delat med ${d} är ${q}, för ${d} · ${q} = ${a}.`,"bad");T.qs[i]=q;nextPart();}
      return;}
    const got={t:T.hog[0][i].t,e:T.hog[0][i].e};
    if(T.tries<2){fb(`Titta i en hög. Från del ${i+1} fick den ${desc(got)}. Hur mycket är det?`,"bad");render();}
    else{fb(`${a} delat med ${d} är ${q}. Varje hög fick ${desc(got)}, det är ${q}.`,"bad");T.qs[i]=q;nextPart();}
    return;}
  const q=T.n/d;
  if(v===q)return done();
  T.miss=true;T.tries++;T.bad=true;window.Ljud&&Ljud.bad&&Ljud.bad();
  if(T.tries<2)fb(G.L.noMat?`Lägg ihop kvoterna: ${T.qs.join(" + ")}.`:`Lägg ihop det varje hög fick från delarna: ${T.qs.join(" + ")}.`,"bad");
  else{fb(`${T.qs.join(" + ")} = ${q}.`,"bad");return setTimeout(done,1400);}
  render();}
function done(){T.phase="done";T.bad=false;if(T.miss)G.err++;
  $("task").className="task ok";window.Ljud&&Ljud.ok&&Ljud.ok();
  fb(`Rätt! ${T.n} delat med ${T.d} är ${T.n/T.d}.`+(G.L.noMat?"":` Varje hög fick ${T.n/T.d}.`));
  $("check").textContent=`Kontroll: ${T.d} · ${T.n/T.d} = ${T.n} ✓`;
  const p=$("pet");p.classList.remove("hop");void p.offsetWidth;p.classList.add("hop");
  G.k++;$("prog").style.width=(G.k/ROUND*100)+"%";render();}
$("nextBtn").onclick=()=>{if(G)next();};
$("pad").onclick=e=>{const b=e.target.closest("[data-k]");if(b)key(b.dataset.k);};
document.addEventListener("keydown",e=>{if(!G||$("game").hidden||!T)return;
  if(T.phase==="done"){if(e.key==="Enter"){e.preventDefault();$("nextBtn").click();}return;}
  const k=/^\d$/.test(e.key)?e.key:e.key==="Backspace"?"del":e.key==="Enter"?"ok":null;if(!k||!["q","sum","write"].includes(T.phase))return;e.preventDefault();key(k);});
function finish(){const st=G.err===0?3:G.err<=2?2:1,old=data.stars[G.lv]||0;
  data.stars[G.lv]=Math.max(old,st);save();
  $("rTitle").textContent=st===3?"Alla rätt direkt!":"Bra delat!";$("rBig").innerHTML=starHtml(st);
  $("rSub").textContent=`${ROUND} tal på nivån ${G.L.name}. `+(G.err?`${G.err} tal behövde mer än ett försök.`:"Inga fel!")+(st>old&&old?" Ny stjärna!":"");
  show("result");if(st===3||st>old){window.Ljud&&Ljud.fanfare&&Ljud.fanfare();confetti();}}

/* ---------- Uppläsning och konfetti ---------- */
$("spk").onclick=()=>speak(lastSay);
let svVoice=null;function loadVoices(){try{svVoice=speechSynthesis.getVoices().find(v=>/^sv/i.test(v.lang))||null}catch(e){}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
function speak(text){if(!("speechSynthesis" in window))return toast("Uppläsning fungerar inte i den här webbläsaren.");loadVoices();
  if(!svVoice&&speechSynthesis.getVoices().length)return toast("Den här datorn har ingen svensk röst för uppläsning.");
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/·/g," gånger ").replace(/\(|\)/g,""));u.lang="sv-SE";if(svVoice)u.voice=svVoice;u.rate=.9;speechSynthesis.speak(u);}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cols=["#3D8BFD","#FF9F43","#2BB673","#FFC93C","#7B61FF","#FF6B6B"];
  const c=$("fx"),x=c.getContext("2d"),dpr=window.devicePixelRatio||1,W2=innerWidth,H2=innerHeight;c.width=W2*dpr;c.height=H2*dpr;x.setTransform(dpr,0,0,dpr,0,0);c.hidden=false;
  const P=Array.from({length:150},()=>({x:W2/2+(Math.random()-.5)*120,y:H2*.3,vx:(Math.random()-.5)*16,vy:-Math.random()*15-4,r:Math.random()*7+5,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.4}));
  const t0=performance.now();(function f(now){x.clearRect(0,0,W2,H2);P.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(now-t0<2800)requestAnimationFrame(f);else{x.clearRect(0,0,W2,H2);c.hidden=true;}})(t0);
}
openHome();
</script>
