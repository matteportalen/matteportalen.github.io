<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mätning – Pluggparken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4FF; --ink:#1D2B53; --muted:#56668F; --card:#FFFFFF; --line:#C6D6F2;
  --good:#1E9E5E; --good-dark:#157548; --bad:#E5484D; --accent:#3D5AFE; --gold:#F2B707;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none !important}
.back{display:inline-block;color:var(--muted);font-weight:700;text-decoration:none;padding:6px 0;font-size:1rem}
h1{font-size:2.1rem;line-height:1;margin:10px 0 6px;font-weight:800;display:flex;align-items:center;gap:10px}
h1 .ic{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#FFE9A8;box-shadow:0 3px 0 rgba(29,43,83,.15);flex:none}
h2{font-size:2rem;line-height:1.1;margin:10px 0 6px;font-weight:800}
.lead{margin:0 0 12px;color:var(--muted);font-size:1.05rem}
.stars{color:var(--gold);letter-spacing:1px}.stars .off{color:#D5DDEC}
.levels{display:grid;gap:8px}
.lv{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:8px 12px 8px 8px;box-shadow:0 4px 0 var(--line);text-align:left;width:100%}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.lv .t{flex:none;width:52px;height:48px;border-radius:12px;background:var(--c);display:grid;place-items:center;font-size:1.6rem;box-shadow:0 3px 0 rgba(29,43,83,.15)}
.lv b{font-size:1.1rem;display:block;line-height:1.15}
.lv small{color:var(--muted);font-size:.86rem;display:block;line-height:1.25}
.lv .st{margin-left:auto;flex:none}
.note{color:var(--muted);font-size:.9rem;margin:12px 2px 0;line-height:1.3}
/* spelet */
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:10px;height:10px;border-radius:50%;background:#D3DEF2}
.dots i.on{background:var(--accent);transform:scale(1.25)}.dots i.done{background:var(--good)}
.spk{flex:none;width:42px;height:42px;border-radius:50%;background:var(--card);font-size:1.2rem;box-shadow:0 3px 0 var(--line)}
.task{background:var(--card);border-radius:22px;padding:12px;box-shadow:0 5px 0 var(--line);margin:10px 0;transition:background .2s}
.task.ok{background:#E3F7EC}
.instr{font-weight:800;font-size:1.12rem;line-height:1.3;text-align:center;min-height:1.4em}
.stage{margin:8px 0 4px;display:flex;justify-content:center;touch-action:pan-y;overflow:hidden}
.stage svg{display:block;max-width:100%;height:auto;overflow:visible}
.ans{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;font-weight:800;font-size:1.5rem;margin-top:6px}
.box{display:inline-grid;place-items:center;min-width:2em;height:1.5em;padding:0 .25em;border-radius:12px;border:3px solid var(--accent);background:#EEF1FF;color:var(--accent)}
.box.bad{border-color:var(--bad);background:#FDE4E4;color:var(--bad)}
.box.ok{border-color:var(--good);background:#E3F7EC;color:var(--good-dark)}
.feedback{min-height:1.4em;font-weight:800;font-size:1.02rem;margin:8px 0 0;text-align:center;color:var(--good-dark);line-height:1.3}
.feedback.bad{color:#9B2C3A;background:#FFE9EC;border-radius:12px;padding:6px 10px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.choices button{min-height:60px;border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:1.3rem;padding:6px}
.choices button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.choices button.ok{background:#E3F7EC;box-shadow:0 4px 0 #9ED9B6}
.choices button.bad{background:#FFE3E5;box-shadow:0 4px 0 #F3B4B6}
.choices .em{font-size:2rem}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.pad button{height:52px;border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--line);font-size:1.6rem;font-weight:800}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad .okbtn{background:var(--good);color:#fff;box-shadow:0 4px 0 var(--good-dark);font-size:1.3rem}
.pour{display:block;margin:6px auto 0;padding:10px 18px;border-radius:16px;background:#3D8BFD;color:#fff;font-weight:800;font-size:1.15rem;box-shadow:0 4px 0 #2A62C0}
.pour:active{transform:translateY(3px);box-shadow:0 1px 0 #2A62C0}
.go{display:block;width:100%;padding:14px 16px;border-radius:18px;background:var(--good);color:#fff;box-shadow:0 5px 0 var(--good-dark);font-weight:800;font-size:1.3rem;margin-top:12px}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--good-dark)}
.big{display:block;width:100%;padding:12px 16px;border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:1.2rem;margin-top:12px}
.result{text-align:center;padding-top:20px}
.rbig{font-size:clamp(3.2rem,16vw,4.6rem);font-weight:800;line-height:1;margin:6px 0}
.rsub{color:var(--muted);font-size:1.15rem;margin:0 0 14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:800;z-index:9;max-width:90vw;text-align:center}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
.grab{cursor:grab}.grab:active{cursor:grabbing}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
<section id="home" class="screen">
  <h1><span class="ic" id="logo" aria-hidden="true"></span>Mätning</h1>
  <p class="lead">Mät längd, väg och häll. Hur långt, hur tungt och hur mycket?</p>
  <div class="levels" id="levels"></div>
  <p class="note">Linjalen på skärmen visar centimeter, men skärmens centimeter är inte lika långa som på en riktig linjal.</p>
</section>
<section id="game" class="screen" hidden>
  <div class="gtop"><button class="back" id="quit">← Avsluta</button><span class="dots" id="dots" aria-hidden="true"></span><button class="spk" id="spk" aria-label="Läs upp">🔊</button></div>
  <div class="task" id="task">
    <div class="instr" id="instr" aria-live="polite"></div>
    <div class="stage" id="stage"></div>
    <div class="ans" id="ans"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </div>
  <div class="choices" id="choices" hidden></div>
  <div class="pad" id="pad" hidden>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="del" aria-label="Sudda">⌫</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="0">0</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="ok" class="okbtn">OK</button>
  </div>
  <button class="go" id="nextBtn" hidden>Nästa →</button>
</section>
<section id="result" class="screen result" hidden>
  <h2 id="rTitle"></h2>
  <div class="rbig" id="rBig"></div>
  <p class="rsub" id="rSub"></p>
  <button class="go" id="rAgain">Spela igen</button>
  <button class="big" id="rHome">Välj en annan del</button>
</section>
</div>
<div class="toast" id="toast" hidden></div>
<canvas id="fx" hidden></canvas>
<script src="../ljud.js"></script>
<script src="../djur.js"></script>
<script src="../vag.js"></script>
<script src="../huvud.js" data-titel="Mätning" data-ikon="📏"></script>
<script>
/* Mätning (åk 1–3): längd med en digital linjal, längdenheter, vikt (köksvåg, balansvåg), volym (mätglas, häll dl i en liter)
   och vilken enhet som passar. Linjalen visar cm men är inte 1:1 med verkligheten (lärarens val). */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const KEY="mattespel-matning-v1",ROUND=8,NS='xmlns="http://www.w3.org/2000/svg"',FONT='font-family="Baloo 2, Trebuchet MS, sans-serif" font-weight="800"';
const data=(()=>{try{return Object.assign({stars:{}},JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return{stars:{}}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};

/* ---------- Bilder ---------- */
// föremål att mäta, liggande, len i px (ritade i SVG)
const OBJ={
  penna:{n:"pennan",draw:(L,c)=>{const h=16,t=Math.min(22,L*.18),e=Math.min(14,L*.12);
    return`<rect x="${e}" y="0" width="${L-e-t}" height="${h}" fill="${c}"/><rect x="${e}" y="0" width="${L-e-t}" height="5" fill="#fff" opacity=".25"/>
    <rect x="0" y="0" width="${e}" height="${h}" rx="3" fill="#FF8FB1"/><rect x="${e-3}" y="0" width="4" height="${h}" fill="#B9C2D6"/>
    <path d="M${L-t} 0 L${L} ${h/2} L${L-t} ${h}Z" fill="#F3D2A2"/><path d="M${L-t*.32} ${h*.34} L${L} ${h/2} L${L-t*.32} ${h*.66}Z" fill="#1D2B53"/>`;}},
  krita:{n:"kritan",draw:(L,c)=>{const h=18;return`<rect x="0" y="0" width="${L-10}" height="${h}" rx="5" fill="${c}"/><rect x="${L*.18}" y="0" width="${L*.5}" height="${h}" fill="#fff" opacity=".55"/>
    <path d="M${L-12} 2 L${L} ${h/2} L${L-12} ${h-2}Z" fill="${c}"/>`;}},
  sugror:{n:"sugröret",draw:(L,c)=>{const h=10;let s=`<rect x="0" y="0" width="${L}" height="${h}" rx="5" fill="#fff" stroke="#C6D6F2" stroke-width="1.5"/>`;
    for(let x=6;x<L-4;x+=14)s+=`<path d="M${x} 0 l8 ${h}" stroke="${c}" stroke-width="4"/>`;return s;}},
  band:{n:"bandet",draw:(L,c)=>{const h=14;return`<path d="M0 0 H${L} l-6 ${h/2} l6 ${h/2} H0 l6 ${-h/2}Z" fill="${c}"/><rect x="0" y="${h/2-1}" width="${L}" height="2" fill="#fff" opacity=".4"/>`;}}
};
const OCOL=["#3D8BFD","#FF6B6B","#2BB673","#FF9F43","#7B61FF","#17AFC4"];
// linjal: cm-streck, halvcm-streck och siffror; from = första siffran (en trasig linjal börjar inte på 0)
function ruler(cm,u,from){const W=cm*u+20,H=46;let s=`<rect x="0" y="0" width="${W}" height="${H}" rx="6" fill="#FFE9A8" stroke="#D9B44A" stroke-width="1.5"/>`;
  if(from)s=`<path d="M0 0 H${W} V${H} H0 l5 -8 l-5 -7 l6 -8 l-6 -7 l5 -8 Z" fill="#FFE9A8" stroke="#D9B44A" stroke-width="1.5"/>`;
  for(let i=0;i<=cm;i++){const x=10+i*u;s+=`<line x1="${x}" y1="0" x2="${x}" y2="16" stroke="#1D2B53" stroke-width="1.6"/><text x="${x}" y="33" text-anchor="middle" font-size="${u<18?11:13}" ${FONT} fill="#1D2B53">${i+(from||0)}</text>`;
    if(i<cm)s+=`<line x1="${x+u/2}" y1="0" x2="${x+u/2}" y2="9" stroke="#1D2B53" stroke-width="1"/>`;}
  return s+`<text x="${W-6}" y="${H-5}" text-anchor="end" font-size="10" ${FONT} fill="#9A7A1E">cm</text>`;}
// köksvåg med visare: max i hg (10 = 1 kg) eller kg
function scaleSVG(v,max,unit,emoji){const cx=100,cy=118,r=62,a0=-135,a1=135,ang=x=>(a0+(a1-a0)*x/max)*Math.PI/180;
  let s=`<rect x="40" y="38" width="120" height="14" rx="6" fill="#B9C2D6"/><rect x="90" y="48" width="20" height="14" fill="#9AA6C2"/>
    <text x="100" y="40" text-anchor="middle" font-size="38">${emoji}</text>
    <rect x="22" y="58" width="156" height="128" rx="26" fill="#3D8BFD"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="#2A62C0" stroke-width="3"/>`;
  for(let i=0;i<=max;i++){const a=ang(i),x1=cx+Math.sin(a)*(r-4),y1=cy-Math.cos(a)*(r-4),x2=cx+Math.sin(a)*(r-13),y2=cy-Math.cos(a)*(r-13);
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#1D2B53" stroke-width="2"/><text x="${cx+Math.sin(a)*(r-24)}" y="${cy-Math.cos(a)*(r-24)+4.5}" text-anchor="middle" font-size="12" ${FONT} fill="#1D2B53">${i}</text>`;
    if(i<max){const b=ang(i+.5);s+=`<line x1="${cx+Math.sin(b)*(r-4)}" y1="${cy-Math.cos(b)*(r-4)}" x2="${cx+Math.sin(b)*(r-9)}" y2="${cy-Math.cos(b)*(r-9)}" stroke="#1D2B53" stroke-width="1"/>`;}}
  const a=ang(v);s+=`<text x="${cx}" y="${cy+30}" text-anchor="middle" font-size="13" ${FONT} fill="#56668F">${unit}</text>
    <line x1="${cx}" y1="${cy}" x2="${cx+Math.sin(a)*(r-16)}" y2="${cy-Math.cos(a)*(r-16)}" stroke="#E5484D" stroke-width="3.5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="6" fill="#E5484D"/>`;
  return`<svg ${NS} viewBox="0 0 200 190" width="220" role="img" aria-label="En köksvåg">${s}</svg>`;}
// mätglas 0–10 dl, nivå i dl (halva går också), etikett 1 l vid 10
function glassSVG(v,label,step){const x=60,y=18,w=80,h=200,lv=y+h-h*v/10;let s=`<path d="M${x} ${y} V${y+h} q0 10 10 10 h${w-20} q10 0 10 -10 V${y}" fill="#F4F8FF" stroke="#9FB3E8" stroke-width="3"/>`;
  if(v>0)s+=`<path d="M${x+2} ${lv} H${x+w-2} V${y+h} q0 8 -8 8 h${-(w-20)} q-8 0 -8 -8 Z" fill="#FF8F6B" opacity=".85"/><rect x="${x+2}" y="${lv}" width="${w-4}" height="5" fill="#fff" opacity=".35"/>`;
  for(let i=1;i<=10;i++){const yy=y+h-h*i/10;s+=`<line x1="${x+w-2}" y1="${yy}" x2="${x+w-18}" y2="${yy}" stroke="#1D2B53" stroke-width="1.8"/><text x="${x+w+8}" y="${yy+5}" font-size="13" ${FONT} fill="#1D2B53">${step&&i%step?"":i===10&&label?"1 l":i}</text>`;}
  s+=`<text x="${x+w+8}" y="${y+h+6}" font-size="12" ${FONT} fill="#56668F">dl</text>`;
  return`<svg ${NS} viewBox="0 0 200 236" width="190" role="img" aria-label="Ett mätglas">${s}</svg>`;}

// bevarande: samma saft i ett högt smalt glas och en bred låg skål
function twoGlassSVG(){const c="#FF8F6B";
  return`<svg ${NS} viewBox="0 0 300 170" width="300" role="img" aria-label="Ett smalt glas och en bred skål">
  <path d="M40 20 V140 q0 8 8 8 h24 q8 0 8 -8 V20" fill="#F4F8FF" stroke="#9FB3E8" stroke-width="3"/><path d="M42 60 H78 V140 q0 6 -6 6 h-24 q-6 0 -6 -6Z" fill="${c}" opacity=".85"/>
  <path d="M110 70 q40 -30 80 0" fill="none" stroke="#56668F" stroke-width="3" stroke-dasharray="6 5"/><path d="M186 62 l6 9 l-11 2" fill="none" stroke="#56668F" stroke-width="3"/>
  <path d="M175 100 V140 q0 8 8 8 h100 q8 0 8 -8 V100" fill="#F4F8FF" stroke="#9FB3E8" stroke-width="3"/><path d="M177 126 H289 V140 q0 6 -6 6 h-100 q-6 0 -6 -6Z" fill="${c}" opacity=".85"/></svg>`;}

/* ---------- Uppgifter som kräver att man tänker (lärarens önskan: inte bara läsa av en siffra) ---------- */
// rimligt eller orimligt: [påstående, rimligt (1/0), förklaring]
const RIM={
 len:[["En dörr är 2 m hög.",1,"En dörr är lite högre än en vuxen, ungefär 2 m."],["En penna är 15 m lång.",0,"15 m är längre än en buss. En penna är ungefär 15 cm."],
  ["En buss är 12 m lång.",1,"En buss är ungefär 12 m."],["Ett lillfinger är 5 m långt.",0,"5 m är längre än ett rum. Ett lillfinger är ungefär 5 cm."],
  ["Ett klassrum är 30 m högt.",0,"30 m är som ett tiovåningshus. Ett klassrum är ungefär 3 m högt."],["En säng är 2 m lång.",1,"En säng är lite längre än en vuxen, ungefär 2 m."],
  ["En myra är 1 m lång.",0,"En myra är mindre än 1 cm."],["En linjal är 30 cm lång.",1,"En vanlig linjal är 30 cm."],["En fotbollsplan är 100 cm lång.",0,"100 cm är bara 1 m. En fotbollsplan är ungefär 100 m."]],
 vikt:[["Ett äpple väger 200 g.",1,"Ett äpple väger ungefär 2 hg, och 2 hg = 200 g."],["Ett äpple väger 200 hg.",0,"200 hg är 20 kg, mer än en hund! Ett äpple väger ungefär 200 g."],
  ["En katt väger 4 hg.",0,"4 hg är lika mycket som fyra äpplen. En katt väger ungefär 4 kg."],["En katt väger 4 kg.",1,"En katt väger ungefär 4 kg."],
  ["En cykel väger 15 g.",0,"15 g är som några gem. En cykel väger ungefär 15 kg."],["Ett paket mjölk väger 1 kg.",1,"En liter mjölk väger ungefär 1 kg."],
  ["Ett gem väger 1 kg.",0,"1 kg är som ett paket mjölk. Ett gem väger ungefär 1 g."],["En vuxen väger 70 kg.",1,"Det är rimligt för en vuxen."],
  ["En skolbok väger 5 kg.",0,"5 kg är som fem paket mjölk. En skolbok väger ungefär 5 hg."],["En banan väger 1 hg.",1,"En banan väger ungefär 1 hg."]],
 vol:[["Ett badkar rymmer 20 dl.",0,"20 dl är bara 2 l, en hink rymmer mer. Ett badkar rymmer ungefär 200 l."],["Ett glas rymmer 2 dl.",1,"Ett glas rymmer ungefär 2 dl."],
  ["En kopp rymmer 2 l.",0,"2 l är som två paket mjölk. En kopp rymmer ungefär 2 dl."],["En hink rymmer 10 l.",1,"En hink rymmer ungefär 10 l."],
  ["Ett mjölkpaket rymmer 1 l.",1,"Ett vanligt mjölkpaket rymmer 1 l."],["En sked rymmer 1 l.",0,"En sked rymmer mycket mindre än 1 dl."],
  ["En vattenflaska rymmer 5 dl.",1,"En vattenflaska rymmer ungefär 5 dl."],["En diskho rymmer 2 dl.",0,"2 dl är ett glas. En diskho rymmer ungefär 20 l."]]};
// vilken enhet saknas i meningen: [mening, rätt, val]
const LUCKA={
 len:[["Pennan är 15 ___ lång.","cm",["cm","m","km"]],["Bussen är 12 ___ lång.","m",["m","cm","km"]],["Det är 30 ___ till mormors stad.","km",["km","m","cm"]],["Boken är 2 ___ tjock.","cm",["cm","m","km"]]],
 vikt:[["Äpplet väger 2 ___.","hg",["g","hg","kg"]],["Hunden väger 20 ___.","kg",["g","hg","kg"]],["Gemet väger 1 ___.","g",["g","hg","kg"]],["Godispåsen väger 200 ___.","g",["g","hg","kg"]],["Katten väger 4 ___.","kg",["g","hg","kg"]]],
 vol:[["Glaset rymmer 2 ___.","dl",["dl","l"]],["Hinken rymmer 10 ___.","l",["dl","l"]],["Vattenflaskan rymmer 5 ___.","dl",["dl","l"]],["Badkaret rymmer 200 ___.","l",["dl","l"]]]};
// sortera: [emoji, namn, värde] (värdena skiljer minst dubbelt så att det går att tänka ut)
const SORT={
 len:[["🐜","myran",.5],["✏️","pennan",15],["📏","linjalen",30],["🚪","dörren",200],["🦒","giraffen",500],["🚌","bussen",1200],["🍌","bananen",20],["🐘","elefanten",300]],
 vikt:[["🪶","fjädern",.1],["📎","gemet",1],["🍎","äpplet",200],["📚","boken",500],["🐈","katten",4000],["🚲","cykeln",15000],["🧑","en vuxen",70000],["🍬","godisbiten",5]]};
function sortTask(k){for(;;){const it=shuffle(SORT[k].slice()).slice(0,4),v=it.map(x=>x[2]).sort((a,b)=>a-b);
  if(v.every((x,i)=>!i||x>=v[i-1]*2))return{k:"sort",kind:k,items:it.map(([e,n,val])=>({e,n,v:val})),order:[]};}}
const LOGIK=[["🍎","äpple","äpplen","🍉","vattenmelon","vattenmeloner"],["🍋","citron","citroner","🍍","ananas","ananasar"],["🥚","ägg","ägg","🧀","ost","ostar"]];

  return T.h;}
function key(k){if(!T||T.done||!NUMK.includes(T.k))return;if(T.k==="pour"&&!T.full)return;
  if(k==="del"){T.inp=T.inp.slice(0,-1);T.bad=false;render();return;}
  if(k==="ok"){if(T.inp)check(+T.inp);return;}
  if(T.inp.length<4){T.inp=(T.bad?"":T.inp)+k;T.bad=false;render();}}
function check(v){const a=answerOf();
  if(v===a){right();return;}
  T.tries++;T.bad=true;G.miss=true;window.Ljud&&Ljud.bad&&Ljud.bad();
  if(T.tries>=2){T.shown=a;T.done=true;T.bad=false;fb(`Det är ${a}${T.k==="ruler"||T.k==="broken"?" cm":T.k==="scale"||T.k==="tare"?" hg":T.k==="glass"||T.k==="glass2"||T.k==="pour"?" dl":""}. ${hintOf(v)}`,true);endTask(false);return;}
  fb(hintOf(v),true);render();}
function right(){const first=T.tries===0;T.done=true;T.bad=false;$("task").className="task ok";window.Ljud&&Ljud.ok&&Ljud.ok();
  fb(pick(["Rätt!","Precis!","Snyggt!"])+(T.why?" "+T.why:""));endTask(first);}
function endTask(first){if(!first)G.err++;render();$("pad").hidden=true;$("nextBtn").hidden=false;G.i++;}
$("ans").addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(!b||!T||T.k!=="fill"||T.done)return;const x=+b.dataset.p;
  if(x===0){T.n=0;fb("");render();return;}
  T.n+=x;window.Ljud&&Ljud.pop&&Ljud.pop(T.n);
  if(T.n===T.target){T.shown=null;render();right();return;}
  if(T.n>T.target){fb(`Det blev ${T.n} dl, för mycket. Töm och prova igen.`,true);render();return;}
  fb("");render();});
$("choices").addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(!b||!T||T.k!=="sort"||T.done)return;const i=+b.dataset.s;
  if(T.order.includes(i))return;T.order.push(i);window.Ljud&&Ljud.pop&&Ljud.pop(T.order.length);
  if(T.order.length<T.items.length){render();return;}
  const ok=T.order.every((x,j)=>!j||T.items[x].v>=T.items[T.order[j-1]].v);
  if(ok){T.right=1;render();right();return;}
  T.tries++;window.Ljud&&Ljud.bad&&Ljud.bad();
  const corr=T.items.map((x,i)=>i).sort((a,b)=>T.items[a].v-T.items[b].v);
  if(T.tries>=2){T.order=corr;T.done=true;fb(`Så här blir det: ${corr.map(x=>T.items[x].n).join(", ")}.`,true);render();endTask(false);return;}
  T.order=[];fb(T.kind==="len"?"Inte riktigt. Börja med det som är kortast.":"Inte riktigt. Börja med det som är lättast.",true);render();});
$("choices").onclick=e=>{const b=e.target.closest("[data-c]");if(!b||!T||T.done)return;const v=b.dataset.c;
  const ok=T.k==="balans"?v===T.hn:v===T.a;
  if(ok){b.classList.add("ok");right();return;}
  b.classList.add("bad");T.tries++;window.Ljud&&Ljud.bad&&Ljud.bad();
  const why=T.k==="balans"?`Vågen tippar ner på den tyngre sidan.`:T.why;
  if(T.tries>=2){T.done=true;fb(`${T.k==="balans"?`${T.hn[0].toUpperCase()+T.hn.slice(1)} väger mest.`:`Svaret är ${T.a}.`} ${why}`,true);
    $("choices").querySelectorAll("button").forEach(x=>{if(x.dataset.c===(T.k==="balans"?T.hn:T.a))x.classList.add("ok");});endTask(false);return;}
  fb(T.k==="balans"?"Titta åt vilket håll vågen tippar.":"Inte riktigt. Tänk efter en gång till.",true);};
$("nextBtn").onclick=()=>{if(G)next();};
$("pad").onclick=e=>{const b=e.target.closest("[data-k]");if(b)key(b.dataset.k);};
document.addEventListener("keydown",e=>{if(!G||$("game").hidden||!T)return;
  if(T.done){if(e.key==="Enter"&&!$("nextBtn").hidden){e.preventDefault();$("nextBtn").click();}return;}
  const k=/^\d$/.test(e.key)?e.key:e.key==="Backspace"?"del":e.key==="Enter"?"ok":null;if(k){e.preventDefault();key(k);}});
addEventListener("resize",()=>{if(G&&T&&!$("game").hidden){T.ox=null;T.rx=null;render();}});
function finish(){const st=G.err===0?3:G.err<=2?2:1,old=data.stars[G.lv]||0;
  data.stars[G.lv]=Math.max(old,st);save();
  $("rTitle").textContent=st===3?"Alla rätt direkt!":"Bra mätt!";$("rBig").innerHTML=starHtml(st);
  $("rSub").textContent=`${ROUND} uppgifter i ${G.L.name}. `+(G.err?`${G.err} behövde mer än ett försök.`:"Inga fel!")+(st>old&&old?" Ny stjärna!":"");
  show("result");if(st===3||st>old){window.Ljud&&Ljud.fanfare&&Ljud.fanfare();confetti();}}

/* ---------- Uppläsning och konfetti ---------- */
$("spk").onclick=()=>speak(lastSay.replace(/\bcm\b/g,"centimeter").replace(/\bdm\b/g,"decimeter").replace(/\bkm\b/g,"kilometer").replace(/\bm\b/g,"meter").replace(/\bkg\b/g,"kilo").replace(/\bhg\b/g,"hekto").replace(/\bdl\b/g,"deciliter").replace(/\bl\b/g,"liter").replace(/\bg\b/g,"gram"));
let svVoice=null;function loadVoices(){try{svVoice=speechSynthesis.getVoices().find(v=>/^sv/i.test(v.lang))||null}catch(e){}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
function speak(text){if(!("speechSynthesis" in window))return toast("Uppläsning fungerar inte i den här webbläsaren.");loadVoices();
  if(!svVoice&&speechSynthesis.getVoices().length)return toast("Den här datorn har ingen svensk röst för uppläsning.");
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="sv-SE";if(svVoice)u.voice=svVoice;u.rate=.9;speechSynthesis.speak(u);}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cols=["#3D8BFD","#FF9F43","#2BB673","#FFC93C","#7B61FF","#FF6B6B"];
  const c=$("fx"),x=c.getContext("2d"),dpr=window.devicePixelRatio||1,W2=innerWidth,H2=innerHeight;c.width=W2*dpr;c.height=H2*dpr;x.setTransform(dpr,0,0,dpr,0,0);c.hidden=false;
  const P=Array.from({length:150},()=>({x:W2/2+(Math.random()-.5)*120,y:H2*.3,vx:(Math.random()-.5)*16,vy:-Math.random()*15-4,r:Math.random()*7+5,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.4}));
  const t0=performance.now();(function f(now){x.clearRect(0,0,W2,H2);P.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(now-t0<2800)requestAnimationFrame(f);else{x.clearRect(0,0,W2,H2);c.hidden=true;}})(t0);
}
openHome();
</script>
