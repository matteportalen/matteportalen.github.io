<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kort division – Matte-Portalen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF3FF; --ink:#1D2B53; --muted:#56668F; --card:#FFFFFF; --line:#C6D6F2;
  --good:#1E9E5E; --good-dark:#157548; --bad:#E5484D; --accent:#3D5AFE; --gold:#F2B707;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:620px;margin:0 auto;padding:12px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none !important}
.back{display:inline-block;color:var(--muted);font-weight:700;text-decoration:none;padding:6px 0;font-size:1rem}
h1{font-size:2.1rem;line-height:1;margin:10px 0 4px;font-weight:800}
h2{font-size:2rem;line-height:1.1;margin:10px 0 6px;font-weight:800}
.lead{margin:0 0 12px;color:var(--muted);font-size:1.02rem}
.stars{color:var(--gold);letter-spacing:1px}.stars .off{color:#D5DDEC}
.opts{background:var(--card);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 var(--line);margin-bottom:12px}
.opts p{margin:0 0 6px;font-weight:800;font-size:1rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips{gap:4px;background:var(--bg);border-radius:14px;padding:4px}
.chips button{flex:1;min-height:44px;border-radius:11px;background:transparent;font-weight:800;font-size:1.05rem;padding:0 10px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 3px 0 #2A3DB8}
.levels{display:grid;gap:8px;margin-top:12px}
.lv{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:8px 12px 8px 8px;box-shadow:0 4px 0 var(--line);text-align:left;width:100%}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.lv .t{min-width:58px;height:48px;border-radius:12px;background:var(--c);color:#fff;box-shadow:0 3px 0 rgba(29,43,83,.15);display:grid;place-items:center;font-weight:800;font-size:1rem;flex:none;line-height:1.05;text-align:center;padding:0 6px}
.lv b{font-size:1.12rem;display:block;line-height:1.15}
.lv small{color:var(--muted);font-size:.88rem;display:block;line-height:1.25}
.lv .st{margin-left:auto;flex:none}
.sfr{display:inline-flex;flex-direction:column;align-items:center;line-height:1;font-size:.95rem}.sfr i{display:block;align-self:stretch;height:2px;background:currentColor;border-radius:1px;margin:2px 0}
@media (max-height:720px){#modeNote{display:none}.lv{padding:5px 12px 5px 6px}.lv .t{height:42px}.opts>p:first-child{display:none}.wrap h1{margin-top:4px}.lead{margin-bottom:8px}}
/* filmen (mallen i film.js) */
.fk.kt2{width:12px;height:120px}.fk.ke2{width:12px;height:12px}
.kdd{width:36px;text-align:center;font-weight:800;font-size:46px;line-height:1}
.kdbar{width:92px;height:4px;border-radius:2px;background:var(--ink)}
.kdbox{width:86px;height:58px;border-radius:12px;border:3px dashed #9FB3E8;background:#fff}
.kdbox.ok{border:3px solid var(--good);background:#E3F7EC}
.kda{width:36px;text-align:center;font-weight:800;font-size:44px;line-height:1;color:var(--good-dark)}
.kdr{width:24px;text-align:center;font-weight:800;font-size:24px;line-height:1;color:#C0283C}
.kdhl{border-radius:12px;background:#FFE9A8}
.fhog2{width:104px;height:180px;border-radius:18px;background:rgba(255,255,255,.85);box-shadow:0 4px 0 #D6E2F6;border:2px dashed #C6D6F2}
.fhog2.glow{border:2px solid #2BB673;box-shadow:0 0 0 4px rgba(43,182,115,.25),0 4px 0 #BFE8D2}
.fhog2 .fl{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-weight:800;font-size:22px;color:var(--good-dark)}
.kdchk{width:360px;text-align:center;font-weight:800;font-size:20px;color:var(--good-dark)}
.note{color:var(--muted);font-size:.88rem;margin:6px 2px 0;line-height:1.3;font-weight:600}
/* spelet: fyller skärmen exakt, inget att scrolla (höjden sätts i fit()) */
#game{display:flex;flex-direction:column;gap:10px}
#game[hidden]{display:none !important}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:10px;height:10px;border-radius:50%;background:#D3DEF2}
.dots i.on{background:var(--accent);transform:scale(1.25)}.dots i.done{background:var(--good)}
.gbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.kdwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.side{display:flex;flex-direction:column;justify-content:flex-end}
@media (min-width:860px) and (min-aspect-ratio:4/3){
  #game .gbody{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:18px;align-items:stretch}
  .wrap.wide{max-width:1100px}
  .side{justify-content:center}
  .pad button{height:64px}
  .instr{font-size:1.45rem}.feedback,.check{font-size:1.2rem}
}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.info{font-weight:800;font-size:1.2rem}
.progress{height:10px;border-radius:5px;background:var(--card);overflow:hidden;margin-top:6px;box-shadow:inset 0 0 0 2px var(--line)}
.progress i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.task{background:var(--card);border-radius:22px;padding:12px 14px;box-shadow:0 5px 0 var(--line);margin:0;transition:background .15s;flex:1;min-height:0;display:flex;flex-direction:column}
.task.ok{background:#DDF5E7}
.instr{font-weight:800;font-size:1.1rem;line-height:1.3;min-height:2.6em;text-align:center}
.spk{flex:none;width:44px;height:44px;border-radius:50%;background:var(--bg);font-size:1.3rem;box-shadow:0 3px 0 var(--line)}
/* uppställningen: täljaren över divisorn med bråkstreck, svaret efter likhetstecknet */
.kd{--cell:52px;display:flex;align-items:center;justify-content:center;gap:6px calc(var(--cell)*.18);margin:0;font-weight:800}
.frac{display:inline-flex;flex-direction:column;align-items:stretch}
.top{display:flex;padding-top:calc(var(--cell)*.42);position:relative;z-index:0}
.dg{position:relative;width:var(--cell);height:var(--cell);display:grid;place-items:center;font-size:calc(var(--cell)*.78);line-height:1}
.dg.comma{width:calc(var(--cell)*.4)}
.dg.new{color:var(--accent)}
.dg.cur::before{content:"";position:absolute;inset:4px 0 0;border-radius:10px;background:#FFF4CC;z-index:-1}
/* den lilla resten snett ovanför siffran */
.cb{position:absolute;left:-14%;top:-46%;width:calc(var(--cell)*.5);height:calc(var(--cell)*.5);min-width:24px;min-height:24px;border-radius:8px;display:grid;place-items:center;font-size:max(15px,calc(var(--cell)*.36));font-weight:800;color:#A32630;border:2px dashed #D59AA1;background:#fff}
.cb.empty{border-color:transparent;background:transparent}
.cb.act{border:3px solid var(--accent);background:#EEF1FF;color:var(--accent)}
.cb.ok{border:2px solid #F3B4B6;background:#FFF1F1}
.cb.bad{border:2px solid var(--bad);background:#FDE4E4;color:var(--bad)}
.cb.hidden{visibility:hidden}
.bar{height:4px;background:var(--ink);border-radius:2px;margin:4px 0}
.bot{text-align:center;font-size:calc(var(--cell)*.78);line-height:1.1}
.eqgrp{display:inline-flex;align-items:center;gap:8px;font-size:calc(var(--cell)*.78);line-height:1}
.ans{display:inline-flex;align-items:center;gap:2px;min-height:var(--cell)}
.ans .a{min-width:calc(var(--cell)*.62);text-align:center}
.kd .box{display:inline-grid;place-items:center;min-width:calc(var(--cell)*.75);height:calc(var(--cell)*.95);border-radius:10px;border:3px solid var(--accent);background:#EEF1FF;color:var(--accent);padding:0 4px}
.kd .box.bad{border-color:var(--bad);background:#FDE4E4;color:var(--bad)}
.kd .box.ok{border-color:var(--good);background:#DDF5E7;color:var(--good-dark)}
.kd .box.idle{border:2px dashed #AFC4EA;background:#fff;color:var(--ink)}
.rest{display:inline-flex;align-items:center;gap:6px;font-size:.62em;color:var(--muted)}
.rest .box{font-size:1.5em}
.check{text-align:center;font-weight:800;color:var(--good-dark);font-size:1.05rem;min-height:1.3em}
.feedback{min-height:2.7em;font-weight:800;font-size:1rem;margin-top:4px;text-align:center;color:var(--good-dark);line-height:1.3;display:flex;align-items:center;justify-content:center}
.feedback.bad{color:#9B2C3A;background:#FFE9EC;border-radius:12px;padding:6px 10px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.pad button{height:54px;border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--line);font-size:1.7rem;font-weight:800}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad .next{font-size:.95rem;line-height:1.05;background:#F6F8FF}
.pad .okbtn{background:var(--good);color:#fff;box-shadow:0 4px 0 var(--good-dark);font-size:1.3rem}
.pad .comma{background:#FFF4CC;box-shadow:0 4px 0 #EAD58A}
.go{display:block;width:100%;padding:14px 16px;border-radius:18px;background:var(--good);color:#fff;box-shadow:0 5px 0 var(--good-dark);font-weight:800;font-size:1.3rem;margin-top:12px}
#game .go{margin-top:0}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--good-dark)}
.result{text-align:center;padding-top:20px}
.rbig{font-size:clamp(3.2rem,16vw,4.6rem);font-weight:800;line-height:1;margin:6px 0}
.rsub{color:var(--muted);font-size:1.15rem;margin:0 0 14px}
.big{display:block;width:100%;padding:12px 16px;border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:1.2rem;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:800;z-index:9;max-width:90vw;text-align:center}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
<section id="home" class="screen">
  <h1 style="display:flex;align-items:center;gap:10px"><span style="display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#17AFC4;box-shadow:0 3px 0 rgba(29,43,83,.15)"><svg viewBox="0 0 60 60" width="42" height="42" aria-hidden="true"><rect x="2" y="2" width="56" height="56" rx="12" fill="#fff"/><text x="12" y="29" font-size="16" text-anchor="middle" font-family="Baloo 2, Trebuchet MS, sans-serif" font-weight="800" fill="#1D2B53">7</text><text x="25" y="29" font-size="16" text-anchor="middle" font-family="Baloo 2, Trebuchet MS, sans-serif" font-weight="800" fill="#1D2B53">2</text><text x="19.5" y="16" font-size="8.5" text-anchor="middle" font-family="Baloo 2, Trebuchet MS, sans-serif" font-weight="800" fill="#E5484D">1</text><rect x="4" y="32" width="28" height="2.6" rx="1.3" fill="#1D2B53"/><text x="18" y="49" font-size="16" text-anchor="middle" font-family="Baloo 2, Trebuchet MS, sans-serif" font-weight="800" fill="#1D2B53">3</text><text x="39" y="38" font-size="12" text-anchor="middle" font-family="Baloo 2, Trebuchet MS, sans-serif" font-weight="800" fill="#1D2B53">=</text><text x="51" y="38" font-size="14" text-anchor="middle" font-family="Baloo 2, Trebuchet MS, sans-serif" font-weight="800" fill="#157548">24</text></svg></span>Kort division<button class="filmpill" id="filmBtn">🎬 Se hur man gör</button></h1>
  <p class="lead">Dela siffra för siffra. Resten skrivs snett ovanför nästa siffra.</p>
  <div class="opts"><p>Hur vill du räkna?</p><div class="chips" id="modeChips"><button data-m="steg">Visa stegen</button><button data-m="sjalv">Själv</button></div><p class="note" id="modeNote"></p></div>
  <div class="levels" id="levels"></div>
</section>
<section id="film" class="screen" hidden></section>
<section id="game" class="screen" hidden>
  <div class="gtop"><button class="back" id="quit">← Avsluta</button><span class="dots" id="dots" aria-hidden="true"></span><button class="spk" id="spk" aria-label="Läs upp">🔊</button></div>
  <div class="gbody">
    <div class="task" id="task">
      <div class="instr" id="instr" aria-live="polite"></div>
      <div class="kdwrap" id="kdwrap"><div class="kd" id="kd"></div></div>
      <div class="check" id="check"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
    </div>
    <div class="side">
      <div class="pad" id="pad">
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="del" aria-label="Sudda">⌫</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="0">0</button>
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="none" class="next" id="noneKey">Ingen rest</button>
        <button data-k="," class="comma" id="commaKey" aria-label="Decimaltecken">,</button><button data-k="ok" class="okbtn" id="okKey" style="grid-column:span 3">Rätta</button>
      </div>
      <button class="go" id="nextBtn" hidden>Nästa tal →</button>
    </div>
  </div>
</section>
<section id="result" class="screen result" hidden>
  <h2 id="rTitle"></h2>
  <div class="rbig" id="rBig"></div>
  <p class="rsub" id="rSub"></p>
  <button class="go" id="rAgain">Räkna igen</button>
  <button class="big" id="rHome">Välj en annan nivå</button>
</section>
</div>
<div class="toast" id="toast" hidden></div>
<canvas id="fx" hidden></canvas>
<script src="../ljud.js"></script>
<script src="../djur.js"></script>
<script src="../klossar.js"></script>
<script src="../film.js"></script>
<script src="../huvud.js" data-titel="Kort division" data-ikon="➗"></script>
<script>
/* Kort division som i läroboken: täljaren över divisorn med bråkstreck, svaret efter likhetstecknet, resten i svaret skrivs "rest".
   Är första siffran för liten tar man de två första direkt: "Hur många gånger går 4 i 13? 3 gånger, rest 1." Resten skrivs litet snett ovanför nästa siffra
   (eleven skriver den själv, som minnessiffran i Uppställning). Decimaler: sätt decimaltecken och lägg till en nolla.
   Visa stegen: varje steg kontrolleras direkt med en fråga och ledtråd. Själv: inga tips, allt rättas på en gång. */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const KEY="mattespel-kortdivision-v1",ROUND=6;
const data=(()=>{try{return Object.assign({stars:{},mode:"steg"},JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return{stars:{},mode:"steg"}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};

/* ---------- Talen ---------- */
// steg för talet: för varje siffra (även decimalnollor) vad man delar, kvotsiffran och resten
function solve(n,d,dec){
  const digs=String(n).split("").map(Number);for(let i=0;i<dec;i++)digs.push(0);
  const steps=[];let carry=0,started=false;
  digs.forEach((x,i)=>{const num=carry*10+x,q=Math.floor(num/d),r=num%d,write=started||q>0||i===digs.length-1-dec&&!started;
    // är första siffran för liten tar man de två första direkt ("3 i 21"); ingen liten siffra skrivs, som i skolan
    const skip=i===0&&!write&&digs.length>1;
    if(write)started=true;steps.push({i,x,carryIn:carry,num,q,r,write,skip});carry=r;});
  const intLen=String(n).length,qInt=Math.floor(n/d),rest=dec?0:n%d,qStr=dec?(n/d).toFixed(dec).replace(".",","):String(qInt);
  return{digs,steps,intLen,dec,rest,qStr,d,n};}
const LEVELS=[
 // Nivå 1 och 2 ihopslagna (lärarens önskan): ibland förs en rest över, ibland inte, så att eleven själv måste tänka efter.
 {id:1,name:"Tvåsiffriga tal",desc:"Ibland blir det rest som förs över",ex:"72/3",c:"#2BB673",gen:()=>{
   if(Math.random()<.4){for(;;){const d=rnd(2,4),a=rnd(1,Math.floor(9/d)),b=rnd(0,Math.floor(9/d)),n=(a*10+b)*d;if(n>=10&&n<100)return{n,d,dec:0};}}
   for(;;){const d=rnd(2,9),q=rnd(10,Math.floor(99/d)),n=q*d;if(n<100&&Math.floor(n/10)%d!==0)return{n,d,dec:0};}}},
 {id:3,name:"Rest i svaret",desc:"Det blir något över på slutet",ex:"73/3",c:"#FF9F43",gen:()=>{for(;;){const d=rnd(2,9),q=rnd(4,Math.floor(99/d)),r=rnd(1,d-1),n=q*d+r;if(n>=10&&n<100)return{n,d,dec:0};}}},
 {id:4,name:"Tresiffriga tal",desc:"Med och utan rest i svaret",ex:"133/4",c:"#7B61FF",gen:()=>{for(;;){const d=rnd(2,9),r=Math.random()<.5?0:rnd(1,d-1),q=rnd(Math.ceil(100/d),Math.floor((999-r)/d)),n=q*d+r;
   if(n>=100&&n<1000&&!String(q).slice(1).includes("0"))return{n,d,dec:0};}}},
 {id:5,name:"Nolla i svaret",desc:"Ibland går det inga gånger mitt i",ex:"618/3",c:"#FF5FA2",gen:()=>{for(;;){const d=rnd(2,9),a=rnd(1,9),b=rnd(1,9),q=a*100+b,r=Math.random()<.3?rnd(1,d-1):0,n=q*d+r;if(n<1000)return{n,d,dec:0};}}},
 {id:6,name:"Decimaler",desc:"Sätt decimaltecken och fortsätt",ex:"133/4",c:"#17AFC4",gen:()=>{for(;;){const d=pick([2,4,4,5,8,8]),n=rnd(11,250);if(n%d===0)continue;if((n*100)%d!==0)continue;const dec=(n*10)%d===0?1:2;return{n,d,dec};}}}
];

/* ---------- Skärmar ---------- */
function show(id){document.querySelectorAll(".screen").forEach(s=>s.hidden=s.id!==id);window.scrollTo(0,0);if(window.MPS)MPS.visa(id);
  if(id!=="game"){const w=document.querySelector(".wrap");w.classList.remove("wide");w.style.paddingBottom="";}else requestAnimationFrame(fit);}
const sfr=ex=>{const [a,b]=ex.split("/");return `<span class="sfr">${a}<i></i>${b}</span>`;};
const starHtml=n=>`<span class="stars">${[1,2,3].map(i=>i<=n?"★":'<span class="off">★</span>').join("")}</span>`;
function openHome(){G=null;
  $("modeChips").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===data.mode));
  $("modeNote").textContent=data.mode==="steg"?"En fråga för varje steg, med ledtråd om något blir fel.":"Skriv allt själv och tryck Rätta. Inga tips förrän du rättar.";
  $("levels").innerHTML=LEVELS.map((l,ix)=>`<button class="lv" data-l="${l.id}" style="--c:${l.c}"><span class="t">${sfr(l.ex)}</span><span><b>${l.name}</b></span><span class="st">${starHtml((data.stars[data.mode]||{})[l.id]||0)}</span></button>`).join("");
  show("home");}
$("modeChips").onclick=e=>{const b=e.target.closest("[data-m]");if(!b)return;data.mode=b.dataset.m;save();openHome();};
$("levels").onclick=e=>{const b=e.target.closest("[data-l]");if(b)start(+b.dataset.l);};
$("quit").onclick=openHome;$("rHome").onclick=openHome;$("rAgain").onclick=()=>start(G?G.lv:1);

/* ---------- Spelet ---------- */
let G=null;
function start(lv){G={lv,L:LEVELS.find(l=>l.id===lv),k:0,err:0,mode:data.mode,seen:new Set()};show("game");next();}
function next(){
  if(G.k>=ROUND)return finish();
  let t;do{t=G.L.gen();}while(G.seen.has(t.n+"/"+t.d));G.seen.add(t.n+"/"+t.d);
  G.t=t;G.sol=solve(t.n,t.d,t.dec);G.miss=false;G.done=false;
  // läge för Visa stegen: vilken siffra vi är på och vad som efterfrågas
  G.s={i:G.sol.steps[0].skip?1:0,phase:"q",ans:"",carries:{},shownDec:0,restVal:"",restOn:false,marks:{}};
  // Själv: allt eleven skriver

function stepPrompt(){
  const s=G.s,sol=G.sol,st=sol.steps[s.i],d=sol.d;s.ans="";s.wrong=false;
  if(s.phase==="q")say(`Hur många gånger går ${d} i ${st.num}?`);
  else if(s.phase==="c")say(`${d} · ${st.q} = ${d*st.q}. Blir det något över? Skriv resten snett ovanför nästa siffra, eller tryck Ingen.`);
  else if(s.phase==="comma")say("Siffrorna är slut men det blev rest. Tryck på , för att sätta decimaltecken och lägga till en nolla.");
  else if(s.phase==="rest")say("Siffrorna är slut. Hur mycket blev över? Skriv resten.");
  render();}
function stepKey(k){
  const s=G.s,sol=G.sol,st=sol.steps[s.i],d=sol.d;if(G.done)return;
  if(k==="del"){s.ans="";s.wrong=false;render();return;}
  if(s.phase==="comma"){if(k===","){s.shownDec=1;window.Ljud&&Ljud.ok();fb("Rätt! Nu blir det en nolla efter decimaltecknet.");if(st.q===0)vidare();else{s.phase="c";stepPrompt();}}else wrong("Tryck på , (decimaltecknet) för att fortsätta efter kommat.");return;}
  if(k===","){fb("Decimaltecknet kommer när siffrorna är slut.",true);return;}
  if(k==="ok")return;
  const v=k==="none"?0:+k;
  if(s.phase==="q"){
    if(v===st.q){window.Ljud&&Ljud.ok();
      fb(st.q===0&&!st.write?`Inga gånger! Då skriver vi ingen siffra i svaret. ${st.num} följer med till nästa siffra.`:st.q===0?`Inga gånger! Då skriver vi en nolla i svaret och tar med ${st.num} till nästa siffra.`:`Rätt! ${d} går ${st.q} ${st.q===1?"gång":"gånger"} i ${st.num}.`);
      afterQ();}
    else wrong(`${tabHint(d,st.num)} Hur många gånger går ${d} i ${st.num}?`);
  }else if(s.phase==="c"){
    if(v===st.r){window.Ljud&&Ljud.ok();s.carries[s.i+1]=st.r?String(st.r):"";
      fb(st.r?`Rätt! ${st.r}:an gör att det blir ${st.r*10+sol.digs[s.i+1]} nästa gång.`:"Rätt, ingen rest!");
      s.i++;s.phase="q";stepPrompt();}
    else wrong(`${st.num} − ${d*st.q} = ${st.r}. ${st.r?`Skriv ${st.r} snett ovanför nästa siffra.`:"Det blir inget över, tryck Ingen."}`);
  }else if(s.phase==="rest"){
    if(v===sol.rest){window.Ljud&&Ljud.ok();s.phase="done";finishTask();}
    else wrong(`${st.num} − ${d*st.q} = ${sol.rest}. Det är resten.`);
  }
}

function vidare(){const s=G.s;s.carries[s.i+1]="";s.i++;s.phase="q";stepPrompt();}
function afterQ(){const s=G.s,sol=G.sol,i=s.i,last=i===sol.digs.length-1,noll=sol.steps[i].q===0;
  if(i<sol.intLen-1){if(noll)vidare();else{s.phase="c";stepPrompt();}return;}
  if(i===sol.intLen-1){
    if(sol.dec){s.phase="comma";stepPrompt();return;}            // det blev rest: sätt decimaltecken
    if(sol.rest>0){s.restOn=true;s.phase="rest";stepPrompt();return;}
    s.phase="done";finishTask();return;}
  if(!last){s.shownDec++;if(noll)vidare();else{s.phase="c";stepPrompt();}return;}   // en decimalnolla till
  s.phase="done";finishTask();}

function selfCheck(){
