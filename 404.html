<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pluggparken har flyttat</title>
<link rel="canonical" href="https://pluggparken.se/">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1F3A35;color:#F3F0E4;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
h1{margin:0 0 8px;font-size:1.6rem}
p{margin:0 auto;max-width:28em;font-weight:600;line-height:1.4;color:#C9DCD5}
a{color:#F4D35E;font-weight:800}
</style>
</head>
<body>
<main><h1>Matte-Portalen heter nu Pluggparken</h1><p>Du skickas vidare till <a href="https://pluggparken.se/">pluggparken.se</a>, och dina framsteg följer med.</p></main>
<script>
/* Matte-Portalen har flyttat till pluggparken.se. Den här sidan ligger på alla gamla adresser (index.html och 404.html).
   Webbläsaren sparar framstegen per adress, så här packas allt i localStorage och skickas med till pluggparken.se/flytta/,
   som lägger in det och öppnar samma sida på den nya adressen. Inget raderas här. */
(async function(){
  const NY='https://pluggparken.se',t=location.pathname+location.search+location.hash;
  const ga=u=>location.replace(u);
  try{
    const d={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);d[k]=localStorage.getItem(k);}
    if(!Object.keys(d).length)return ga(NY+t);
    const pack=async o=>{let b=new TextEncoder().encode(JSON.stringify(o)),z=0;
      if(window.CompressionStream){const s=new Blob([b]).stream().pipeThrough(new CompressionStream('deflate-raw'));b=new Uint8Array(await new Response(s).arrayBuffer());z=1;}
      let bin='';for(let j=0;j<b.length;j+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(j,j+0x8000));
      return z+'.'+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
    let p=await pack(d),utan=false;
    if(p.length>1500000&&d['matteportalen-galleri']){delete d['matteportalen-galleri'];p=await pack(d);utan=true;}
    ga(NY+'/flytta/#d='+p+'&t='+encodeURIComponent(t)+(utan?'&g=0':''));
  }catch(e){ga(NY+t);}
})();
</script>
</body>
</html>
