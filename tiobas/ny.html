<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiobas – Matte-Portalen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF3FF; --ink:#1D2B53; --muted:#56668F; --card:#FFFFFF; --line:#C6D6F2;
  --good:#1E9E5E; --good-dark:#157548; --bad:#E5484D; --accent:#3D5AFE; --gold:#F2B707;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --wood:#EBCB94; --wood-d:#B98A4E;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.3;-webkit-tap-highlight-color:transparent;overflow:hidden;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
.app{height:100%;display:flex;flex-direction:column;padding:6px 10px 8px;gap:6px;max-width:1200px;margin:0 auto}

/* Överst: tillbaka, rubrik, verktyg */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.back{color:var(--muted);font-weight:700;text-decoration:none;font-size:.95rem;white-space:nowrap}
h1{font-size:1.5rem;margin:0 6px 0 2px;font-weight:800;line-height:1}
.tools{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tbtn{background:var(--card);border-radius:12px;padding:5px 11px;font-weight:800;font-size:.95rem;box-shadow:0 3px 0 var(--line);min-height:40px;white-space:nowrap}
.tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tbtn[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 3px 0 #0E1838}
.tbtn:disabled{opacity:.4}
.total{font-weight:800;font-size:1.35rem;white-space:nowrap}
.msg{min-height:1.35em;font-weight:700;color:var(--muted);font-size:1rem;text-align:center}
.msg.hot{color:#B86E00}

/* Tavlan: en kolumn per position. Klossarna ligger i #stage ovanpå, så att de kan flyga mellan kolumnerna. */
.boardwrap{flex:1;min-height:0;position:relative}
.board{position:absolute;inset:0;display:flex;gap:8px}
.col{flex:1;min-width:0;background:var(--card);border-radius:16px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;overflow:hidden}
.col.th{flex:.95}
.col h2{margin:0;padding:3px 4px;font-size:.95rem;text-align:center;color:#fff;font-weight:800;background:var(--c)}
.area{flex:1;min-height:0;position:relative;cursor:pointer}
.col{container-type:inline-size}
.foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:5px;padding:4px;border-top:2px solid #EEF2FA}
.foot [data-up]{justify-self:end}.foot [data-down]{justify-self:start;grid-column:3}.foot .digit{grid-column:2}
/* smala kolumner: mindre text, och i de smalaste står bara ⇐ 10 och 1 ⇒ */
@container (max-width:230px){.xch{font-size:.72rem;padding:2px 5px;min-height:32px}.digit{font-size:1.25rem}}
@container (max-width:215px){.xch .w{display:none}.xch{font-size:.85rem;padding:2px 8px}}
@container (max-width:125px){.foot{grid-template-columns:1fr 1fr;gap:3px}.foot .digit{grid-column:1/3;grid-row:1}.foot [data-up]{grid-column:1;grid-row:2;justify-self:center}.foot [data-down]{grid-column:2;grid-row:2;justify-self:center}.xch{font-size:.72rem;padding:1px 4px}}
.digit{min-width:1.6em;text-align:center;font-weight:800;font-size:1.5rem;line-height:1.1}
.digit.over{color:var(--bad)}
.xch{border-radius:11px;padding:3px 9px;font-weight:800;font-size:.85rem;background:#F1F4FA;box-shadow:0 3px 0 var(--line);min-height:36px;white-space:nowrap}
.xch:disabled{opacity:.35}
.xch.hot{background:#FFE58A;box-shadow:0 3px 0 #D9A400;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
/* Lådan längst ner i varje kolumn */
.box{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 6px 6px;padding:4px 8px;border-radius:12px;background:#C99A6B;box-shadow:inset 0 -5px 0 #A97A4E,0 3px 0 #8A5E37;color:#fff;font-weight:800;min-height:46px}
.box:active{transform:translateY(2px)}
.box .ico{height:30px;display:flex;align-items:center}
.box .ico svg{height:100%;width:auto}
.box .left{font-size:.85rem;line-height:1;text-align:left}
.box.empty{background:#D8CFC4;box-shadow:inset 0 -5px 0 #BCB0A2,0 3px 0 #9C8F80;color:#6E6255}

#stage{position:absolute;inset:0;pointer-events:none}
.blk{position:absolute;left:0;top:0;transition:transform .38s cubic-bezier(.3,.8,.3,1),width .38s,height .38s,opacity .3s;will-change:transform}
.blk svg{width:100%;height:100%;display:block;overflow:visible}
.blk.pop{animation:pop .35s ease-out}
@keyframes pop{0%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.blk{transition:none}.blk.pop{animation:none}.xch.hot{animation:none}}

.hide-digits .digit,.hide-digits .total{visibility:hidden}

/* Stående mobil: ett litet tips, inte i vägen */
.tip{display:flex;align-items:center;gap:8px;background:#FFF4CC;border-radius:12px;padding:4px 6px 4px 10px;font-weight:700;font-size:.92rem;line-height:1.2}
.tip .phone{font-size:1.3rem;display:inline-block;animation:turn 2.4s ease-in-out infinite}
@keyframes turn{0%,35%{transform:rotate(0)}65%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){.tip .phone{animation:none}}
.tip .x{margin-left:auto;flex:none;width:36px;height:36px;border-radius:10px;font-weight:800;color:var(--muted)}

/* Stående läge (om man stängt rutan): mindre text */
@media (orientation:portrait) and (max-width:600px){
  h1{font-size:1.25rem}.tbtn{padding:4px 8px;font-size:.85rem}.xch{font-size:.75rem;padding:2px 6px}
  .col h2{font-size:.78rem}.box .left{font-size:.72rem}.box{gap:4px;padding:3px 4px;margin:0 3px 4px}.board{gap:5px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <a class="back" href="../">← Matte-Portalen</a>
    <h1>Tiobas</h1>
    <span class="total" id="total" aria-live="polite"></span>
    <div class="tools">
      <button class="tbtn" id="undo" disabled>↶ Ångra</button>
      <button class="tbtn" id="clear">Töm bordet</button>
      <button class="tbtn" id="digits" aria-pressed="false">Dölj siffror</button>
      <button class="tbtn" id="thBtn" aria-pressed="false">Tusental</button>
    </div>
  </div>
  <div class="tip" id="rotTip" hidden><span class="phone" aria-hidden="true">📱</span><span>Tips: vrid mobilen till liggande läge för bättre översikt.</span><button class="x" id="rotX" aria-label="Stäng tipset">✕</button></div>
  <div class="msg" id="msg" aria-live="polite">Tryck på en låda för att ta en kloss. Tryck på en kloss för att lägga tillbaka den.</div>
  <div class="boardwrap" id="boardwrap">
    <div class="board" id="board"></div>
    <div id="stage"></div>
  </div>
</div>
<script src="../ljud.js"></script>
<script>
const $=id=>document.getElementById(id);
/* ---------- Klossarna: trä med spår, ritade i kod ---------- */
const W="#EBCB94",WD="#B98A4E",GR="#C9A066",HL="#F6DFB4";
const grain=(w,h)=>`<path d="M${w*.15} ${h*.2} q${w*.2} ${h*.06} ${w*.4} 0 t${w*.4} 0 M${w*.1} ${h*.62} q${w*.25} ${-h*.05} ${w*.5} 0 t${w*.35} 0" fill="none" stroke="${GR}" stroke-width="${Math.min(w,h)*.02+.15}" opacity=".45"/>`;
const ART={
  e:`<svg viewBox="0 0 10 10" aria-hidden="true"><rect x=".4" y=".4" width="9.2" height="9.2" rx="1.2" fill="${W}" stroke="${WD}" stroke-width=".8"/><path d="M1.6 7.8 V1.6 H7.8" stroke="${HL}" stroke-width=".9" fill="none" stroke-linecap="round"/></svg>`,
  t:`<svg viewBox="0 0 10 100" preserveAspectRatio="none" aria-hidden="true"><rect x=".4" y=".4" width="9.2" height="99.2" rx="1.2" fill="${W}" stroke="${WD}" stroke-width=".8"/>${grain(10,100)}${Array.from({length:9},(_,i)=>`<line x1=".4" y1="${(i+1)*10}" x2="9.6" y2="${(i+1)*10}" stroke="${WD}" stroke-width=".7"/>`).join("")}<path d="M1.6 98 V1.6" stroke="${HL}" stroke-width=".9" stroke-linecap="round"/></svg>`,
  h:`<svg viewBox="0 0 100 100" aria-hidden="true"><rect x=".6" y=".6" width="98.8" height="98.8" rx="2" fill="${W}" stroke="${WD}" stroke-width="1.2"/>${grain(100,100)}${Array.from({length:9},(_,i)=>`<line x1="${(i+1)*10}" y1=".6" x2="${(i+1)*10}" y2="99.4" stroke="${WD}" stroke-width=".7"/><line x1=".6" y1="${(i+1)*10}" x2="99.4" y2="${(i+1)*10}" stroke="${WD}" stroke-width=".7"/>`).join("")}<path d="M2.5 97 V2.5 H97" stroke="${HL}" stroke-width="1.2" fill="none"/></svg>`,
  th:(()=>{ /* tusenkuben snett framifrån: framsida, ovansida och höger sida, med spår */
    const s=80,d=24,F=`M0 ${d} h${s} v${s} h${-s}Z`,T=`M0 ${d} l${d} ${-d} h${s} l${-d} ${d}Z`,R=`M${s} ${d} l${d} ${-d} v${s} l${-d} ${d}Z`;let g="";
    for(let i=1;i<10;i++){const k=i*s/10,m=i*d/10;
      g+=`<line x1="${k}" y1="${d}" x2="${k}" y2="${d+s}"/><line x1="0" y1="${d+k}" x2="${s}" y2="${d+k}"/>`+
         `<line x1="${k}" y1="${d}" x2="${k+d}" y2="0"/><line x1="${m}" y1="${d-m}" x2="${m+s}" y2="${d-m}"/>`+
         `<line x1="${s}" y1="${d+k}" x2="${s+d}" y2="${k}"/><line x1="${s+m}" y1="${d-m}" x2="${s+m}" y2="${d-m+s}"/>`;}
    return`<svg viewBox="-1 -1 ${s+d+2} ${s+d+2}" aria-hidden="true"><path d="${F}" fill="${W}"/><path d="${T}" fill="#F3DAA9"/><path d="${R}" fill="#D9B377"/><g stroke="${WD}" stroke-width=".7">${g}</g><path d="${F} ${T} ${R}" fill="none" stroke="${WD}" stroke-width="1.4" stroke-linejoin="round"/></svg>`;})()
};
/* ---------- Läge ---------- */
const K=["th","h","t","e"],NAME={th:"tusental",h:"hundratal",t:"tiotal",e:"ental"},HEAD={th:"Tusental",h:"Hundratal",t:"Tiotal",e:"Ental"};
const PL={th:"tusenkuber",h:"hundraplattor",t:"tiostavar",e:"ental"},ONE={th:"en tusenkub",h:"en hundraplatta",t:"en tiostav",e:"ett ental"};
const COLC={th:"#7B61FF",h:"#3D8BFD",t:"#2BB673",e:"#FF9F43"};
const BOX=10;                                  // lådan har 10 av varje sort
const S={n:{th:0,h:0,t:0,e:0},showTh:false,hide:false};
const blocks={th:[],h:[],t:[],e:[]};           // DOM-klossarna per kolumn
let hist=[],busy=false;
const stage=$("stage"),board=$("board");
const visible=()=>K.filter(k=>k!=="th"||S.showTh||S.n.th>0);
const left=k=>Math.max(0,BOX-S.n[k]);

/* ---------- Placering: hur klossarna ligger i en kolumn (i enheter u = ett ental) ---------- */
function slot(k,i){
  if(k==="e"){const r=Math.floor(i/5),c=i%5;return{x:c*1.25,y:r*1.25+(r>=2?.7:0),w:1,h:1};}
  if(k==="t"){const r=Math.floor(i/10),c=i%10;return{x:c*1.4+(c>=5?.8:0),y:r*11.2,w:1,h:10};}
  const sz=k==="h"?10:10.4,off=.9,p=Math.floor(i/5),j=i%5,pc=p%2,pr=Math.floor(p/2),span=sz+4*off+1.4;
  return{x:pc*span+j*off,y:pr*span+j*off,w:sz,h:sz};
}
function need(k,n){ // hur stor yta n klossar behöver, i enheter
  if(n<=0)return{w:0,h:0};let w=0,h=0;for(let i=0;i<n;i++){const s=slot(k,i);w=Math.max(w,s.x+s.w);h=Math.max(h,s.y+s.h);}return{w,h};
}
let U=12;
function measure(){
  const st=stage.getBoundingClientRect(),cols={};
  visible().forEach(k=>{const a=board.querySelector(`.col[data-k="${k}"] .area`).getBoundingClientRect();cols[k]={x:a.left-st.left,y:a.top-st.top,w:a.width,h:a.height};});
  /* samma enhet i alla kolumner, så att en tiostav alltid är exakt tio ental lång */
  let u=26;visible().forEach(k=>{const nd=need(k,Math.max(S.n[k],k==="e"?10:k==="t"?5:2)),c=cols[k];if(nd.w)u=Math.min(u,(c.w-14)/nd.w);if(nd.h)u=Math.min(u,(c.h-14)/nd.h);});
  U=Math.max(3.5,u);return cols;
}
function place(el,k,i,cols,u){
  const s=slot(k,i),c=cols[k],nd=need(k,S.n[k]),ox=c.x+(c.w-nd.w*u)/2,oy=c.y+8;
  el.style.width=s.w*u+"px";el.style.height=s.h*u+"px";el.style.transform=`translate(${ox+s.x*u}px,${oy+s.y*u}px)`;
}
function layout(){const cols=measure();visible().forEach(k=>blocks[k].forEach((el,i)=>place(el,k,i,cols,U)));return cols;}

/* ---------- Tavlan ---------- */
function buildBoard(){
  board.innerHTML=visible().map(k=>`<section class="col ${k}" data-k="${k}" style="--c:${COLC[k]}"><h2>${HEAD[k]}</h2><div class="area" data-k="${k}" aria-label="${HEAD[k]}, tryck för att lägga tillbaka en kloss"></div>
    <div class="foot">${k!=="th"?`<button class="xch" data-up="${k}" aria-label="Växla 10 ${PL[k]} mot ${ONE[upOf(k)]}">⇐ <span class="w">Växla </span>10</button>`:""}<span class="digit" id="d_${k}"></span>${k!=="e"?`<button class="xch" data-down="${k}" aria-label="Växla ${ONE[k]} mot 10 ${PL[downOf(k)]}"><span class="w">Växla </span>1 ⇒</button>`:""}</div>
    <button class="box" data-box="${k}"><span class="ico">${ART[k]}</span><span class="left" id="l_${k}"></span></button></section>`).join("");
  board.querySelectorAll("[data-box]").forEach(b=>b.onclick=()=>take(b.dataset.box));
  board.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>exchangeUp(b.dataset.up));
  board.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>exchangeDown(b.dataset.down));
  board.querySelectorAll(".area").forEach(a=>a.onclick=e=>putBack(a.dataset.k,e));
  K.forEach(k=>{if(!visible().includes(k)){blocks[k].forEach(el=>el.remove());blocks[k]=[];}});
}
const upOf=k=>K[K.indexOf(k)-1],downOf=k=>K[K.indexOf(k)+1];
function refresh(){
  visible().forEach(k=>{const d=$("d_"+k);d.textContent=S.n[k];d.classList.toggle("over",S.n[k]>=10);
    $("l_"+k).innerHTML=`${left(k)} kvar<br>i lådan`;board.querySelector(`[data-box="${k}"]`).classList.toggle("empty",!left(k));
    const up=board.querySelector(`[data-up="${k}"]`);if(up){up.disabled=S.n[k]<10;up.classList.toggle("hot",S.n[k]>=10);}
    const dn=board.querySelector(`[data-down="${k}"]`);if(dn)dn.disabled=S.n[k]<1;});
  const tot=S.n.th*1000+S.n.h*100+S.n.t*10+S.n.e;$("total").textContent="= "+tot.toLocaleString("sv-SE");
  $("undo").disabled=!hist.length;$("thBtn").setAttribute("aria-pressed",S.showTh||S.n.th>0);$("thBtn").disabled=S.n.th>0;
}
const say=(t,hot)=>{const m=$("msg");m.textContent=t;m.className="msg"+(hot?" hot":"");};
const snap=()=>{hist.push(JSON.stringify(S.n));if(hist.length>60)hist.shift();};
const newBlock=(k,x,y)=>{const el=document.createElement("div");el.className="blk pop";el.innerHTML=ART[k];
  el.style.transition="none";el.style.width=(k==="e"?1:k==="t"?1:10)*U+"px";el.style.height=(k==="e"?1:10)*U+"px";el.style.transform=`translate(${x}px,${y}px)`;
  stage.appendChild(el);void el.offsetWidth;el.style.transition="";return el;};
const boxPos=k=>{const b=board.querySelector(`[data-box="${k}"]`).getBoundingClientRect(),st=stage.getBoundingClientRect();return{x:b.left-st.left+b.width/2-U/2,y:b.top-st.top};};
const wait=ms=>new Promise(r=>setTimeout(r,matchMedia("(prefers-reduced-motion: reduce)").matches?0:ms));

/* ---------- Ta en kloss ur lådan ---------- */
function take(k){
  if(busy)return;
  if(!left(k)){const up=k!=="th";say(up?`Lådan med ${PL[k]} är tom! Växla 10 ${PL[k]} mot ${ONE[upOf(k)]}, så kommer de tillbaka till lådan.`:"Lådan med tusenkuber är tom. Högre än 9 999 går inte här.",true);
    const b=board.querySelector(`[data-up="${k}"]`);if(b){b.classList.remove("hot");void b.offsetWidth;b.classList.add("hot");}window.Ljud&&Ljud.bad&&Ljud.bad();return;}
  if(k==="th"&&S.n.th>=9){say("Högre än 9 999 går inte här.",true);return;}
  snap();const p=boxPos(k);S.n[k]++;blocks[k].push(newBlock(k,p.x,p.y));layout();refresh();window.Ljud&&Ljud.hop&&Ljud.hop();
  if(S.n[k]===10&&k!=="th")say(`Nu är det 10 ${PL[k]} och lådan är tom. Växla dem mot ${ONE[upOf(k)]}!`,true);
  else say(`${HEAD[k]}: ${S.n[k]}`);
}
/* ---------- Lägg tillbaka den kloss man tryckte närmast ---------- */
function putBack(k,e){
  if(busy||!blocks[k].length)return;
  const st=stage.getBoundingClientRect(),x=e.clientX-st.left,y=e.clientY-st.top;let best=-1,bd=1e9;
  blocks[k].forEach((el,i)=>{const r=el.getBoundingClientRect(),cx=r.left-st.left+r.width/2,cy=r.top-st.top+r.height/2,d=Math.hypot(cx-x,cy-y);if(d<bd){bd=d;best=i;}});
  snap();const el=blocks[k].splice(best,1)[0];S.n[k]--;const p=boxPos(k);el.style.transform=`translate(${p.x}px,${p.y}px)`;el.style.opacity="0";setTimeout(()=>el.remove(),380);
  layout();refresh();say(`${HEAD[k]}: ${S.n[k]}`);
}
/* ---------- Växla 10 uppåt: de tio glider ihop och blir en större kloss ---------- */
async function exchangeUp(k){
  if(busy||S.n[k]<10||k==="th")return;const u=upOf(k);
  if(u==="th"&&S.n.th>=9){say("Högre än 9 999 går inte här.",true);return;}
  busy=true;snap();
  if(u==="th"&&!S.showTh){S.showTh=true;buildBoard();layout();refresh();await wait(60);}
  const ten=blocks[k].splice(blocks[k].length-10,10);S.n[k]-=10;S.n[u]++;
  const cols=measure(),c0=ten[0].getBoundingClientRect(),st=stage.getBoundingClientRect(),gx=c0.left-st.left,gy=c0.top-st.top;
  /* först läggs de tio på rad, sedan flyger de till sin nya plats och blir en kloss */
  ten.forEach((el,i)=>{el.style.transform=k==="e"?`translate(${gx}px,${gy+i*U}px)`:k==="t"?`translate(${gx+i*U}px,${gy}px)`:`translate(${gx+i*U*.9}px,${gy+i*U*.9}px)`;});
  await wait(420);
  const nb=newBlock(u,gx,gy);nb.style.opacity="0";blocks[u].push(nb);
  ten.forEach(el=>{el.style.opacity="0";});await wait(10);nb.style.opacity="1";
  layout();setTimeout(()=>ten.forEach(el=>el.remove()),400);refresh();window.Ljud&&Ljud.whoosh&&Ljud.whoosh();
  say(`10 ${PL[k]} blev ${ONE[u]}. De tio gick tillbaka till lådan.`);busy=false;
}
/* ---------- Växla 1 nedåt: en kloss delas i tio mindre (från banken, går alltid) ---------- */
async function exchangeDown(k){
  if(busy||S.n[k]<1||k==="e")return;const d=downOf(k);busy=true;snap();
  const el=blocks[k].pop(),r=el.getBoundingClientRect(),st=stage.getBoundingClientRect(),x=r.left-st.left,y=r.top-st.top;S.n[k]--;S.n[d]+=10;
  el.style.opacity="0";setTimeout(()=>el.remove(),380);
  for(let i=0;i<10;i++){const s=k==="t"?{x,y:y+i*U}:k==="h"?{x:x+i*U,y}:{x:x+i*U*.9,y:y+i*U*.9};blocks[d].push(newBlock(d,s.x,s.y));}
  await wait(30);layout();refresh();window.Ljud&&Ljud.whoosh&&Ljud.whoosh();
  say(`${cap(ONE[k])} blev 10 ${PL[d]}.`);busy=false;
}
const cap=s=>s[0].toUpperCase()+s.slice(1);

/* ---------- Verktyg ---------- */
function setAll(n,anim){
  K.forEach(k=>{blocks[k].forEach(el=>el.remove());blocks[k]=[];S.n[k]=n[k];});
  buildBoard();const cols=measure();
  visible().forEach(k=>{for(let i=0;i<S.n[k];i++){const el=newBlock(k,0,0);blocks[k].push(el);}});
  layout();refresh();
}
$("undo").onclick=()=>{if(busy||!hist.length)return;setAll(JSON.parse(hist.pop()));say("Ångrat.");};
$("clear").onclick=()=>{if(busy)return;if(K.some(k=>S.n[k]))snap();setAll({th:0,h:0,t:0,e:0});say("Bordet är tomt. Tryck på en låda för att ta en kloss.");};
$("digits").onclick=()=>{S.hide=!S.hide;$("app").classList.toggle("hide-digits",S.hide);$("digits").setAttribute("aria-pressed",S.hide);$("digits").textContent=S.hide?"Visa siffror":"Dölj siffror";};
$("thBtn").onclick=()=>{if(S.n.th>0)return;S.showTh=!S.showTh;setAll({...S.n});};

/* ---------- Liggande läge: tips på stående mobil, går att stänga ---------- */
const isPhonePortrait=()=>matchMedia("(orientation: portrait) and (max-width: 600px)").matches;
let tipClosed=false;try{tipClosed=sessionStorage.getItem("mp-tiobas-tip")==="1";}catch(e){}
function checkRotate(){$("rotTip").hidden=tipClosed||!isPhonePortrait();}
$("rotX").onclick=()=>{tipClosed=true;try{sessionStorage.setItem("mp-tiobas-tip","1");}catch(e){}checkRotate();layout();};
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{checkRotate();layout();},120);});

checkRotate();buildBoard();layout();refresh();
</script>
</body>
</html>
