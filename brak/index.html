<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bråk – Matte-Portalen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF3FF; --ink:#1D2B53; --muted:#56668F; --card:#FFFFFF; --line:#C6D6F2;
  --good:#1E9E5E; --good-dark:#157548; --bad:#E5484D; --accent:#3D5AFE; --gold:#F2B707;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none !important}
.back{display:inline-block;color:var(--muted);font-weight:700;text-decoration:none;padding:6px 0;font-size:1rem}
h1{font-size:2.6rem;line-height:1;margin:14px 0 4px;font-weight:800}
h2{font-size:2rem;line-height:1.1;margin:10px 0 6px;font-weight:800}
.lead{margin:0 0 16px;color:var(--muted);font-size:1.1rem}
.stars{color:var(--gold);letter-spacing:1px}
.stars .off{color:#D5DDEC}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acard{background:var(--card);border-radius:18px;padding:10px 10px 8px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.acard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.acard .ico{width:70px;height:62px}
.acard .ico svg{width:100%;height:100%}
.acard b{font-size:1.1rem;line-height:1.15}
.acard small{color:var(--muted);font-size:.82rem;line-height:1.2}
.acard .ak{font-size:.72rem;font-weight:800;color:#fff;background:var(--c,#3D8BFD);border-radius:999px;padding:0 8px}
.note{color:var(--muted);font-size:.95rem;margin-top:18px}

.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.info{font-weight:800;font-size:1.2rem}
.progress{height:10px;border-radius:5px;background:var(--card);overflow:hidden;margin-top:6px;box-shadow:inset 0 0 0 2px var(--line)}
.progress i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.task{background:var(--card);border-radius:22px;padding:12px 14px 12px;box-shadow:0 5px 0 var(--line);margin:12px 0;transition:background .15s}
.task.ok{background:#DDF5E7}
.instr{display:flex;gap:10px;align-items:center;font-weight:700;font-size:1.15rem;line-height:1.3}
.spk{flex:none;width:46px;height:46px;border-radius:50%;background:var(--bg);font-size:1.4rem;box-shadow:0 3px 0 var(--line)}
.content{margin-top:10px;text-align:center}
.content>svg{width:min(70vw,260px);height:auto}
.content .cmpv svg{width:220px}
.feedback{min-height:1.4em;font-weight:800;font-size:1.1rem;margin-top:6px;text-align:center;color:var(--good)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opts button{background:var(--bg);border-radius:14px;padding:10px 6px;font-weight:800;font-size:1.2rem;box-shadow:0 3px 0 var(--line);min-height:58px}
.opts.emo button{font-size:2.3rem;min-height:70px}
.opts.pics button{padding:6px}
.opts.pics svg{width:56px;height:56px}
.opts button.bad{background:#FDE4E4;color:var(--bad)}
.opts button.right{background:#DDF5E7;color:var(--good-dark)}
.tapgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.tapit{background:var(--bg);border-radius:14px;aspect-ratio:1;display:grid;place-items:center;border:3px solid transparent;box-shadow:0 3px 0 var(--line)}
.tapit svg{width:88%;height:88%}
.tapit.sel{border-color:var(--accent);background:#EEF1FF}
.tapit.right{border-color:var(--good);background:#DDF5E7}
.tapit.bad{border-color:var(--bad);background:#FDE4E4}
.go{display:block;width:100%;margin-top:12px;padding:13px;border-radius:18px;background:var(--good);color:#fff;font-size:1.3rem;font-weight:800;box-shadow:0 5px 0 var(--good-dark)}
.row{display:flex;justify-content:center;align-items:center;gap:4px;flex-wrap:wrap;margin:6px 0}
.row svg{width:44px;height:44px}
.row .qm{width:44px;height:44px;border:3px dashed var(--accent);border-radius:10px;display:grid;place-items:center;font-weight:800;color:var(--accent);font-size:1.5rem}
.scene{display:grid;grid-template-columns:repeat(4,1fr);gap:0;max-width:340px;margin:0 auto;border-bottom:6px solid #C99A6B}
.scene div{font-size:2.6rem;height:64px;display:grid;place-items:center;border-top:6px solid #C99A6B;position:relative}
.scene div.hx{outline:4px solid #3D8BFD;outline-offset:-4px;border-radius:12px}
.scene div.ha{outline:4px solid #1E9E5E;outline-offset:-4px;border-radius:12px;background:#DDF5E7}
.mgrid{display:inline-grid;gap:2px;background:#C6D6F2;padding:2px;border-radius:8px;position:relative}
.mgrid i{width:min(9.5vw,40px);aspect-ratio:1;background:#fff;display:block}
.mgrid i.f{background:#3D8BFD}
.mgrid i.tap{cursor:pointer;background:#F5F8FF}
.mgrid i.tap.f{background:#FF9F43}
.mgrid i.miss{background:#FDE4E4;box-shadow:inset 0 0 0 3px #E5484D}
.mgrid i.extra{background:#E5484D}
.mgrid i.okc{background:#1E9E5E}
.mgrid .ml{position:absolute;top:-6px;bottom:-6px;width:4px;background:#E5484D;border-radius:2px}
.box1{display:inline-block;min-width:2.2em;font-size:2.4rem;font-weight:800;border-radius:12px;border:3px solid var(--accent);color:var(--accent);background:#EEF1FF;margin-top:8px;line-height:1.2}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:56px;border-radius:16px;background:var(--card);font-size:1.8rem;font-weight:800;box-shadow:0 4px 0 var(--line)}
.pad .okbtn{background:var(--good);color:#fff;box-shadow:0 4px 0 var(--good-dark);font-size:1.4rem}
.help{background:var(--card);border-radius:22px;padding:12px 14px 16px;box-shadow:0 5px 0 var(--line);text-align:center}
.help .said{color:var(--muted);margin:0 0 6px;font-weight:700}
.help .vis>svg{width:min(70vw,260px);height:auto}
.help .tapgrid{max-width:320px;margin:0 auto}
.help .tip{background:#FFF4CC;border-radius:12px;padding:8px 12px;margin:10px 0 0;font-size:1.05rem;text-align:left}
.result{text-align:center;padding-top:20px}
.rbig{font-size:clamp(3.2rem,16vw,4.6rem);font-weight:800;line-height:1;margin:6px 0}
.rsub{color:var(--muted);font-size:1.15rem;margin:0 0 14px}
.big{display:block;width:100%;padding:12px 16px;border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:1.2rem;margin-top:12px}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.02;vertical-align:middle;font-weight:800}
.fr>span:first-child{border-bottom:.08em solid currentColor;padding:0 .12em}
.opts.frs button{font-size:1.6rem;padding:4px}
.big-fr{font-size:2.6rem;margin-top:4px}
.topfr{font-size:2.8rem;margin:0 0 4px}
.part{cursor:pointer}
.things{font-size:1.9rem;line-height:1.35;max-width:340px;margin:0 auto;letter-spacing:2px}
.groups{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:1.5rem}
.groups .grp{border:3px dashed #C6D6F2;border-radius:14px;padding:2px 6px;letter-spacing:1px}
.groups .grp.on{border:3px solid #1E9E5E;background:#DDF5E7}
.cmp{display:flex;justify-content:center;gap:40px;font-size:3.4rem}
.cmpv{display:flex;flex-direction:column;gap:6px}
.cmpv>div{display:flex;align-items:center;gap:10px;font-size:1.8rem}
.cmpv svg{width:220px;height:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:6;max-width:90vw;text-align:center}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:7}
/* Elevens djur vid frågan */
.instr .hpet{margin-left:auto;flex:none;width:50px}
.pet svg{width:100%;height:auto;display:block;transform-origin:50% 90%}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-22px) rotate(-4deg)}70%{transform:translateY(0) rotate(3deg)}}
@keyframes hmm{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(-9deg)}}
.pet.hop svg{animation:hop .55s ease-out 2}
.pet.hmm svg{animation:hmm .9s ease-in-out}
@media (prefers-reduced-motion:reduce){.pet svg{animation:none !important}}
/* Maten och skärandet */
.content>svg.roll,.help .vis>svg.roll{width:100%;max-width:380px}
.cutsvg{touch-action:none;overflow:visible}
.pzcut{cursor:none}
.pv{pointer-events:none}
.content .things{min-height:2.9rem;border:2px dashed #C6D6F2;border-radius:16px;padding:2px 6px}
.things .tok{display:inline-block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:0 1px}
.plate .tok{font-size:1.05rem;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.tok.lift{opacity:.3}
.tok.ghost{position:fixed;z-index:9;pointer-events:none;font-size:2.2rem;transform:translate(-50%,-60%)}
.cap{font-weight:800;color:var(--muted);font-size:1rem;margin-top:4px}
.dealtip{color:var(--muted);font-size:.95rem;margin-top:8px}
.reset{color:var(--accent);font-weight:800;text-decoration:underline;padding:4px 6px}
.content>svg.pzcut{width:min(80vw,290px)}
.cmpv svg{width:120px !important}
.plates{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}
.plate{width:86px;height:86px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 7px #E6ECF7,0 3px 0 #C6D6F2;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;font-size:1.05rem;line-height:1.15;padding:13px}
.plate.on{box-shadow:inset 0 0 0 7px #9BE0B8,0 3px 0 #1E9E5E}
</style>
</head>
<body>
<div class="wrap">
<section id="home" class="screen">
  <a class="back" href="../">← Till huvudmenyn</a>
  <h1>Bråk</h1>
  <p class="lead">Pizza, chokladkaka och rulltårta. Dela, skär och jämför.</p>
  <div class="areas" id="areas"></div>
  <p class="note">Tre stjärnor får du om alla tio uppgifter blir rätt direkt.</p>
</section>
<section id="game" class="screen" hidden>
  <div class="gtop"><button class="back" id="quit">← Avsluta</button><span class="info" id="info"></span></div>
  <div class="progress"><i id="prog"></i></div>
  <div class="task" id="task">
    <div class="instr"><button class="spk" id="spk" aria-label="Läs upp">🔊</button><span id="instr"></span><span class="hpet pet" id="hpet" aria-hidden="true"></span></div>
    <div class="content" id="content"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </div>
  <div class="pad" id="pad" hidden>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="del" aria-label="Sudda">⌫</button><button data-k="0">0</button><button data-k="ok" class="okbtn">OK</button>
  </div>
  <div class="help" id="help" hidden>
    <p class="said" id="helpSaid"></p>
    <div class="vis" id="helpVis"></div>
    <p class="tip" id="helpTip"></p>
    <button class="go" id="helpGo">Fortsätt</button>
  </div>
</section>
<section id="result" class="screen result" hidden>
  <h2 id="rTitle"></h2>
  <div class="rbig" id="rBig"></div>
  <p class="rsub" id="rSub"></p>
  <button class="go" id="rAgain">Spela igen</button>
  <button class="big" id="rHome">Välj något annat</button>
</section>
</div>
<div class="toast" id="toast" hidden></div>
<canvas id="fx" hidden></canvas>
<script src="../ljud.js"></script>
<script src="../djur.js"></script>
<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const cap=s=>s[0].toUpperCase()+s.slice(1);
const KEY="mattespel-brak-v1";
const data=(()=>{try{return Object.assign({stars:{}},JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return{stars:{}}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const COLS=["#3D8BFD","#FF6B6B","#2BB673","#FF9F43","#7B61FF","#FF5FA2","#17AFC4","#F7C531"];

/* ---------- Bråk: namn och bilder ---------- */
const ORD={2:["halv","halvor"],3:["tredjedel","tredjedelar"],4:["fjärdedel","fjärdedelar"],5:["femtedel","femtedelar"],6:["sjättedel","sjättedelar"],8:["åttondel","åttondelar"],10:["tiondel","tiondelar"]};
const TAL=["noll","en","två","tre","fyra","fem","sex","sju","åtta","nio","tio"];
const ordOf=(k,n)=>k===1?(n===2?"en halv":`en ${ORD[n][0]}`):`${TAL[k]} ${ORD[n][1]}`;
const fr=(k,n)=>`<span class="fr"><span>${k}</span><span>${n}</span></span>`;
const svg=(inner,vb="0 0 100 100")=>`<svg viewBox="${vb}" aria-hidden="true">${inner}</svg>`;
const ST=`stroke="#1D2B53" stroke-width="2.5" stroke-linejoin="round"`;
function sectorPath(i,n,cx=50,cy=50,r=42,from=null,to=null){
  const a0=(from!=null?from:i/n)*2*Math.PI-Math.PI/2,a1=(to!=null?to:(i+1)/n)*2*Math.PI-Math.PI/2;
  if((n===1&&from==null)||(from!=null&&to-from>=1))return`M${cx-r} ${cy}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0`;
  const large=a1-a0>Math.PI?1:0;
  return`M${cx} ${cy}L${cx+r*Math.cos(a0)} ${cy+r*Math.sin(a0)}A${r} ${r} 0 ${large} 1 ${cx+r*Math.cos(a1)} ${cy+r*Math.sin(a1)}Z`;
}
// Delar: lista med [start,slut] mellan 0 och 1
const equalCuts=n=>Array.from({length:n},(_,i)=>[i/n,(i+1)/n]);
function unequalCuts(n){let pts=[0];for(let i=1;i<n;i++){let p=i/n+(Math.random()<.5?-1:1)*(.08+Math.random()*.1)/n*2.2;pts.push(p);}pts.push(1);pts=pts.sort((a,b)=>a-b);
  return pts.slice(0,-1).map((p,i)=>[p,pts[i+1]]);}
const pickN=list=>pickOne(list);
const randSet=(n,k)=>new Set(shuffle([...Array(n).keys()]).slice(0,k));
function fracOptions(k,n){
  const c=new Set([`${k}/${n}`]);const cand=[`${n-k}/${n}`,`${k}/${n+1}`,`${k+1}/${n}`,`${Math.max(1,k-1)}/${n}`,`${k}/${Math.max(2,n-1)}`,`1/${n}`];
  shuffle(cand).forEach(x=>{const[a,b]=x.split("/").map(Number);if(c.size<4&&a>0&&b>0&&a<b&&!c.has(x))c.add(x);});
  let g=0;while(c.size<4&&g++<50){const b=pickOne([2,3,4,5,6,8,10]),a=rnd(1,b-1);c.add(`${a}/${b}`);}
  return shuffle([...c]);
}
const frLabel=s=>{const[a,b]=s.split("/");return fr(a,b);};

/* ---------- Maten: pizza, chokladkaka och rulltårta, ritade i kod ----------
   Varje bit har ett läge: "on" (finns kvar), "eaten" (uppäten, bara smulor) eller "out" (utdragen mot djuret). */
let clipN=0;
const PEPP=[[50,20],[29,33],[71,33],[50,42],[24,55],[76,55],[38,63],[62,63],[50,79],[31,76],[69,76]];
const PIZZA=`<circle cx="50" cy="50" r="44" fill="#E3A857"/><circle cx="50" cy="50" r="38.5" fill="#E5484D"/><circle cx="50" cy="50" r="36" fill="#FFD66B"/>`+
  PEPP.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5.2" fill="#C2343B"/><circle cx="${x-1.6}" cy="${y-1.6}" r="1.1" fill="#E8777C"/>`).join("")+
  [[40,28],[60,52],[36,46],[56,86]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="3.4" ry="1.8" fill="#2BB673" transform="rotate(35 ${x} ${y})"/>`).join("");
const crumbs=(x,y,c)=>`<circle cx="${x}" cy="${y}" r="1.5" fill="${c}"/><circle cx="${x+4}" cy="${y+3}" r="1.1" fill="${c}"/><circle cx="${x-3}" cy="${y+4}" r="1" fill="${c}"/>`;
const EATEN=`fill="#F6EEE2" stroke="#C9B79C" stroke-width="1.5" stroke-dasharray="3 3"`;
function pizzaSVG(cuts,st,o={}){
  const id0=++clipN;let h=`<svg viewBox="-9 -9 118 118" aria-hidden="true"${o.cls?` class="${o.cls}"`:""}><circle cx="50" cy="50" r="50" fill="#fff" stroke="#C6D6F2" stroke-width="2"/>`;
  cuts.forEach(([a,b],i)=>{const s=st(i),d=sectorPath(0,0,50,50,44,a,b),m=((a+b)/2)*2*Math.PI-Math.PI/2,cx=50+26*Math.cos(m),cy=50+26*Math.sin(m),tap=o.tap?` data-p="${i}" class="part"`:"";
    if(s==="eaten")h+=`<g${tap}><path d="${d}" ${EATEN}/>${crumbs(cx-2,cy-2,"#E3A857")}</g>`;
    else{const tr=s==="out"?` transform="translate(${(9*Math.cos(m)).toFixed(1)} ${(9*Math.sin(m)).toFixed(1)})"`:"",id=`pz${id0}_${i}`;
      h+=`<g${tap}${tr}><clipPath id="${id}"><path d="${d}"/></clipPath><g clip-path="url(#${id})">${PIZZA}</g><path d="${d}" fill="none" ${ST}/></g>`;}});
  if(o.num)cuts.forEach(([a,b],i)=>{const m=((a+b)/2)*2*Math.PI-Math.PI/2,x=50+27*Math.cos(m),y=50+27*Math.sin(m);
    h+=`<circle cx="${x}" cy="${y}" r="7" fill="#fff" stroke="#1D2B53" stroke-width="1.5"/><text x="${x}" y="${y+3.6}" text-anchor="middle" font-size="10" font-weight="800" fill="#1D2B53">${i+1}</text>`;});
  return h+(o.extra||"")+"</svg>";
}
function chocSVG(cuts,st,o={}){
  let h=`<svg viewBox="0 14 100 66" aria-hidden="true"${o.cls?` class="${o.cls}"`:""}>`;
  cuts.forEach(([a,b],i)=>{const s=st(i),x=4+a*92,w=(b-a)*92,tap=o.tap?` data-p="${i}" class="part"`:"";
    if(s==="eaten")h+=`<g${tap}><rect x="${x}" y="32" width="${w}" height="40" ${EATEN}/>${crumbs(x+w/2-2,50,"#7A4A2B")}</g>`;
    else h+=`<g${tap}${s==="out"?' transform="translate(0 -12)"':""}><rect x="${x}" y="32" width="${w}" height="40" rx="1.5" fill="#7A4A2B" ${ST}/><rect x="${x+3}" y="35.5" width="${Math.max(1,w-6)}" height="33" rx="2" fill="#93603E"/><path d="M${x+3.5} 66 V36 H${x+w-3.5}" stroke="#B07A55" stroke-width="1.6" fill="none"/></g>`;});
  if(o.num)cuts.forEach(([a,b],i)=>{const x=4+(a+b)/2*92;h+=`<circle cx="${x}" cy="52" r="6.5" fill="#fff" stroke="#1D2B53" stroke-width="1.5"/><text x="${x}" y="55.5" text-anchor="middle" font-size="9.5" font-weight="800" fill="#1D2B53">${i+1}</text>`;});
  return h+"</svg>";
}
/* Rulltårta från sidan, från x=10 till x=190 (samma längd som tallinjen 0–1). cuts = snitt som tal mellan 0 och 1. */
const RX=f=>10+f*180;
function rollEl(cuts,y,o={}){
  const r=16,cy=y+r;
  let h=`<rect x="10" y="${y}" width="180" height="32" rx="5" fill="#F7D58B"/><rect x="12" y="${y+24}" width="176" height="7" rx="3" fill="#E9BE6A"/><rect x="10" y="${y}" width="180" height="32" rx="5" fill="none" ${ST}/>`+
    Array.from({length:17},(_,i)=>`<circle cx="${22+i*10.1+(i%2)*3}" cy="${y+5+(i%3)*2.2}" r="1.3" fill="#fff" opacity=".95"/>`).join("")+
    /* änden: sockerkaka runt, grädde och sylt i ringar */
    `<ellipse cx="10" cy="${cy}" rx="8.5" ry="${r}" fill="#F7D58B" ${ST}/><ellipse cx="10" cy="${cy}" rx="6.4" ry="${r-3}" fill="#FFF6E0"/>`+
    `<ellipse cx="10" cy="${cy}" rx="4.4" ry="${(r-3)*.66}" fill="none" stroke="#E5484D" stroke-width="2"/><ellipse cx="10" cy="${cy}" rx="2.2" ry="${(r-3)*.32}" fill="none" stroke="#E5484D" stroke-width="2"/>`;
  cuts.forEach(f=>{const x=RX(f);h+=`<line x1="${x}" y1="${y-3}" x2="${x}" y2="${y+35}" stroke="#fff" stroke-width="5"/><line x1="${x-2.6}" y1="${y}" x2="${x-2.6}" y2="${y+32}" stroke="#1D2B53" stroke-width="1.6"/><line x1="${x+2.6}" y1="${y}" x2="${x+2.6}" y2="${y+32}" stroke="#1D2B53" stroke-width="1.6"/>`;});
  if(o.ideal)for(let j=1;j<o.ideal;j++){const x=RX(j/o.ideal);h+=`<line x1="${x}" y1="${y-8}" x2="${x}" y2="${y+40}" stroke="#1E9E5E" stroke-width="3" stroke-dasharray="5 3"/>`;}

const rollSVG=(cuts,o={})=>`<svg viewBox="0 0 200 54" class="roll${o.cls?" "+o.cls:""}" aria-hidden="true">${rollEl(cuts,12,o)}</svg>`;
/* Slumpar mat för cirkel- eller stapelbilder */
const food=()=>Math.random()<.55?{D:pizzaSVG,name:"pizzan",kind:"pizza"}:{D:chocSVG,name:"chokladkakan",kind:"choklad"};

/* ---------- Elevens djur (från ../djur.js) ---------- */
const pet=lasDjur(),petName=PETNAME[pet.animal]||"Ugglan",lc=petName.toLowerCase();

/* ---------- 1. Halva, tredjedel, fjärdedel: en bit dras ut till djuret ---------- */
function genEnhet(){
  const n=pickN([2,2,3,3,4,4,5,6,8]),F=food(),cuts=equalCuts(n),p=rnd(0,n-1),st=i=>i===p?"out":"on";
  const words=shuffle([...new Set([ordOf(1,n),...shuffle([2,3,4,5,6,8].filter(x=>x!==n)).slice(0,3).map(x=>ordOf(1,x))])]);
  return{kind:"opts",instr:`Hur stor bit av ${F.name} får ${lc}?`,speak:`${petName} får den utdragna biten. Hur stor bit av ${F.name} är det?`,html:F.D(cuts,st),options:words.map(cap),answer:cap(ordOf(1,n)),
    help:()=>({vis:F.D(cuts,st,{num:true}),tip:`${cap(F.name)} är delad i ${n} lika stora bitar. ${petName} får en av dem. Då heter biten ${ordOf(1,n)}, och skrivs 1/${n}.`})};
}
/* ---------- 2. Hur stor del är kvar? (k/n) ---------- */
function genDel(){
  const n=pickN([3,4,4,5,6,8,10]),k=rnd(1,n-1),F=food(),cuts=equalCuts(n),f=randSet(n,k),st=i=>f.has(i)?"on":"eaten",opts=fracOptions(k,n);
  return{kind:"opts",fr:true,instr:`Hur stor del av ${F.name} är kvar?`,speak:`${petName} har ätit lite. Hur stor del av ${F.name} är kvar? Vilket bråk är det?`,html:F.D(cuts,st),options:opts,labels:opts.map(frLabel),answer:`${k}/${n}`,
    help:()=>({vis:F.D(cuts,st,{num:true})+`<div class="big-fr">${fr(k,n)}</div>`,tip:`Räkna alla bitar, även de uppätna: ${n}. Det talet skrivs under strecket (nämnaren). Räkna bitarna som är kvar: ${k}. Det talet skrivs över strecket (täljaren). Alltså ${k}/${n}, ${ordOf(k,n)}.`})};
}
/* ---------- 3. Ät rätt del: eleven trycker på bitarna som djuret ska äta ---------- */
function genFarg(){
  const n=pickN([2,3,4,4,5,6,8]),k=n===2?1:rnd(1,n-1),F=food(),cuts=equalCuts(n);
  return{kind:"color",instr:`Hjälp ${lc} att äta ${ordOf(k,n)} av ${F.name}.`,speak:`${petName} vill äta ${ordOf(k,n)} av ${F.name}. Tryck på bitarna som ${lc} ska äta. Tryck sedan på Klar.`,
    topFr:fr(k,n),draw:(sel)=>F.D(cuts,i=>sel.has(i)?"eaten":"on",{tap:true}),need:k,n,
    help:()=>({vis:F.D(cuts,i=>i<k?"eaten":"on",{num:true}),tip:`${cap(F.name)} har ${n} lika stora bitar. ${cap(ordOf(k,n))} betyder att ${k} av de ${n} bitarna ska ätas. Vilka bitar spelar ingen roll.`})};
}
/* ---------- 4. Lika stora delar: rättvist? och skär själv ---------- */
function genRattvist(){
  const n=pickN([2,3,4,4,6]),eq=Math.random()<.5,F=food(),cuts=eq?equalCuts(n):unequalCuts(n),st=()=>"on",ord=n===2?"halvor":ORD[n][1];
  return{kind:"opts",instr:`Är ${F.name} delad i ${ord}?`,speak:`${petName} ska dela ${F.name} med sina kompisar. Är ${F.name} delad i ${ord}? Är alla bitar lika stora?`,html:F.D(cuts,st),options:["Ja","Nej"],answer:eq?"Ja":"Nej",
    help:()=>({vis:F.D(cuts,st)+(eq?"":F.D(equalCuts(n),st)),tip:eq?`Ja! Alla ${n} bitar är lika stora. Då är varje bit ${ordOf(1,n)}. Det blir rättvist.`:`Nej. Bitarna är inte lika stora, så det blir inte rättvist. ${cap(ord)} måste vara exakt lika stora, som i den nedre bilden.`})};
}
/* Skär rulltårtan: eleven trycker där kniven ska skära. Ett snitt räknas som rätt om det är nära rätt ställe. */
/* Bitarna dragna lite isär, så att eleven ser hur lika de blev */
function rollSpread(cuts){
  const p=[0,...[...cuts].sort((a,b)=>a-b),1],k=p.length-1,gap=7,use=180-gap*(k-1);let x=10,h="";
  for(let i=0;i<k;i++){const w=(p[i+1]-p[i])*use;
    h+=`<rect x="${x}" y="12" width="${w}" height="32" rx="4" fill="#F7D58B"/><rect x="${x+1.5}" y="36" width="${Math.max(0,w-3)}" height="7" rx="3" fill="#E9BE6A"/><rect x="${x}" y="12" width="${w}" height="32" rx="4" fill="none" ${ST}/>`;
    if(i===0)h+=`<ellipse cx="10" cy="28" rx="8.5" ry="16" fill="#F7D58B" ${ST}/><ellipse cx="10" cy="28" rx="6.4" ry="13" fill="#FFF6E0"/><ellipse cx="10" cy="28" rx="4.4" ry="8.6" fill="none" stroke="#E5484D" stroke-width="2"/><ellipse cx="10" cy="28" rx="2.2" ry="4.2" fill="none" stroke="#E5484D" stroke-width="2"/>`;
    x+=w+gap;}
  return`<svg viewBox="0 0 200 54" class="roll" aria-hidden="true">${h}</svg>`;
}
function genSkarRulle(){
  const n=pickN([2,3,3,4,4,5,6]);
  /* Felmarginal: varje bit får vara högst 15 % för lång eller kort, men aldrig snävare än 3,5 % av hela tårtan (ungefär ett halvt finger på mobil). */
  const TOL=Math.max(.15/n,.035);
  const check=cuts=>{const s=[0,...[...cuts].sort((a,b)=>a-b),1];if(s.length-1!==n)return`${s.length-1} ${s.length===2?"bit":"bitar"}`;
    return s.slice(1).every((f,j)=>Math.abs(f-s[j]-1/n)<=TOL)?true:"olika stora bitar";};
  return{kind:"cut",instr:`Skär rulltårtan i ${n} lika stora bitar.`,speak:`Skär rulltårtan i ${TAL[n]} lika stora bitar, så att det blir rättvist. Tryck på rulltårtan där kniven ska skära. Trycker du på ett snitt igen försvinner det. Tryck sedan på Klar.`,
    draw:cuts=>rollSVG(cuts,{cls:"cutsvg"}),
    preview:(cuts,x)=>{const f=(x-10)/180;if(f<.03||f>.97)return"";const rem=cuts.some(c=>Math.abs(c-f)<.045);
      return`<line x1="${RX(f)}" y1="4" x2="${RX(f)}" y2="52" stroke="${rem?"#E5484D":"#1D2B53"}" stroke-width="1.8" stroke-dasharray="4 3"/>`;},
    tap:(cuts,x)=>{const f=(x-10)/180;if(f<.03||f>.97)return false;const i=cuts.findIndex(c=>Math.abs(c-f)<.045);if(i>=0)cuts.splice(i,1);else cuts.push(f);return true;},
    check,spread:rollSpread,
    help:cuts=>({vis:((cuts||[]).length?`<div class="cap">Dina bitar</div>${rollSpread(cuts)}<div class="cap">Så här ska den skäras</div>`:"")+rollSVG(cuts||[],{ideal:n}),tip:(cuts||[]).length!==n-1?`För ${n} bitar behöver du ${n-1} ${n-1===1?"snitt":"snitt"}. De gröna strecken visar var du ska skära.`:`Bitarna ska vara lika långa. De gröna strecken visar var du ska skära. Dina snitt är de vita.`})};
}
/* Pizzaskäraren: hjulet i (0,0), handtaget åt höger. Ritad i kod. */
const CUTTER=`<g class="cutter"><ellipse cx="2" cy="13" rx="12" ry="3" fill="rgba(0,0,0,.15)"/><rect x="6" y="-2.6" width="18" height="5.2" rx="2" fill="#AEB9CC" stroke="#1D2B53" stroke-width="1.2"/>
  <rect x="22" y="-5" width="28" height="10" rx="5" fill="#E5484D" stroke="#1D2B53" stroke-width="1.5"/><path d="M27 -2.2 H44" stroke="#FF8A8E" stroke-width="1.6" stroke-linecap="round"/>
  <circle r="11" fill="#E3E8F2" stroke="#1D2B53" stroke-width="1.8"/><path d="M-7 -4 A8 8 0 0 1 2 -8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle r="2.8" fill="#56668F" stroke="#1D2B53" stroke-width="1"/></g>`;
const snapA=(dx,dy)=>Math.round(((Math.atan2(dy,dx)*180/Math.PI)+360)%180/15)*15%180;
/* Skär pizzan: varje tryck blir ett rakt snitt genom mitten, åt det håll man tryckte (närmaste 15°). */
function genSkarPizza(){
  const n=pickN([2,4,4,6,8]),m=n/2;
  const lines=(cuts,col,w,dash)=>cuts.map(a=>{const r=a*Math.PI/180,dx=47*Math.cos(r),dy=47*Math.sin(r);return`<line x1="${50-dx}" y1="${50-dy}" x2="${50+dx}" y2="${50+dy}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"${dash?` stroke-dasharray="${dash}"`:""}/>`;}).join("");
  const pic=(cuts,o={})=>pizzaSVG([[0,1]],()=>"on",{cls:o.cls,extra:lines(cuts,"#1D2B53",5.5)+lines(cuts,"#FFF6E0",2.5)+(o.ideal?lines(Array.from({length:m},(_,i)=>i*180/m+(o.rot||0)),"#1E9E5E",2.5,"5 3"):"")});
  const check=cuts=>{if(cuts.length!==m)return`${cuts.length?cuts.length*2:1} ${cuts.length?"bitar":"bit"}`;const s=[...cuts].sort((a,b)=>a-b);return s.every((a,i)=>i===0||a-s[i-1]===180/m)?true:"olika stora bitar";};
  return{kind:"cut",instr:`Skär pizzan i ${n} lika stora bitar.`,speak:`Skär pizzan i ${TAL[n]} lika stora bitar. Tryck på pizzan där du vill skära. Kniven skär rakt igenom mitten. Trycker du på ett snitt igen försvinner det. Tryck sedan på Klar.`,
    draw:cuts=>pic(cuts,{cls:"cutsvg pzcut"}),
    /* Förhandsvisning: pizzaskäraren står på linjen där snittet hamnar, med handtaget utåt. Röd linje = snittet tas bort. */
    preview:(cuts,x,y)=>{const dx=x-50,dy=y-50,d=Math.hypot(dx,dy);if(d<7||d>54)return"";const a=snapA(dx,dy),r=a*Math.PI/180,out=Math.cos(Math.atan2(dy,dx)-r)>=0?1:-1;
      const rr=Math.min(Math.max(d,16),44)*out,rem=cuts.includes(a);
      return lines([a],rem?"#E5484D":"#1D2B53",1.8,"4 3")+`<g transform="translate(${(50+rr*Math.cos(r)).toFixed(1)} ${(50+rr*Math.sin(r)).toFixed(1)}) rotate(${a+(out<0?180:0)})">${CUTTER}</g>`;},
    tap:(cuts,x,y)=>{const dx=x-50,dy=y-50,d=Math.hypot(dx,dy);if(d<7||d>54)return false;const a=snapA(dx,dy);
      const i=cuts.indexOf(a);if(i>=0)cuts.splice(i,1);else cuts.push(a);return true;},
    check,
    help:cuts=>({vis:pic(cuts||[],{ideal:true,rot:(cuts&&cuts.length?Math.min(...cuts):0)}),tip:(cuts||[]).length!==m?`Varje snitt rakt genom mitten ger två bitar. För ${n} bitar behövs ${m} ${m===1?"snitt":"snitt"}. De gröna strecken visar hur.`:"Bitarna ska vara lika stora. Snitten ska ha lika stora mellanrum, som de gröna strecken."})};
}
const genLika=()=>{const r=Math.random();return r<.4?genRattvist():r<.7?genSkarPizza():genSkarRulle();};
/* ---------- 5. Del av antal: dela lika på tallrikar ---------- */
const THINGS=["🍓","🍎","🧁","🍪","🍒","🥕","🍋","🍩"];
const platesHTML=(e,d,each,hl)=>`<div class="plates">${Array.from({length:d},(_,g)=>`<span class="plate${hl&&g<hl?" on":""}">${e.repeat(each)}</span>`).join("")}</div>`;
/* Prova att dela: dra en sak till en tallrik, eller tryck så hamnar den på tallriken som har minst. Tryck på en sak på en tallrik så går den tillbaka. */
function mountDeal(c){
  const pool=c.querySelector(".things"),plates=[...c.querySelectorAll(".plate")];
  const nextPlate=()=>plates.reduce((a,p)=>p.children.length<a.children.length?p:a,plates[0]);
  c.querySelectorAll(".tok").forEach(tok=>tok.addEventListener("pointerdown",e=>{
    if(G.busy)return;e.preventDefault();const sx=e.clientX,sy=e.clientY;let ghost=null;
    const move=ev=>{if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){ghost=tok.cloneNode(true);ghost.className="tok ghost";document.body.appendChild(ghost);tok.classList.add("lift");}
      if(ghost){ghost.style.left=ev.clientX+"px";ghost.style.top=ev.clientY+"px";}};
    const up=ev=>{removeEventListener("pointermove",move);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);
      if(ghost){ghost.remove();tok.classList.remove("lift");const el=document.elementFromPoint(ev.clientX,ev.clientY),pl=el&&el.closest(".plate");
        if(pl&&plates.includes(pl))pl.appendChild(tok);else if(el&&el.closest(".things"))pool.appendChild(tok);}
      else(tok.parentElement===pool?nextPlate():pool).appendChild(tok);
      window.Ljud&&Ljud.hop&&Ljud.hop();};
    addEventListener("pointermove",move);addEventListener("pointerup",up);addEventListener("pointercancel",up);}));
  c.querySelector("#reset").onclick=()=>c.querySelectorAll(".plate .tok").forEach(t=>pool.appendChild(t));
}
function genAntal(){
  const d=pickN([2,2,3,4,5]),each=rnd(2,d===2?8:5),n=d*each,k=d>2&&Math.random()<.35?rnd(2,d-1):1,e=pickOne(THINGS),ans=k*each;
  const what=k===1&&d===2?"hälften":ordOf(k,d);
  return{kind:"keys",instr:`Hur många är ${what} av ${n}?`,speak:`${petName} har ${n} saker till picknicken. De ska delas lika på ${TAL[d]} tallrikar. Hur många är ${what} av ${n}?`,
    html:`<div class="things">${Array.from({length:n},()=>`<span class="tok">${e}</span>`).join("")}</div>`+platesHTML("",d,0)+
      `<div class="dealtip">Osäker? Dra eller tryck för att dela ut. <button class="reset" id="reset">Börja om</button></div>`,answer:ans,mount:mountDeal,
    help:()=>({vis:platesHTML(e,d,each,k),tip:`Dela ${n} lika på ${d} tallrikar. Det blir ${each} på varje, eftersom ${d} · ${each} = ${n}.${k>1?` ${cap(what)} är ${k} tallrikar: ${k} · ${each} = ${ans}.`:` ${cap(what)} är en tallrik: ${ans}.`}`})};
}
/* ---------- 6. Jämför: hjälpen visar två lika stora pizzor ---------- */
function genJamfor(){
  let a,b,t=Math.random();
  if(t<.45){const n1=pickN([2,3,4,5,6,8]);let n2;do{n2=pickN([2,3,4,5,6,8]);}while(n2===n1);a=[1,n1];b=[1,n2];}
  else if(t<.85){const n=pickN([4,5,6,8,10]);let k1=rnd(1,n-1),k2;do{k2=rnd(1,n-1);}while(k2===k1);a=[k1,n];b=[k2,n];}
  else{const p=pickOne([[[1,2],[2,4]],[[1,2],[3,6]],[[1,2],[4,8]],[[1,3],[2,6]],[[1,4],[2,8]]]);[a,b]=Math.random()<.5?p:[p[1],p[0]];}
  const va=a[0]/a[1],vb=b[0]/b[1],ans=Math.abs(va-vb)<1e-9?"lika":va>vb?`${a[0]}/${a[1]}`:`${b[0]}/${b[1]}`;
  const pic=f=>pizzaSVG(equalCuts(f[1]),i=>i<f[0]?"on":"eaten");
  const opts=[`${a[0]}/${a[1]}`,`${b[0]}/${b[1]}`,"lika"];
  return{kind:"opts",fr:true,instr:"Vilket bråk är störst?",speak:`${petName} är hungrig och vill ha mest pizza. Vilket bråk är störst? Eller är de lika stora?`,html:`<div class="cmp"><div>${fr(a[0],a[1])}</div><div>${fr(b[0],b[1])}</div></div>`,
    options:opts,labels:opts.map(o=>o==="lika"?"Lika stora":frLabel(o)),answer:ans,
    help:()=>({vis:`<div class="cmpv"><div>${fr(a[0],a[1])}${pic(a)}</div><div>${fr(b[0],b[1])}${pic(b)}</div></div>`,
      tip:a[1]===b[1]&&a[0]!==b[0]?`Bitarna är lika stora eftersom båda pizzorna är delade i ${a[1]}. Då är det bråket med flest bitar som är störst.`:ans==="lika"?"Titta på pizzorna: det är lika mycket pizza kvar. Bråken är olika skrivna men lika stora.":"Titta på pizzorna. Ju fler bitar en pizza delas i, desto mindre blir varje bit. Den pizza där mest finns kvar är störst."})};
}
/* ---------- 7. Bråk på tallinjen: rulltårtan är lika lång som sträckan 0–1 ---------- */
function genLinje(){
  const n=pickN([2,3,4,5,6,8,10]),k=rnd(1,n-1),x=v=>RX(v);
  let s=rollEl([k/n],4)+`<line x1="10" y1="56" x2="190" y2="56" stroke="#1D2B53" stroke-width="3"/>`;
  for(let i=0;i<=n;i++)s+=`<line x1="${x(i/n)}" y1="${i%n?49:45}" x2="${x(i/n)}" y2="${i%n?63:67}" stroke="#1D2B53" stroke-width="${i%n?2:3}"/>`;
  s+=`<text x="10" y="84" text-anchor="middle" font-size="14" font-weight="800" fill="#1D2B53">0</text><text x="190" y="84" text-anchor="middle" font-size="14" font-weight="800" fill="#1D2B53">1</text>`;
  const mark=`<line x1="${x(k/n)}" y1="38" x2="${x(k/n)}" y2="54" stroke="#E5484D" stroke-width="3" stroke-dasharray="4 2"/><circle cx="${x(k/n)}" cy="56" r="5" fill="#E5484D"/>`;
  const opts=fracOptions(k,n),VB="0 0 200 90";
  const hops=Array.from({length:k},(_,i)=>`<path d="M${x(i/n)} 54 Q${x((i+.5)/n)} 40 ${x((i+1)/n)} 54" fill="none" stroke="#FF9F43" stroke-width="3"/>`).join("");
  return{kind:"opts",fr:true,instr:"Var är rulltårtan skuren? Vilket bråk?",speak:`${petName} har skurit rulltårtan. Rulltårtan är lika lång som sträckan från noll till ett. Vilket bråk på tallinjen visar den röda pricken?`,
    html:`<svg viewBox="${VB}" class="roll" aria-hidden="true">${s+mark}</svg>`,options:opts,labels:opts.map(frLabel),answer:`${k}/${n}`,
    help:()=>({vis:`<svg viewBox="${VB}" class="roll" aria-hidden="true">${s+hops+mark}</svg>`,tip:`Sträckan från 0 till 1 är delad i ${n} lika stora delar. Snittet står ${k} steg från 0, se de orange hoppen. Alltså ${k}/${n}.`})};
}

  {id:"linje",name:"Bråk på tallinjen",desc:"Rulltårtan på tallinjen.",ak:"Åk 3",c:"#17AFC4",gen:genLinje}
];
const starHtml=n=>`<span class="stars">${[1,2,3].map(i=>i<=n?"★":'<span class="off">★</span>').join("")}</span>`;
function show(id){document.querySelectorAll(".screen").forEach(s=>s.hidden=s.id!==id);window.scrollTo(0,0);}
$("hpet").innerHTML=owlSVG(pet);
function openHome(){G=null;if("speechSynthesis" in window)speechSynthesis.cancel();
  $("areas").innerHTML=AREAS.map(a=>`<button class="acard" data-a="${a.id}" style="--c:${a.c}"><span class="ico">${ICON[a.id]}</span><b>${a.name}</b><small>${a.desc}</small><span class="ak">${a.ak}</span>${starHtml(data.stars[a.id]||0)}</button>`).join("");
  show("home");}
$("areas").onclick=e=>{const b=e.target.closest("[data-a]");if(b)start(AREAS.find(a=>a.id===b.dataset.a));};

/* ---------- Uppläsning ---------- */
let svVoice=null;function loadVoices(){try{svVoice=speechSynthesis.getVoices().find(v=>/^sv/i.test(v.lang))||null}catch(e){}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
function speak(text){if(!("speechSynthesis" in window))return toast("Uppläsning fungerar inte i den här webbläsaren.");loadVoices();
  if(!svVoice&&speechSynthesis.getVoices().length)return toast("Den här datorn har ingen svensk röst för uppläsning.");
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="sv-SE";if(svVoice)u.voice=svVoice;u.rate=.9;speechSynthesis.speak(u);}
$("spk").onclick=()=>{if(G&&G.t)speak(G.t.speak);};

/* ---------- Spelet ---------- */
const ROUND=10;let G=null;
function start(area){G={area,n:ROUND,i:-1,missed:0,pending:[]};show("game");next();}
function next(){
  G.i++;if(G.i>=G.n)return finish();
  let t=null;if(G.pending.length&&G.pending[0].at<=G.i)t=G.pending.shift().t;
  if(!t){for(let k=0;k<6;k++){t=G.area.gen();if(t.instr+t.answer!==G.lastKey)break;}}
  G.lastKey=t.instr+t.answer;G.t=t;G.first=true;G.input="";G.busy=false;
  if("speechSynthesis" in window)speechSynthesis.cancel();
  $("info").textContent=`${G.i+1} av ${G.n}`;$("prog").style.width=(G.i/G.n*100)+"%";
  $("instr").textContent=t.instr;$("feedback").textContent="";$("task").className="task";$("help").hidden=true;$("task").hidden=false;
  render();
}
function render(){
  const t=G.t,c=$("content");$("pad").hidden=t.kind!=="keys";
  if(t.kind==="opts"){
    c.innerHTML=t.html+`<div class="opts${t.emo?" emo":""}${t.pics?" pics":""}${t.fr?" frs":""}">${t.options.map((o,i)=>`<button data-o="${o}">${t.labels?t.labels[i]:o}</button>`).join("")}</div>`;
    c.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{if(G.busy)return;if(b.dataset.o===String(t.answer)){b.classList.add("right");done();}else{b.classList.add("bad");wrong(b.dataset.o,t.labels?b.innerHTML:null);}});
  }else if(t.kind==="keys"){
    c.innerHTML=t.html+`<div><span class="box1" id="box">?</span>${t.unit?` <b>${t.unit}</b>`:""}</div>`;if(t.mount)t.mount(c);
  }else if(t.kind==="tap"){
    c.innerHTML=`<div class="tapgrid">${t.items.map((p,i)=>`<button class="tapit" data-i="${i}">${p}</button>`).join("")}</div><button class="go" id="done">Klar</button>`;
    c.querySelectorAll(".tapit").forEach(b=>b.onclick=()=>{if(!G.busy)b.classList.toggle("sel");});
    $("done").onclick=()=>{if(G.busy)return;const sel=[...c.querySelectorAll(".tapit.sel")].map(b=>+b.dataset.i);
      const ok=sel.length===t.correct.length&&t.correct.every(i=>sel.includes(i));ok?done():wrong(sel.length?`${sel.length} former`:"ingen form");};
  }else if(t.kind==="cut"){
    /* Skär själv: tryck på bilden där kniven ska skära */
    /* Med mus syns snittet när man pekar. Med finger syns det medan fingret är nere, och snittet görs när man lyfter. */
    G.cuts=[];G.state=G.cuts;const draw=()=>{c.innerHTML=t.draw(G.cuts)+`<button class="go" id="done">Klar</button>`;
      const s=c.querySelector("svg.cutsvg");s.insertAdjacentHTML("beforeend",'<g class="pv"></g>');const pv=s.querySelector(".pv");let down=false;
      const at=e=>{const p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(s.getScreenCTM().inverse());};
      const show=e=>{const q=at(e);pv.innerHTML=t.preview(G.cuts,q.x,q.y);};
      s.addEventListener("pointermove",e=>{if(!G.busy&&(down||e.pointerType==="mouse"))show(e);});
      s.addEventListener("pointerleave",()=>{if(!down)pv.innerHTML="";});
      s.addEventListener("pointerdown",e=>{if(G.busy)return;down=true;try{s.setPointerCapture(e.pointerId);}catch(_){}show(e);});
      s.addEventListener("pointerup",e=>{if(!down)return;down=false;const q=at(e);if(t.tap(G.cuts,q.x,q.y))draw();else pv.innerHTML="";});
      s.addEventListener("pointercancel",()=>{down=false;pv.innerHTML="";});
      $("done").onclick=()=>{if(G.busy)return;const r=t.check(G.cuts);
        if(t.spread&&G.cuts.length)c.querySelector("svg.cutsvg").outerHTML=t.spread(G.cuts);
        r===true?done():wrong(r);};};
    draw();
  }else if(t.kind==="color"){
    G.state=new Set();const draw=()=>{c.innerHTML=`<div class="topfr">${t.topFr}</div>`+t.draw(G.state)+`<button class="go" id="done">Klar</button>`;
      c.querySelectorAll(".part").forEach(el=>el.onclick=()=>{if(G.busy)return;const p=+el.dataset.p;G.state.has(p)?G.state.delete(p):G.state.add(p);draw();});
      $("done").onclick=()=>{if(G.busy)return;G.state.size===t.need?done():wrong(`${G.state.size} av ${t.n} bitar uppätna`);};};
    draw();
  }else{
    G.state=new Set();const draw=()=>{c.innerHTML=t.grid(G.state,false)+`<button class="go" id="done">Klar</button>`;
      c.querySelectorAll("i.tap").forEach(el=>el.onclick=()=>{if(G.busy)return;const k=el.dataset.k;G.state.has(k)?G.state.delete(k):G.state.add(k);draw();});
      $("done").onclick=()=>{if(G.busy)return;const ok=G.state.size===t.want.size&&[...t.want].every(k=>G.state.has(k));ok?done():wrong("din spegling");};};
    draw();
  }
}
function press(k){if(!G||G.busy||G.t.kind!=="keys")return;if(k==="del")G.input=G.input.slice(0,-1);else if(k==="ok"){if(G.input!==""){+G.input===G.t.answer?done():wrong(G.input);}return;}else if(G.input.length<3)G.input+=k;$("box").textContent=G.input||"?";}
document.querySelectorAll("#pad button").forEach(b=>b.onclick=()=>press(b.dataset.k));
document.addEventListener("keydown",e=>{if($("game").hidden||!G)return;if(!$("help").hidden){if(e.key==="Enter"){e.preventDefault();$("helpGo").click();}return;}
  if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==="Backspace"){e.preventDefault();press("del");}else if(e.key==="Enter"){e.preventDefault();press("ok");}});
const PRAISE=["Rätt!","Snyggt!","Bra!","Toppen!","Klockrent!"];
const petFx=c=>{const p=$("hpet");if(p){p.classList.remove("hop","hmm");void p.offsetWidth;p.classList.add(c);}};
function done(){G.busy=true;window.Ljud&&Ljud.ok();petFx("hop");$("task").className="task ok";$("feedback").textContent=G.first?pickOne(PRAISE):"Nu blev det rätt!";setTimeout(next,900);}
function wrong(given,givenHTML){
  G.busy=true;window.Ljud&&Ljud.bad();petFx("hmm");if(G.first)G.missed++;G.first=false;
  const hp=G.t.help(G.state);
  $("helpSaid").innerHTML=givenHTML?`Du svarade <span style="display:inline-block;min-width:32px;vertical-align:middle;font-size:1.3rem">${givenHTML}</span>. Så här är det:`:`Du svarade: ${given}. Så här är det:`;
  $("helpVis").innerHTML=hp.vis;$("helpTip").textContent="Tips: "+hp.tip;
  setTimeout(()=>{$("task").hidden=true;$("pad").hidden=true;$("help").hidden=false;$("helpGo").focus({preventScroll:true});},450);
}
$("helpGo").onclick=()=>{G.pending.push({t:G.t,at:G.i+3});G.n++;next();};
$("quit").onclick=openHome;

function finish(){
  const right=Math.max(0,ROUND-G.missed),st=right===ROUND?3:right>=ROUND-2?2:1,id=G.area.id;
  if(st>(data.stars[id]||0)){data.stars[id]=st;save();}
  $("rTitle").textContent=st===3?"Alla rätt direkt!":st===2?"Bra jobbat!":"Klart!";
  $("rBig").innerHTML=starHtml(st);$("rSub").textContent=`${right} av ${ROUND} rätt på första försöket.`;
  show("result");if(st===3){window.Ljud&&Ljud.fanfare();confetti();}
}
$("rAgain").onclick=()=>start(G.area);$("rHome").onclick=openHome;
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("fx"),x=c.getContext("2d"),dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);c.hidden=false;
  const P=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*120,y:H*.3,vx:(Math.random()-.5)*16,vy:-Math.random()*15-4,r:Math.random()*7+5,c:pickOne(COLS),a:Math.random()*6,va:(Math.random()-.5)*.4}));
  const t0=performance.now();(function f(now){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(now-t0<2800)requestAnimationFrame(f);else{x.clearRect(0,0,W,H);c.hidden=true;}})(t0);
}
openHome();
</script>
</body>
</html>
