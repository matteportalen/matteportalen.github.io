<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiotalsövergång: Bussen – Matte-Portalen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF3FF; --ink:#1D2B53; --muted:#56668F; --card:#FFFFFF; --line:#C6D6F2;
  --good:#1E9E5E; --good-dark:#157548; --bad:#E5484D; --sun:#FFC93C; --accent:#3D5AFE;
  --blue:#3D8BFD; --orange:#FF9F43; --gold:#F2B707;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --d:clamp(16px,5.2vw,26px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none !important}
.back{display:inline-block;color:var(--muted);font-weight:700;text-decoration:none;padding:6px 0;font-size:1rem}
h1{font-size:2.5rem;line-height:1;margin:14px 0 4px;font-weight:800;letter-spacing:-.5px}
h2{font-size:2rem;line-height:1.1;margin:10px 0 6px;font-weight:800}
.lead{margin:0 0 16px;color:var(--muted);font-size:1.1rem}

/* Val */
.pick{margin-bottom:14px}
.pick .lbl{font-weight:700;color:var(--muted);font-size:.95rem;margin-bottom:4px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px 6px;border-radius:14px;background:var(--card);font-weight:800;font-size:1.1rem;box-shadow:0 3px 0 var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 3px 0 #0E1735}

.levels{display:grid;gap:12px;margin-top:20px}
.big{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;border-radius:18px;background:var(--card);
  box-shadow:0 4px 0 var(--line);text-align:left;transition:transform .08s,box-shadow .08s}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.big .num{width:2.4rem;height:2.4rem;flex:none;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.3rem}
.big b{display:block;font-size:1.3rem;line-height:1.2}
.big small{display:block;color:var(--muted);font-size:.95rem;line-height:1.3}
.big .side{margin-left:auto;text-align:right;font-weight:700;font-size:.95rem;color:var(--muted);flex:none;white-space:pre-line}
.stars{color:var(--gold);font-size:1.3rem;letter-spacing:1px}
.stars .off{color:#D5DDEC}
.big.locked{opacity:.5}
.big.locked .num{background:#9AA7BF}
.note{color:var(--muted);font-size:.95rem;margin-top:18px}

/* Spel */
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.info{font-weight:800;font-size:1.2rem}
.visual{background:var(--card);border-radius:20px;padding:10px 8px 4px;box-shadow:0 4px 0 var(--line);margin-top:10px}
.blocks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end}
.rods{display:flex;gap:4px;align-items:flex-end}
.rod{width:11px;height:calc(var(--d)*2 + 22px);border-radius:3px;
  background:repeating-linear-gradient(to bottom,var(--blue) 0 calc(10% - 1px),#fff calc(10% - 1px) 10%);border:1px solid var(--blue)}
.frame{display:grid;grid-template-columns:repeat(5,var(--d));gap:4px;padding:5px;border:3px solid var(--ink);border-radius:8px}
/* ---------- Bussen ---------- */
.party{display:flex;align-items:center;gap:10px;margin-top:6px}
.party .lead{margin:4px 0 0}
.ppet{width:86px;flex:none}
.world{display:inline-block;font-size:.95rem;vertical-align:middle;background:#E8A33D;color:#fff;border-radius:999px;padding:2px 10px;margin-left:4px;transform:rotate(-3deg)}
.pet svg{width:100%;height:auto;display:block;transform-origin:50% 90%}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-18px) rotate(-4deg)}70%{transform:translateY(0) rotate(3deg)}}
@keyframes hmm{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(-9deg)}}
.pet.hop svg{animation:hop .55s ease-out 2}
.pet.hmm svg{animation:hmm .9s ease-in-out}
.gright{display:flex;align-items:center;gap:8px;margin-left:auto}
.hpet{width:42px}
.bowl{margin-top:14px;background:var(--card);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:10px 12px;text-align:center}
.bowl b{display:block;font-size:1.05rem}
.bowl small{display:block;color:var(--muted);font-size:.85rem;line-height:1.25;margin-top:4px}
.stops{display:flex;align-items:center;justify-content:center;margin-top:8px;flex-wrap:wrap;row-gap:8px}
.stops span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:1.45rem;background:#FFF4CC;position:relative}
.stops span.no{background:#EEF2FA;color:#B7C3DA;font-size:.8rem;font-weight:800}
.stops i{width:10px;height:4px;background:#C6D6F2;border-radius:2px}
.stops i.on{background:#E8A33D}
/* tiorutan som buss: 10 platser, blått = första talet, orange = de som kliver på */
.blocks .frame{position:relative;background:#FFC93C;border:3px solid var(--ink);border-radius:14px 14px 8px 8px;padding:8px 8px 16px;margin-bottom:10px;gap:5px}
.blocks .frame::before{content:"";position:absolute;left:10px;right:10px;bottom:-11px;height:18px;
  background:radial-gradient(circle,#1D2B53 0 6px,#AEB9CC 6.5px 8px,#1D2B53 8.5px 9px,transparent 9.5px) left center/18px 18px no-repeat,
             radial-gradient(circle,#1D2B53 0 6px,#AEB9CC 6.5px 8px,#1D2B53 8.5px 9px,transparent 9.5px) right center/18px 18px no-repeat}
.blocks .frame::after{content:"";position:absolute;right:-3px;bottom:12px;width:7px;height:7px;border-radius:2px;background:#FFF4CC;box-shadow:0 0 0 2px var(--ink)}
.blocks .frame i{border:0;border-radius:7px;background:#DDF1FF;box-shadow:inset 0 2px 0 rgba(29,43,83,.15)}
.blocks .frame i.b{background:radial-gradient(circle at 50% 56%,var(--blue) 0 52%,#DDF1FF 55%)}
.blocks .frame i.o{background:radial-gradient(circle at 50% 56%,var(--orange) 0 52%,#DDF1FF 55%)}
.blocks .frame i.x{background:#DDF1FF}
.rod{background:radial-gradient(circle,var(--blue) 0 35%,transparent 40%) center top/100% 10% repeat-y,#FFC93C !important;border:2px solid var(--ink) !important;width:13px !important;border-radius:4px !important}
.car svg{height:42px;width:auto;display:block}
.car.ghost svg{filter:grayscale(1)}
@media (prefers-reduced-motion:reduce){.pet svg{animation:none !important}}

.frame i{width:var(--d);height:var(--d);border-radius:50%;border:2px dashed #C9D3E6;position:relative}
.frame i.b{background:var(--blue);border-color:var(--blue)}
.frame i.o{background:var(--orange);border-color:var(--orange)}
.frame i.x{background:#E3E8F2;border-color:#C9D3E6}
.frame i.x::after{content:"×";position:absolute;inset:0;display:grid;place-items:center;color:var(--bad);font-weight:800;font-size:calc(var(--d)*.8);line-height:1}
.frame i.pop{animation:pop .35s ease-out backwards}
@keyframes pop{from{transform:scale(0)}60%{transform:scale(1.2)}to{transform:scale(1)}}
.nline{display:block;width:100%;height:auto;margin-top:6px}
.nline text{font-family:var(--font);font-weight:700}

.qbox{background:var(--card);border-radius:22px;padding:10px 14px;text-align:center;box-shadow:0 5px 0 var(--line);margin:12px 0;transition:background .15s}
.qbox.ok{background:#DDF5E7}
.qbox.bad{background:#FDE4E4}
.prompt{font-weight:700;font-size:1.1rem;min-height:1.5em;margin-bottom:4px}
.erow{font-size:clamp(1.6rem,7.5vw,2.2rem);font-weight:800;line-height:1.35;white-space:nowrap}
.erow.main{font-size:clamp(2.6rem,13vw,4rem)}
.erow span{margin:0 .08em}
.box{display:inline-block;min-width:1.7em;padding:0 .2em;border-radius:10px;border:3px dashed var(--line);color:#B4C0D8;line-height:1.15}
.box.act{border:3px solid var(--accent);color:var(--accent);background:#EEF1FF}
.box.done{border:3px solid transparent;background:#FFE9D2;color:#C96A0C}
.tree{position:relative;display:inline-block;padding:2px 6px}
.legs{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.trow{font-size:clamp(1.35rem,6.6vw,2.3rem);font-weight:800;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:.22em;position:relative;z-index:1;line-height:1.3}
.trow+.trow{margin-top:30px}
.circ{display:inline-grid;place-items:center;width:1.55em;height:1.55em;border:3px solid var(--blue);border-radius:50%;background:#fff}
.grp{background:#E4E0F7;border-radius:10px;padding:0 .2em}
.tree .box{min-width:1.4em}
.endres{color:#B4C0D8}
.endres.show{color:var(--ink)}
.feedback{min-height:1.5em;font-weight:800;font-size:1.1rem;margin-top:4px}
.qbox.ok .feedback{color:var(--good)}
.qbox.bad .feedback{color:var(--bad)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:56px;border-radius:16px;background:var(--card);font-size:1.8rem;font-weight:800;box-shadow:0 4px 0 var(--line);transition:transform .06s,box-shadow .06s}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad .okbtn{background:var(--good);color:#fff;box-shadow:0 4px 0 var(--good-dark);font-size:1.4rem}

.track{background:var(--card);border-radius:18px;padding:4px 12px;margin-top:12px;box-shadow:0 4px 0 var(--line)}
.lane{position:relative;height:46px;margin-right:34px}
.lane+.lane{border-top:2px dashed var(--line)}
.lane .who{position:absolute;left:0;top:1px;font-size:.75rem;font-weight:700;color:var(--muted)}
.lane .flag{position:absolute;right:-32px;top:50%;transform:translateY(-50%);font-size:1.4rem}
.car{position:absolute;bottom:4px;left:0;width:46px;transition:left .3s ease-out}
.car.ghost{transition:none;opacity:.45}
.racestatus{text-align:center;font-weight:700;color:var(--muted);font-size:1rem;min-height:1.4em;margin-top:6px}

/* Resultat */
.result{text-align:center;padding-top:20px}
.rbig{font-size:clamp(3.2rem,16vw,4.6rem);font-weight:800;line-height:1;margin:6px 0}
.rbig .stars{font-size:inherit}
.rsub{color:var(--muted);font-size:1.15rem;margin:0 0 14px}
.unlock{background:#FFF4CC;border-radius:14px;padding:8px 12px;font-weight:700;margin:0 0 12px}
.slow{background:var(--card);border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--line);margin:8px 0 6px}
.slow p{margin:0 0 8px;font-weight:700}
.slow .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.slow .row span{background:var(--bg);border-radius:10px;padding:2px 12px;font-weight:800;font-size:1.2rem}
.go{display:block;width:100%;padding:14px;border-radius:18px;background:var(--good);color:#fff;font-size:1.3rem;font-weight:800;box-shadow:0 5px 0 var(--good-dark);margin-top:12px}
.result .big{justify-content:center;text-align:center;font-weight:800;font-size:1.2rem;margin-top:12px}

.count{position:fixed;inset:0;display:grid;place-items:center;background:rgba(234,243,255,.85);font-size:6rem;font-weight:800;z-index:5}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:14px;font-weight:700;z-index:6;max-width:90vw;text-align:center}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:7}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
/* Så här räknar du */
.howto{background:#E9F4FF;border-radius:20px;overflow:hidden;box-shadow:0 4px 0 #B7C9EE;margin:0 0 14px;border:2px solid #C9D8F5}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#4B5BD6;color:#fff;padding:8px 12px}
.htitle{font-weight:800;font-size:1.25rem}
.htabs{display:flex;gap:6px}
.htabs button{border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font-weight:800;font-size:.9rem;padding:4px 12px}
.htabs button[aria-pressed="true"]{background:#fff;color:#4B5BD6}
.hbody{display:grid;grid-template-columns:1fr;gap:10px;padding:12px}
@media(min-width:620px){.hbody{grid-template-columns:1.1fr 1fr;align-items:center}}
.hex{margin:0 0 6px;color:var(--muted);font-weight:700;font-size:1rem}
.hex b{color:var(--ink)}
.hsteps ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hsteps li{display:flex;gap:8px;align-items:flex-start;font-size:1.02rem;line-height:1.3;border-radius:12px;padding:4px 6px;transition:background .2s,opacity .2s}
.hsteps li.on{background:#FFF4CC}
.hsteps li.dim{opacity:.35}
.hn{flex:none;width:26px;height:26px;border-radius:50%;background:#4B5BD6;color:#fff;display:grid;place-items:center;font-weight:800;font-size:.95rem}
.hplay{margin-top:10px;border-radius:999px;background:#fff;box-shadow:0 3px 0 #B7C9EE;padding:6px 14px;font-weight:800;font-size:.95rem;color:#4B5BD6}
.hpaper{position:relative;display:inline-block;line-height:0}
.pencil{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.pen{fill:none;stroke:#4A5068;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.85;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease-out forwards}
.pen:nth-of-type(2){animation-delay:.9s}.pen:nth-of-type(3){animation-delay:1.8s}.pen:nth-of-type(4){animation-delay:2.6s}.pen:nth-of-type(5){animation-delay:3.2s}
.pen.late{animation-duration:.4s}
@keyframes draw{to{stroke-dashoffset:0}}
.pnote{font-family:"Baloo 2","Trebuchet MS",cursive,sans-serif;font-weight:700;font-size:15px;fill:#4A5068;opacity:0;animation:fadein .5s ease-out 1.2s forwards}
@keyframes fadein{to{opacity:1}}
.hnav{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hnav .hplay{margin-top:0}
.hplay:disabled{opacity:.4}
.hplay.main{background:#4B5BD6;color:#fff;box-shadow:0 3px 0 #2F3DA8}
@media (prefers-reduced-motion:reduce){.pen{animation:none;stroke-dashoffset:0}.pnote{animation:none;opacity:1}}
.hvis{display:flex;align-items:flex-end;justify-content:center;gap:6px;flex-wrap:wrap}
.hvis .paper{margin:0}
.hhl{background:rgba(255,201,60,.35);border-radius:6px}
.hmk{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:#4B5BD6;color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px #fff;animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.howl{position:relative;width:78px;flex:none}
.howl svg{width:78px;height:auto;display:block}
.hbub{position:absolute;right:0;bottom:100%;margin-bottom:8px;background:#fff;border:2px solid #4B5BD6;border-radius:12px;padding:4px 8px;font-weight:800;font-size:.8rem;line-height:1.2;width:128px;color:var(--ink);text-align:center}
.hbub::after{content:"";position:absolute;right:26px;top:100%;border:7px solid transparent;border-top-color:#4B5BD6}
.howl{margin-top:58px}
@media(max-width:619px){.hvis{justify-content:space-between}}
.qbtn{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:1.25rem;color:#4B5BD6}
.hmodal{position:fixed;inset:0;background:rgba(29,43,83,.55);display:grid;place-items:center;z-index:9;padding:12px}
.hmodal[hidden]{display:none}
.hsheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:transparent}
.hclose{display:block;margin:0 0 0 auto;background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;box-shadow:0 3px 0 var(--line);margin-bottom:8px}
@media (prefers-reduced-motion:reduce){.hmk{animation:none}}
.hpaper{position:relative;display:inline-block;line-height:0}
.pencil{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.pen{fill:none;stroke:#4A5068;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.85;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease-out forwards}
.pen:nth-of-type(2){animation-delay:.9s}.pen:nth-of-type(3){animation-delay:1.8s}.pen:nth-of-type(4){animation-delay:2.6s}.pen:nth-of-type(5){animation-delay:3.2s}
.pen.late{animation-duration:.4s}
@keyframes draw{to{stroke-dashoffset:0}}
.pnote{font-family:"Baloo 2","Trebuchet MS",cursive,sans-serif;font-weight:700;font-size:15px;fill:#4A5068;opacity:0;animation:fadein .5s ease-out 1.2s forwards}
@keyframes fadein{to{opacity:1}}
.hnav{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hnav .hplay{margin-top:0}
.hplay:disabled{opacity:.4}
.hplay.main{background:#4B5BD6;color:#fff;box-shadow:0 3px 0 #2F3DA8}
@media (prefers-reduced-motion:reduce){.pen{animation:none;stroke-dashoffset:0}.pnote{animation:none;opacity:1}}
.hpic{flex:1;min-width:0;max-width:340px;background:#fff;border-radius:14px;box-shadow:inset 0 0 0 2px #C9D8F5;padding:6px}
.hsvg{width:100%;height:auto;display:block;overflow:visible}
.hsvg .pen{stroke-width:2.6}
.htabs{flex-wrap:wrap}
/* Tiotal: bilden i full bredd, ugglan under med pratbubblan bredvid */
.hvis{flex-wrap:wrap;justify-content:flex-end}
.hpic{flex:1 1 100%;max-width:none}
.hvis .howl{margin-top:4px;width:70px}
.hvis .howl svg{width:70px}
.hvis .hbub{right:80px;bottom:22px;margin-bottom:0}
.hvis .hbub::after{right:-14px;top:12px;border-top-color:transparent;border-left-color:#4B5BD6}
</style>
</head>
<body>
<div class="wrap">

<!-- Start -->
<section id="home" class="screen">
  <a class="back" href="../">← Till huvudmenyn</a>
  <div class="party"><div class="ppet pet" id="homePet" aria-hidden="true"></div>
    <div><h1>Tiotalsövergång <span class="world">🚌 Bussen</span></h1><p class="lead" id="homeLead"></p></div></div>
  <div id="howtoHome" style="margin-top:12px"></div>
  <div class="pick"><div class="lbl">Talområde</div>
    <div class="seg" id="segRange"><button data-v="20">Upp till 20</button><button data-v="100">Upp till 100</button></div></div>
  <div class="pick"><div class="lbl">Räknesätt</div>
    <div class="seg" id="segOp"><button data-v="plus">Addition</button><button data-v="minus">Subtraktion</button></div></div>
  <div class="pick" id="pickStrat"><div class="lbl">Strategi för subtraktion</div>
    <div class="seg" id="segStrat"><button data-v="take">Ta bort till 10</button><button data-v="think">Tänk addition</button></div></div>
  <div class="levels" id="levels"></div>
  <p class="note">Tre stjärnor får du om alla uppgifter blir rätt direkt.</p>
  <div class="bowl" id="route"></div>
</section>

<!-- Spel -->
<section id="game" class="screen" hidden>
  <div class="gtop"><button class="back" id="quit">← Avsluta</button><button class="qbtn" id="qbtn" aria-label="Så här räknar du">?</button><span class="gright"><span class="info" id="info"></span><span class="hpet pet" id="hpet" aria-hidden="true"></span></span></div>
  <div id="raceBox" hidden>
    <div class="track">
      <div class="lane"><span class="who">Du</span><span class="flag" title="Hållplatsen">🚏</span><div class="car" id="carMe"></div></div>
      <div class="lane"><span class="who" id="ghostWho">Spöket</span><div class="car ghost" id="carGhost"></div></div>
    </div>
    <div class="racestatus" id="raceStatus"></div>
  </div>
  <div class="visual" id="visual">
    <div class="blocks"><div class="rods" id="rods"></div><div class="frame" id="f1"></div><div class="frame" id="f2"></div></div>
    <svg class="nline" id="nline" viewBox="0 0 340 84" aria-hidden="true"></svg>
  </div>
  <div class="qbox" id="qbox">
    <div class="prompt" id="prompt"></div>
    <div id="rows"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </div>
  <div class="pad" id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>

<script>
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const RACE_LEN=20, ROUND=10;
const carSvg=c=>`<svg viewBox="0 0 48 28" width="46" height="27" aria-hidden="true"><path d="M3 19Q3 13 9 12.5L15 12L21 5H33L39.5 12Q46 13 46 19V21H3Z" fill="${c}"/><path d="M23 7H32L36.5 12H23Z" fill="#fff" opacity=".85"/><circle cx="12" cy="21" r="5" fill="#1D2B53"/><circle cx="37" cy="21" r="5" fill="#1D2B53"/><circle cx="12" cy="21" r="2" fill="#fff"/><circle cx="37" cy="21" r="2" fill="#fff"/></svg>`;

/* ---------- Lagring (bara i den här webbläsaren) ---------- */
const KEY='mattespel-tiotal-v1';
let data=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.stars)return Object.assign({race:{},set:{range:20,op:'plus',strat:'take'}},d);}catch(e){}
  return{stars:{},race:{},set:{range:20,op:'plus',strat:'take'}};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
const set=data.set;
const unlockAll=new URLSearchParams(location.search).has('alla'); // lärarlänk: ?alla låser upp alla nivåer
const pkey=()=>set.range+set.op;
const starsOf=lv=>(data.stars[pkey()]||{})[lv]||0;
const unlocked=lv=>true; // alla nivåer är öppna
const think=()=>set.op==='minus'&&set.range===20&&set.strat==='think';

/* ---------- Bussen: elevens djur kör bussen, busslinjen växer med stjärnorna ---------- */
const pet=Object.assign(lasDjur(),{hat:'keps'}),petName=PETNAME[pet.animal]||'Ugglan',lc=petName.toLowerCase();
const STOPS=[[1,'🏫','skolan'],[4,'🏪','affären'],[8,'🏊','badhuset'],[12,'🌳','parken'],[17,'🎡','tivolit'],[22,'🏰','slottet'],[28,'🏖️','stranden'],[36,'🚀','rymdbasen']];
const petFx=c=>{const p=$('#hpet');if(p){p.classList.remove('hop','hmm');void p.offsetWidth;p.classList.add(c);}};
$('#homePet').innerHTML=owlSVG(pet);$('#hpet').innerHTML=owlSVG(pet);
$('#homeLead').textContent=`${petName} kör bussen! En buss har 10 platser. När den är full kör den iväg, och resten kliver på nästa buss.`;
function renderRoute(){
  const tot=Object.values(data.stars).reduce((s,o)=>s+Object.values(o||{}).reduce((a,b)=>a+(+b||0),0),0),nxt=STOPS.find(([n])=>tot<n);
  $('#route').innerHTML=`<b>Busslinjen: ${tot} ${tot===1?'stjärna':'stjärnor'}</b><div class="stops">${STOPS.map(([n,e,nm],i)=>(i?`<i class="${tot>=n?'on':''}"></i>`:'')+(tot>=n?`<span title="${nm}">${e}</span>`:`<span class="no" title="${nm}">${n}★</span>`)).join('')}</div>`+
    `<small>${nxt?`Med ${nxt[0]} stjärnor kan bussen köra till ${nxt[2]}. Stjärnorna från alla talområden och räknesätt räknas.`:'Bussen kör hela linjen ända till rymdbasen. Snyggt!'}</small>`;
}

/* ---------- Startsida ---------- */
let G=null,curLevel=1;
function show(id){$$('.screen').forEach(s=>s.hidden=s.id!==id);window.scrollTo(0,0);}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
const fmt=ms=>(ms/1000).toFixed(1).replace('.',',')+' s';
const starHtml=n=>`<span class="stars">${[1,2,3].map(i=>i<=n?'★':'<span class="off">★</span>').join('')}</span>`;
function levelInfo(lv){
  const r=set.range===20,p=set.op==='plus';
  if(lv===1)return p?[r?'Tiokompisar':'Till nästa tiotal',r?'Vilken är talets tiokompis?':'Hur mycket fattas till nästa tiotal?']
                    :['Ner till tiotalet',r?'Hur mycket ska bort för att komma till 10?':'Hur mycket ska bort för att komma till tiotalet?'];
  if(lv===2)return think()?['Hoppa via 10','Hur långt är det till 10, och sedan vidare?']:['Dela upp',p?'Dela upp talet i tiokompisen och resten.':`Dela upp talet så att du först landar på ${r?'10':'tiotalet'}.`];
  if(lv===3)return['Hela strategin',p?'Addera först tiokompisarna, sedan resten.':'Subtrahera först ner till tiotalet, sedan resten.'];
  return['Racet',`${RACE_LEN} uppgifter utan stöd. Kör mot ditt spöke.`];
}
function openHome(){
  G=null;if(window.tioHowtoHome)tioHowtoHome();
  $$('#segRange button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===set.range));
  $$('#segOp button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===set.op));
  $$('#segStrat button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===set.strat));
  $('#pickStrat').hidden=!(set.op==='minus'&&set.range===20);
  const L=$('#levels');L.innerHTML='';
  [1,2,3,4].forEach(lv=>{
    const [t,d]=levelInfo(lv),open=unlocked(lv),b=document.createElement('button');
    b.className='big'+(open?'':' locked');
    const side=!open?'🔒':lv===4?(data.race[pkey()]?'Rekord\n'+fmt(data.race[pkey()].time):''):starHtml(starsOf(lv));
    b.innerHTML=`<span class="num">${lv}</span><span><b>${t}</b><small>${d}</small></span><span class="side">${side}</span>`;
    b.onclick=()=>open?startGame(lv):toast(`Få två stjärnor på nivå ${lv-1} först.`);
    L.appendChild(b);
  });
  renderRoute();show('home');
}
$$('#segRange button').forEach(b=>b.onclick=()=>{set.range=+b.dataset.v;save();openHome();});
$$('#segOp button').forEach(b=>b.onclick=()=>{set.op=b.dataset.v;save();openHome();});
$$('#segStrat button').forEach(b=>b.onclick=()=>{set.strat=b.dataset.v;save();openHome();});

/* ---------- Uppgifter ---------- */
function genTask(lv){
  const r20=set.range===20,a0=()=>{};
  let a,b=null;
  if(set.op==='plus'){
    if(lv===1){a=r20?rnd(1,9):(()=>{let x;do{x=rnd(11,89);}while(x%10===0);return x;})();}
    else if(r20){a=rnd(2,9);b=rnd(11-a,9);}
    else{do{a=rnd(21,89);}while(a%10<2);b=rnd(11-a%10,9);}
  }else{
    if(lv===1){a=r20?rnd(11,19):(()=>{let x;do{x=rnd(21,99);}while(x%10===0);return x;})();}
    else if(r20){a=rnd(11,18);b=rnd(a-9,9);}
    else{do{a=rnd(21,99);}while(a%10<1||a%10>8);b=rnd(a%10+1,9);}
  }
  return{a,b,op:set.op};
}
const tkey=t=>t.a+t.op+t.b;
const tres=t=>t.op==='plus'?t.a+t.b:t.a-t.b;
const sym=t=>t.op==='plus'?'+':'−';
const ttext=t=>`${t.a} ${sym(t)} ${t.b}`;
function buildTasks(lv,n){const out=[],seen=new Set();let guard=0;
  while(out.length<n&&guard++<500){const t=genTask(lv);const k=tkey(t);if(seen.has(k)&&guard<300)continue;seen.add(k);out.push(t);}return out;}

/* Steg och rader för varje uppgift */
function plan(t,lv){
  const {a,b}=t,box=k=>({k});
  if(t.op==='plus'){
    const D=Math.ceil(a/10)*10,p1=D-a;
    if(lv===1)return{D,rows:[[a,'+',box('p1'),'=',D]],steps:[{k:'p1',v:p1}]};
    const p2=b-p1,rows=[[a,'+',box('p1'),'=',D],[b,'=',box('p1'),'+',box('p2')]],steps=[{k:'p1',v:p1},{k:'p2',v:p2}];
    if(lv===3){rows.push([a,'+',b,'=',box('res')]);steps.push({k:'res',v:a+b});}
    if(lv===4)return{D,rows:[[a,'+',b,'=',box('res')]],steps:[{k:'res',v:a+b}],main:true};
    return{D,p1,p2,rows,steps,tree:true};
  }
  const D=Math.floor(a/10)*10,p1=a-D;
  if(lv===1)return{D,rows:[[a,'−',box('p1'),'=',D]],steps:[{k:'p1',v:p1}]};
  if(lv===4)return{D,rows:[[a,'−',b,'=',box('res')]],steps:[{k:'res',v:a-b}],main:true};
  if(think()){
    const q1=10-b,q2=a-10,rows=[[b,'+',box('p1'),'=',10],[10,'+',box('p2'),'=',a]],steps=[{k:'p1',v:q1},{k:'p2',v:q2}];
    if(lv===3){rows.push([a,'−',b,'=',box('res')]);steps.push({k:'res',v:a-b});}
    return{D:10,p1:q1,p2:q2,rows,steps};
  }
  const p2=b-p1,rows=[[a,'−',box('p1'),'=',D],[b,'=',box('p1'),'+',box('p2')]],steps=[{k:'p1',v:p1},{k:'p2',v:p2}];
  if(lv===3){rows.push([a,'−',b,'=',box('res')]);steps.push({k:'res',v:a-b});}
  return{D,p1,p2,rows,steps,tree:true};
}
function promptFor(t,P,k){
  const {a,b}=t;
  if(P.main)return'';
  if(t.op==='plus'){
    if(!P.tree)return set.range===20?`Vilken är ${a}:ans tiokompis?`:`Hur mycket behöver ${a} för att bli ${P.D}?`;
    if(k==='p1')return`1. Addera först tiokompisarna. ${a} + ? = ${P.D}`;
    if(k==='p2')return`2. Addera sedan resten. Hur mycket är kvar av ${b}?`;
    return`Vad blir ${P.D} + ${P.p2}?`;
  }
  if(think()){
    if(k==='p1')return`Hur långt är det från ${b} till 10?`;
    if(k==='p2')return`Hur långt är det från 10 till ${a}?`;
    return`Lägg ihop hoppen. Vad blir ${a} − ${b}?`;
  }
  if(!P.tree)return`Hur mycket ska bort för att ${a} ska bli ${P.D}?`;
  if(k==='p1')return`1. Subtrahera först ner till tiotalet. ${a} − ? = ${P.D}`;
  if(k==='p2')return`2. Subtrahera sedan resten. Hur mycket är kvar av ${b}?`;
  return`Vad blir ${P.D} − ${P.p2}?`;
}
function hintFor(t,P,k){
  if(t.op==='plus'){
    if(k==='p1')return'Räkna de tomma platserna i bussen. Så många fattas till ett helt tiotal.';
    if(k==='p2')return`${t.b} delas upp i ${P.p1} och ?. ${P.p1} + ? = ${t.b}`;
    return`Du är på ${P.D}. ${P.D} + ${P.p2} = ?`;
  }
  if(think()){
    if(k==='p1')return'Räkna de tomma platserna i bussen.';
    if(k==='p2')return`10 + ? = ${t.a}`;
    return`Lägg ihop hoppen: ${P.p1} + ${P.p2} = ?`;
  }
  if(k==='p1')return'Hur många sitter i den högra bussen?';
  if(k==='p2')return`${t.b} delas upp i ${P.p1} och ?. ${P.p1} + ? = ${t.b}`;
  return`Du är på ${P.D}. ${P.D} − ${P.p2} = ?`;
}

/* ---------- Bild: tiostavar, tiorutor och tallinje ---------- */
function cells(t,lv,stage){
  const f1=Array(10).fill(''),f2=Array(10).fill('');let rods=0;const {a,b}=t;
  if(t.op==='minus'&&think()&&lv>1){
    for(let i=0;i<10;i++)f1[i]=i<b?'b':(stage>=1?'o':'');
    if(stage>=2)for(let i=0;i<a-10;i++)f2[i]='o';
  }else if(t.op==='plus'){
    const D=Math.ceil(a/10)*10,u=a-(D-10);rods=D/10-1;
    for(let i=0;i<10;i++)f1[i]=i<u?'b':(stage>=1?'o':'');
    if(stage>=2&&b!=null)for(let i=0;i<b-(D-a);i++)f2[i]='o';
  }else{
    const D=Math.floor(a/10)*10,r=a-D;rods=D/10-1;
    for(let i=0;i<10;i++)f1[i]='b';
    for(let i=0;i<r;i++)f2[i]=stage>=1?'x':'b';
    if(stage>=2&&b!=null)for(let i=10-(b-r);i<10;i++)f1[i]='x';
  }
  return{rods,f1,f2};
}
let prevCells=null;
function renderVisual(){
  const c=cells(G.t,G.lv,G.si);
  $('#rods').innerHTML=Array.from({length:c.rods},()=>'<div class="rod"></div>').join('');
  $('#rods').hidden=!c.rods;
  ['f1','f2'].forEach(f=>{const el=$('#'+f);el.innerHTML=c[f].map((v,i)=>{
    const pop=prevCells&&prevCells[f][i]!==v&&v?' pop':'';return`<i class="${v}${pop}"></i>`;}).join('');});
  prevCells=c;
  renderLine();
}
function renderLine(){
  const t=G.t,P=G.P,svg=$('#nline');
  let lo,hi,start,jumps;
  if(t.op==='minus'&&think()&&G.lv>1){lo=0;hi=20;start=t.b;jumps=[[t.b,10,'+'+P.p1],[10,t.a,'+'+P.p2]];}
  else if(t.op==='plus'){lo=P.D-10;hi=P.D+10;start=t.a;jumps=[[t.a,P.D,'+'+(P.D-t.a)]];if(G.lv>1)jumps.push([P.D,t.a+t.b,'+'+P.p2]);}
  else{lo=P.D-10;hi=P.D+10;start=t.a;jumps=[[t.a,P.D,'−'+(t.a-P.D)]];if(G.lv>1)jumps.push([P.D,t.a-t.b,'−'+P.p2]);}
  const x=n=>16+(n-lo)*(308/(hi-lo)),Y=56;
  let s=`<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FF9F43"/></marker></defs>`;
  s+=`<line x1="10" y1="${Y}" x2="330" y2="${Y}" stroke="#1D2B53" stroke-width="3"/>`;
  for(let n=lo;n<=hi;n++){const major=n%5===0;s+=`<line x1="${x(n)}" y1="${Y-(major?9:5)}" x2="${x(n)}" y2="${Y+(major?9:5)}" stroke="#1D2B53" stroke-width="${major?2.5:1.5}"/>`;
    if(major)s+=`<text x="${x(n)}" y="${Y+26}" text-anchor="middle" font-size="14" fill="${n===P.D?'#1D2B53':'#56668F'}">${n}</text>`;}
  let pos=start;
  jumps.forEach((j,i)=>{if(i>=G.si)return;const x1=x(j[0]),x2=x(j[1]),mx=(x1+x2)/2,h=Math.min(34,10+Math.abs(x2-x1)*.35);
    s+=`<path d="M${x1} ${Y-4}Q${mx} ${Y-4-h*2} ${x2} ${Y-4}" fill="none" stroke="#FF9F43" stroke-width="3" marker-end="url(#ah)"/>`;
    s+=`<text x="${mx}" y="${Y-8-h}" text-anchor="middle" font-size="15" fill="#C96A0C">${j[2]}</text>`;pos=j[1];});
  s+=`<circle cx="${x(start)}" cy="${Y}" r="6" fill="#3D8BFD"/>`;
  if(pos!==start)s+=`<circle cx="${x(pos)}" cy="${Y}" r="6" fill="#FF9F43"/>`;
  svg.innerHTML=s;
}

/* ---------- Spelet ---------- */
function startGame(lv,custom){
  curLevel=lv;
  const race=lv===4;
  G={lv,race,custom:custom||null,tasks:custom?custom.map(t=>({...t})):buildTasks(lv,race?RACE_LEN:ROUND),i:-1,
     missed:0,correct:0,times:[],slow:{},paused:0,start:performance.now(),busy:true,over:false,raf:0,input:''};
  G.total=G.tasks.length;G.best=race&&!custom?data.race[pkey()]:null;
  $('#raceBox').hidden=!race;$('#visual').hidden=race;
  if(race){$('#carMe').innerHTML=owlSVG(pet);$('#carGhost').innerHTML=owlSVG(pet);setPos($('#carMe'),0);setPos($('#carGhost'),0);
    $('#carGhost').hidden=!G.best;$('#ghostWho').textContent=G.best?'Spöket (ditt rekord)':'Inget spöke än. Nu sätter du rekordet!';$('#raceStatus').textContent='';}
  $('#rows').innerHTML='';$('#prompt').textContent='';$('#feedback').textContent='';$('#qbox').className='qbox';$('#info').textContent='';
  if(document.activeElement)document.activeElement.blur();
  show('game');
  if(race)countdown(()=>{G.start=performance.now();nextTask();loop();});else nextTask();
}
function countdown(done){
  const c=$('#count');const steps=['3','2','1','Kör!'];let i=0;c.hidden=false;
  (function tick(){if(!G||G.over){c.hidden=true;return;}if(i<steps.length){c.textContent=steps[i++];setTimeout(tick,650);}else{c.hidden=true;done();}})();
}
const elapsed=()=>performance.now()-G.start-G.paused;
function setPos(el,p){p=Math.max(0,Math.min(1,p));el.style.left=`calc(${p*100}% - ${p*46}px)`;}
function ghostPos(pace,t){let i=0;while(i<pace.length&&pace[i]<=t)i++;if(i>=pace.length)return pace.length;const prev=i?pace[i-1]:0;return i+(t-prev)/(pace[i]-prev);}
function loop(){
  if(!G||G.over)return;
  if(G.best){const gp=ghostPos(G.best.pace,elapsed());setPos($('#carGhost'),gp/RACE_LEN);
    const d=G.correct-gp,s=d>0.4?'Du leder!':d<-0.4?'Spöket leder. Kom igen!':'Jämnt lopp!';
    if($('#raceStatus').textContent!==s)$('#raceStatus').textContent=s;}
  G.raf=requestAnimationFrame(loop);
}
function nextTask(){
  if(!G||G.over)return;G.i++;
  if(G.i>=G.total)return finish();
  G.t=G.tasks[G.i];G.P=plan(G.t,G.lv);G.steps=G.P.steps;G.si=0;G.tries=0;G.taskMissed=false;G.tStart=performance.now();
  prevCells=null;$('#info').textContent=G.race?`${G.correct} / ${G.total}`:`Uppgift ${G.i+1} av ${G.total}`;
  if(!G.race)renderVisual();
  startStep();
}
function startStep(){G.input='';G.tries=0;G.busy=false;$('#qbox').className='qbox';$('#feedback').textContent='';renderRows();}
function boxHtml(k){const idx=G.steps.findIndex(s=>s.k===k),done=idx<G.si,act=idx===G.si;
  const val=done?G.steps[idx].v:act?(G.input||'?'):'?';return`<span class="box${done?' done':''}${act?' act':''}">${val}</span>`;}
function renderTree(){
  const t=G.t,s=sym(t),done=G.si>=G.steps.length;
  const end=G.lv===3?`<span>=</span>${boxHtml('res')}`:`<span class="endres${done?' show':''}">= ${done?tres(t):'?'}</span>`;
  $('#rows').innerHTML=`<div class="tree" id="tree"><svg class="legs" id="legs"></svg>
    <div class="trow"><span>${t.a}</span><span>${s}</span><span class="circ" id="tc">${t.b}</span></div>
    <div class="trow"><span>=</span><span class="grp" id="tg1">${t.a} ${s} ${boxHtml('p1')}</span><span>${s}</span><span id="tg2">${boxHtml('p2')}</span>${end}</div></div>`;
  requestAnimationFrame(drawLegs);
}
function drawLegs(){
  const tr=$('#tree');if(!tr||!$('#tg1 .box'))return;
  const R=tr.getBoundingClientRect(),c=$('#tc').getBoundingClientRect();
  const cx=c.left+c.width/2-R.left,cy=c.bottom-R.top;
  const leg=(el,col)=>{const b=el.getBoundingClientRect();return`<line x1="${cx}" y1="${cy}" x2="${b.left+b.width/2-R.left}" y2="${b.top-R.top-2}" stroke="${col}" stroke-width="3.5" stroke-linecap="round"/>`;};
  const L=$('#legs');L.setAttribute('width',R.width);L.setAttribute('height',R.height);
  L.innerHTML=leg($('#tg1 .box'),'#3D8BFD')+leg($('#tg2 .box'),'#FF9F43');
}
window.addEventListener('resize',()=>{if(G&&G.P&&G.P.tree)drawLegs();});
function renderRows(){
  const step=G.steps[G.si];
  if(G.P.tree){$('#prompt').hidden=false;$('#prompt').textContent=step?promptFor(G.t,G.P,step.k):'';renderTree();return;}
  $('#prompt').textContent=step?promptFor(G.t,G.P,step.k):'';
  $('#prompt').hidden=!!G.P.main;
  $('#rows').innerHTML=G.P.rows.map(r=>`<div class="erow${G.P.main?' main':''}">`+r.map(p=>{
    if(typeof p!=='object')return`<span>${p}</span>`;
    const idx=G.steps.findIndex(s=>s.k===p.k),done=idx<G.si,act=idx===G.si;
    const val=done?G.steps[idx].v:act?(G.input||'?'):'?';
    return`<span class="box${done?' done':''}${act?' act':''}">${val}</span>`;}).join('')+'</div>').join('');
}
function press(k){
  if(!G||G.busy||G.over)return;
  const step=G.steps[G.si];
  if(k==='del')G.input=G.input.slice(0,-1);
  else if(k==='ok'){if(G.input)submit();return;}
  else if(G.input.length<3)G.input+=k;
  renderRows();
  if(G.input.length>=String(step.v).length)setTimeout(submit,120); // svarar automatiskt när rätt antal siffror är inskrivna
}
$$('#pad button').forEach(b=>b.onclick=()=>press(b.dataset.k));
const PRAISE=['Rätt!','Snyggt!','Bra!','Toppen!','Klockrent!'];
function submit(){
  if(!G||G.busy||G.over||!G.input)return;
  const step=G.steps[G.si],ok=+G.input===step.v;G.busy=true;
  petFx(ok?'hop':'hmm');
  if(ok){
    G.si++;$('#qbox').classList.add('ok');window.Ljud&&Ljud.ok();renderRows();
    if(!G.race)renderVisual();
    const tenMsg=G.steps[G.si-1].k==='p1'&&!G.race&&!(G.t.op==='minus'&&think()&&G.lv>1)?(G.t.op==='plus'?'Ett helt tiotal! Bussen är full.':'Nu är du på tiotalet!'):null;
    if(G.si<G.steps.length){$('#feedback').textContent=tenMsg||PRAISE[Math.floor(Math.random()*PRAISE.length)];setTimeout(startStep,750);return;}
    if(tenMsg&&G.lv===1){$('#feedback').textContent=tenMsg;}
    // uppgiften klar
    G.correct++;const ms=performance.now()-G.tStart+(G.taskMissed?6000:0);G.slow[tkey(G.t)]={t:G.t,w:ms};
    if(!(tenMsg&&G.lv===1))$('#feedback').textContent=G.taskMissed?'Nu blev det rätt!':PRAISE[Math.floor(Math.random()*PRAISE.length)];
    if(G.race){G.times.push(elapsed());setPos($('#carMe'),G.correct/RACE_LEN);$('#info').textContent=`${G.correct} / ${G.total}`;}
    setTimeout(nextTask,G.race?300:(G.lv===1?700:1100));
  }else{
    if(!G.taskMissed){G.taskMissed=true;G.missed++;}
    G.tries++;$('#qbox').classList.add('bad');window.Ljud&&Ljud.bad();
    $('#feedback').textContent=G.race?'Försök igen!':G.tries>=2?`Svaret är ${step.v}. Skriv ${step.v}.`:hintFor(G.t,G.P,step.k);
    setTimeout(()=>{if(!G||G.over)return;G.input='';G.busy=false;renderRows();$('#qbox').className='qbox bad';},G.race?450:700);
  }
}
document.addEventListener('keydown',e=>{
  if($('#game').hidden||!G||G.over)return;
  if(/^[0-9]$/.test(e.key))press(e.key);
  else if(e.key==='Backspace'){e.preventDefault();press('del');}
  else if(e.key==='Enter'){e.preventDefault();press('ok');}
});
$('#quit').onclick=()=>{if(G){G.over=true;cancelAnimationFrame(G.raf);}$('#count').hidden=true;openHome();};

/* ---------- Resultat ---------- */
function finish(){
  if(!G||G.over)return;G.over=true;cancelAnimationFrame(G.raf);
  let party=false;$('#rUnlock').hidden=true;$('#rNext').hidden=true;$('#rSlow').hidden=true;
  if(G.race){
    const t=elapsed(),best=G.best,ranked=!G.custom,rec=ranked&&(!best||t<best.time);
    if(rec){data.race[pkey()]={time:Math.round(t),pace:G.times.map(Math.round)};save();}
    $('#rTitle').textContent=rec?(best?'Nytt rekord!':'Första racet klart!'):'Framme vid hållplatsen!';
    $('#rBig').textContent=fmt(t);
    $('#rSub').textContent=!ranked?'':rec&&best?`Du slog ditt gamla rekord med ${fmt(best.time-t)}.`:rec?'Nästa gång kör du mot ditt spöke.':`Ditt rekord är ${fmt(best.time)}. Bara ${fmt(t-best.time)} ifrån!`;
    party=rec;
    const slow=Object.values(G.slow).sort((x,y)=>y.w-x.w).slice(0,3);G.slowTasks=slow.map(s=>s.t);
    $('#rSlowList').innerHTML=slow.map(s=>`<span>${ttext(s.t)} = ${tres(s.t)}</span>`).join('');$('#rSlow').hidden=slow.length<2;
  }else{
    const right=G.total-G.missed,st=right===G.total?3:right>=G.total-2?2:1;
    $('#rTitle').textContent=st===3?'Alla rätt direkt!':st===2?'Bra jobbat!':'Klart!';
    $('#rBig').innerHTML=starHtml(st);
    $('#rSub').textContent=`${right} av ${G.total} uppgifter utan fel.`;
    if(!G.custom){
      const wasOpen=unlocked(G.lv+1),k=pkey();data.stars[k]=data.stars[k]||{};
      if(st>(data.stars[k][G.lv]||0)){data.stars[k][G.lv]=st;save();}
      if(G.lv<4&&unlocked(G.lv+1)){$('#rNext').hidden=false;if(!wasOpen){$('#rUnlock').hidden=false;$('#rUnlock').textContent=`Nivå ${G.lv+1} är upplåst!`;party=true;}}
    }
    if(st===3)party=true;
  }
  show('result');if(party)confetti();
}
$('#rAgain').onclick=()=>startGame(G.lv,G.custom);
$('#rHome').onclick=openHome;
$('#rNext').onclick=()=>startGame(G.lv+1);
$('#rTrainSlow').onclick=()=>startGame(3,G.slowTasks);

/* ---------- Konfetti ---------- */
function confetti(){window.Ljud&&Ljud.fanfare();
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#3D8BFD','#FF9F43','#2BB673','#FFC93C','#7B61FF','#FF6B6B'];
  const c=$('#fx'),x=c.getContext('2d'),dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;
  c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);c.hidden=false;
  const P=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*120,y:H*.3,vx:(Math.random()-.5)*16,vy:-Math.random()*15-4,
    r:Math.random()*7+5,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,va:(Math.random()-.5)*.4}));
  const t0=performance.now();
  (function f(now){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;
    x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(now-t0<2800)requestAnimationFrame(f);else{x.clearRect(0,0,W,H);c.hidden=true;}})(t0);
}

openHome();
</script>
<div class="hmodal" id="hmodal" hidden><div class="hsheet"><button class="hclose" id="hclose">Stäng ✕</button><div id="howtoModal"></div></div></div>
<script>
/* ---------- Så här räknar du (tiotalsövergång) ---------- */
(function(){
const OWL="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 -20 120 140\"><ellipse cx=\"60\" cy=\"112\" rx=\"34\" ry=\"5\" fill=\"rgba(0,0,0,.18)\"/><path d=\"M24 44 L30 16 L46 34 Z\" fill=\"#6B4E9B\"/><path d=\"M96 44 L90 16 L74 34 Z\" fill=\"#6B4E9B\"/><ellipse cx=\"60\" cy=\"68\" rx=\"40\" ry=\"42\" fill=\"#8A6BC6\"/><ellipse cx=\"60\" cy=\"80\" rx=\"26\" ry=\"28\" fill=\"#F3E8FF\"/><path d=\"M44 74q4 4 8 0M56 82q4 4 8 0M68 74q4 4 8 0M50 92q4 4 8 0M62 92q4 4 8 0\" stroke=\"rgba(0,0,0,.14)\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M22 72q-10 10 -2 24q8-6 10-16z\" fill=\"#6B4E9B\"/><path d=\"M98 72q10 10 2 24q-8-6-10-16z\" fill=\"#6B4E9B\"/><path d=\"M46 108h8M66 108h8\" stroke=\"#FF9F43\" stroke-width=\"5\" stroke-linecap=\"round\"/><circle cx=\"42\" cy=\"50\" r=\"16\" fill=\"#fff\"/><circle cx=\"78\" cy=\"50\" r=\"16\" fill=\"#fff\"/><circle cx=\"45\" cy=\"52\" r=\"7\" fill=\"#1D2B53\"/><circle cx=\"75\" cy=\"52\" r=\"7\" fill=\"#1D2B53\"/><circle cx=\"47.5\" cy=\"49.5\" r=\"2.4\" fill=\"#fff\"/><circle cx=\"77.5\" cy=\"49.5\" r=\"2.4\" fill=\"#fff\"/><circle cx=\"42\" cy=\"50\" r=\"17\" fill=\"none\" stroke=\"#FFC93C\" stroke-width=\"4\"/><circle cx=\"78\" cy=\"50\" r=\"17\" fill=\"none\" stroke=\"#FFC93C\" stroke-width=\"4\"/><line x1=\"59\" y1=\"50\" x2=\"61\" y2=\"50\" stroke=\"#FFC93C\" stroke-width=\"4\"/><path d=\"M55 62 L65 62 L60 71 Z\" fill=\"#FF9F43\"/></svg>";
const byId=id=>document.getElementById(id);
function ring(x1,y1,x2,y2,seed){const mx=(x1+x2)/2,my=(y1+y2)/2,rx=(x2-x1)/2+7,ry=(y2-y1)/2+7;let d="";const n=72,start=-2.2+seed*.4;
  for(let i=0;i<=n;i++){const t=start+i/n*Math.PI*2.14,w=1+Math.sin(t*2+seed)*.03+(i/n)*.07;d+=(i?"L":"M")+(mx+Math.cos(t)*rx*w).toFixed(1)+" "+(my+Math.sin(t)*ry*w).toFixed(1);}
  return`<path class="pen" pathLength="1" d="${d}"/>`;}
const note=(x,y,t,anchor)=>`<text class="pnote" x="${x}" y="${y}" text-anchor="${anchor||"middle"}">${t}</text>`;
const INK="#1D2B53",BLUE="#3D5AFE",ORANGE="#E8733A";
function frame(x,y,dots,crossed){ // dots: lista med färger för ruta 0–9, crossed: index som stryks
  let s=`<rect x="${x}" y="${y}" width="110" height="44" rx="6" fill="#fff" stroke="${INK}" stroke-width="2"/>`;
  for(let i=1;i<5;i++)s+=`<line x1="${x+i*22}" y1="${y}" x2="${x+i*22}" y2="${y+44}" stroke="#C6D6F2" stroke-width="1.5"/>`;
  s+=`<line x1="${x}" y1="${y+22}" x2="${x+110}" y2="${y+22}" stroke="#C6D6F2" stroke-width="1.5"/>`;
  for(let i=0;i<10;i++){const cx=x+11+(i%5)*22,cy=y+11+Math.floor(i/5)*22;
    if(dots[i])s+=`<circle cx="${cx}" cy="${cy}" r="7.5" fill="${dots[i]}"/>`;else s+=`<circle cx="${cx}" cy="${cy}" r="7" fill="none" stroke="#D5DDEC" stroke-width="1.5" stroke-dasharray="2 2"/>`;
    if(crossed&&crossed.includes(i))s+=`<path d="M${cx-7} ${cy-7}L${cx+7} ${cy+7}M${cx+7} ${cy-7}L${cx-7} ${cy+7}" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/>`;}
  return s;}
const T=(x,y,t,size,col,w)=>`<text x="${x}" y="${y}" text-anchor="middle" font-family="Baloo 2, Trebuchet MS, sans-serif" font-weight="${w||800}" font-size="${size||22}" fill="${col||INK}">${t}</text>`;
const box=(x,y,w,t,hl)=>`<rect x="${x}" y="${y}" width="${w}" height="30" rx="5" fill="${hl?"#FFF4CC":"#EEF1FF"}" stroke="${INK}" stroke-width="1.8"/>`+T(x+w/2,y+22,t,20);
const col=(n,c)=>Array.from({length:n},()=>c);
const EX={
  plus:{tab:"Addition",title:"Addition med tiotalsövergång: <b>7 + 6</b>",bubble:"Ett helt tiotal!",
    steps:["Addera först tiokompisen.","Addera sedan resten."],
    draw:(st,play)=>{const s2=st>=2;
      let g=T(104,36,"7")+T(132,36,"+")+`<circle cx="162" cy="29" r="16" fill="#fff" stroke="${BLUE}" stroke-width="2.5"/>`+T(162,37,"6");
      g+=`<path d="M154 44 L124 74 M170 44 L196 74" stroke="${INK}" stroke-width="2" fill="none"/>`;
      g+=T(62,98,"=")+box(80,76,58,"7+3",play&&st===1)+T(160,98,"+")+box(180,76,32,"3",play&&st===2)+(s2?T(246,98,"= 13"):"");
      g+=frame(40,122,[...col(7,BLUE),...col(3,ORANGE)])+frame(162,122,s2?col(3,ORANGE):[]);
      let p="";if(play&&st===1)p=ring(80,76,138,106,1)+ring(40,122,150,166,2)+note(95,186,"7 + 3 = 10");
      if(play&&st===2)p=ring(180,76,212,106,3)+ring(162,122,228,144,4)+note(230,186,"10 + 3 = 13");
      return{g,p};}},
  take:{tab:"Subtraktion",title:"Subtraktion med tiotalsövergång: <b>13 − 5</b>",bubble:"Först ner till tio!",
    steps:["Subtrahera först ner till tio.","Subtrahera sedan resten."],
    draw:(st,play)=>{const s2=st>=2,s1=st>=1;
      let g=T(100,36,"13")+T(132,36,"−")+`<circle cx="162" cy="29" r="16" fill="#fff" stroke="${BLUE}" stroke-width="2.5"/>`+T(162,37,"5");
      g+=`<path d="M154 44 L124 74 M170 44 L196 74" stroke="${INK}" stroke-width="2" fill="none"/>`;
      g+=T(56,98,"=")+box(72,76,72,"13−3",play&&st===1)+T(162,98,"−")+box(180,76,32,"2",play&&st===2)+(s2?T(242,98,"= 8"):"");
      g+=frame(40,122,col(10,BLUE),s2?[8,9]:[])+frame(162,122,col(3,BLUE),s1?[0,1,2]:[]);
      let p="";if(play&&st===1)p=ring(72,76,144,106,1)+ring(162,122,228,144,2)+note(195,186,"13 − 3 = 10");
      if(play&&st===2)p=ring(180,76,212,106,3)+ring(106,144,150,166,4)+note(95,186,"10 − 2 = 8");
      return{g,p};}},
  think:{tab:"Tänk addition",title:"Subtraktion med tiotalsövergång: <b>13 − 5</b>",bubble:"Addera upp till tio först!",
    steps:["Tänk addition: 5 + ? = 13.","Addera först upp till tio.","Addera sedan resten. Det du har lagt till är svaret."],
    draw:(st,play)=>{const up=!play||st>=2,rest=!play||st>=3;
      let g=T(150,36,"13 − 5 = ?")+T(150,60,"Tänk: 5 + ? = 13",15,"#56668F",700);
      g+=T(40,98,"5")+T(62,98,"+")+box(76,76,32,up?"5":"?",play&&st===2)+T(124,98,"+")+box(138,76,32,rest?"3":"?",play&&st===3)+T(202,98,"= 13");
      g+=frame(40,122,[...col(5,BLUE),...(up?col(5,ORANGE):[])])+frame(162,122,rest?col(3,ORANGE):[]);
      if(rest)g+=T(262,98,"→ 8",20,"#157548");
      let p="";if(play&&st===1)p=ring(92,44,208,66,1);
      if(play&&st===2)p=ring(76,76,108,106,2)+ring(40,144,150,166,3)+note(95,186,"5 + 5 = 10");
      if(play&&st===3)p=ring(138,76,170,106,4)+ring(162,122,228,144,5)+note(222,186,"10 + 3 = 13")+note(40,186,"5 + 3 = 8","start");
      return{g,p};}}
};
function html(key,st,play){
  const e=EX[key],d=e.draw(st,play);
  return`<div class="howto"><div class="hhead"><span class="htitle">Så här räknar du</span>
    <span class="htabs">${Object.keys(EX).map(k=>`<button data-k="${k}" aria-pressed="${k===key}">${EX[k].tab}</button>`).join("")}</span></div>
    <div class="hbody"><div class="hsteps"><p class="hex">${e.title}</p>
      <ol>${e.steps.map((s,i)=>`<li class="${play?(i+1<st?"done":i+1===st?"on":"dim"):""}"><span class="hn">${i+1}</span><span>${s}</span></li>`).join("")}</ol>
      ${play?`<div class="hnav"><button class="hplay" data-back ${st<=1?"disabled":""}>← Tillbaka</button><button class="hplay main" data-next>${st>=e.steps.length?"↻ Börja om":"Nästa steg →"}</button><button class="hplay" data-stop>Klar</button></div>`
        :`<button class="hplay main" data-play>▶ Visa steg för steg</button>`}</div>
    <div class="hvis"><div class="hpic"><svg viewBox="0 0 300 196" class="hsvg" aria-hidden="true">${d.g}${d.p}</svg></div>
      <div class="howl">${OWL}<span class="hbub">${e.bubble}</span></div></div></div></div>`;
}
function mount(el,key){
  let cur={key,st:EX[key].steps.length,play:false};
  const draw=()=>{el.innerHTML=html(cur.key,cur.st,cur.play);const q=s=>el.querySelector(s),n=EX[cur.key].steps.length;
    el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{cur={key:b.dataset.k,st:EX[b.dataset.k].steps.length,play:false};draw();});
    if(q("[data-play]"))q("[data-play]").onclick=()=>{cur.play=true;cur.st=1;draw();};
    if(q("[data-next]"))q("[data-next]").onclick=()=>{cur.st=cur.st>=n?1:cur.st+1;draw();};
    if(q("[data-back]"))q("[data-back]").onclick=()=>{if(cur.st>1){cur.st--;draw();}};
    if(q("[data-stop]"))q("[data-stop]").onclick=()=>{cur.play=false;cur.st=n;draw();};};
  draw();
}
const keyNow=()=>typeof set!=="undefined"&&set.op==="minus"?(set.strat==="think"&&set.range===20?"think":"take"):"plus";
let homeDone=false;
window.tioHowtoHome=()=>{if(homeDone)return;homeDone=true;mount(byId("howtoHome"),keyNow());};
byId("qbtn").onclick=()=>{mount(byId("howtoModal"),keyNow());byId("hmodal").hidden=false;};
byId("hclose").onclick=()=>byId("hmodal").hidden=true;
byId("hmodal").onclick=e=>{if(e.target.id==="hmodal")byId("hmodal").hidden=true;};
window.tioHowtoHome();
})();

</script>
