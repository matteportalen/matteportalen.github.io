<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geometri – Matte-Portalen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF3FF; --ink:#1D2B53; --muted:#56668F; --card:#FFFFFF; --line:#C6D6F2;
  --good:#1E9E5E; --good-dark:#157548; --bad:#E5484D; --accent:#3D5AFE; --gold:#F2B707;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none !important}
.back{display:inline-block;color:var(--muted);font-weight:700;text-decoration:none;padding:6px 0;font-size:1rem}
h1{font-size:2.6rem;line-height:1;margin:14px 0 4px;font-weight:800}
h2{font-size:2rem;line-height:1.1;margin:10px 0 6px;font-weight:800}
.lead{margin:0 0 16px;color:var(--muted);font-size:1.1rem}
.stars{color:var(--gold);letter-spacing:1px}
.stars .off{color:#D5DDEC}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acard{background:var(--card);border-radius:18px;padding:10px 10px 8px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.acard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.acard .ico{width:70px;height:62px}
.acard .ico svg{width:100%;height:100%}
.acard b{font-size:1.1rem;line-height:1.15}
.acard small{color:var(--muted);font-size:.82rem;line-height:1.2}
.acard .ak{font-size:.72rem;font-weight:800;color:#fff;background:var(--c,#3D8BFD);border-radius:999px;padding:0 8px}
.note{color:var(--muted);font-size:.95rem;margin-top:18px}

.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.info{font-weight:800;font-size:1.2rem}
.progress{height:10px;border-radius:5px;background:var(--card);overflow:hidden;margin-top:6px;box-shadow:inset 0 0 0 2px var(--line)}
.progress i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.task{background:var(--card);border-radius:22px;padding:12px 14px 12px;box-shadow:0 5px 0 var(--line);margin:12px 0;transition:background .15s}
.task.ok{background:#DDF5E7}
.instr{display:flex;gap:10px;align-items:center;font-weight:700;font-size:1.15rem;line-height:1.3}
.spk{flex:none;width:46px;height:46px;border-radius:50%;background:var(--bg);font-size:1.4rem;box-shadow:0 3px 0 var(--line)}
.content{margin-top:10px;text-align:center}
.content>svg{width:min(70vw,260px);height:auto}
.content .drawsvg{width:min(84vw,300px)}
.ptw{cursor:pointer}
.feedback{min-height:1.4em;font-weight:800;font-size:1.1rem;margin-top:6px;text-align:center;color:var(--good)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opts button{background:var(--bg);border-radius:14px;padding:10px 6px;font-weight:800;font-size:1.2rem;box-shadow:0 3px 0 var(--line);min-height:58px}
.opts.emo button{font-size:2.3rem;min-height:70px}
.opts.pics button{padding:6px}
.opts.pics svg{width:56px;height:56px}
.opts button.bad{background:#FDE4E4;color:var(--bad)}
.opts button.right{background:#DDF5E7;color:var(--good-dark)}
.tapgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.tapit{background:var(--bg);border-radius:14px;aspect-ratio:1;display:grid;place-items:center;border:3px solid transparent;box-shadow:0 3px 0 var(--line)}
.tapit svg{width:88%;height:88%}
.tapit.sel{border-color:var(--accent);background:#EEF1FF}
.tapit.right{border-color:var(--good);background:#DDF5E7}
.tapit.bad{border-color:var(--bad);background:#FDE4E4}
.go{display:block;width:100%;margin-top:12px;padding:13px;border-radius:18px;background:var(--good);color:#fff;font-size:1.3rem;font-weight:800;box-shadow:0 5px 0 var(--good-dark)}
.row{display:flex;justify-content:center;align-items:center;gap:4px;flex-wrap:wrap;margin:6px 0}
.row svg{width:44px;height:44px}
.row .qm{width:44px;height:44px;border:3px dashed var(--accent);border-radius:10px;display:grid;place-items:center;font-weight:800;color:var(--accent);font-size:1.5rem}
.scene{display:grid;grid-template-columns:repeat(4,1fr);gap:0;max-width:340px;margin:0 auto;border-bottom:6px solid #C99A6B}
.scene div{font-size:2.6rem;height:64px;display:grid;place-items:center;border-top:6px solid #C99A6B;position:relative}
.scene div.hx{outline:4px solid #3D8BFD;outline-offset:-4px;border-radius:12px}
.scene div.ha{outline:4px solid #1E9E5E;outline-offset:-4px;border-radius:12px;background:#DDF5E7}
.mgrid{display:inline-grid;gap:2px;background:#C6D6F2;padding:2px;border-radius:8px;position:relative}
.mgrid i{width:min(9.5vw,40px);aspect-ratio:1;background:#fff;display:block}
.mgrid i.f{background:#3D8BFD}
.mgrid i.tap{cursor:pointer;background:#F5F8FF}
.mgrid i.tap.f{background:#FF9F43}
.mgrid i.miss{background:#FDE4E4;box-shadow:inset 0 0 0 3px #E5484D}
.mgrid i.extra{background:#E5484D}
.mgrid i.okc{background:#1E9E5E}
.mgrid .ml{position:absolute;top:-6px;bottom:-6px;width:4px;background:#E5484D;border-radius:2px}
.box1{display:inline-block;min-width:2.2em;font-size:2.4rem;font-weight:800;border-radius:12px;border:3px solid var(--accent);color:var(--accent);background:#EEF1FF;margin-top:8px;line-height:1.2}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:56px;border-radius:16px;background:var(--card);font-size:1.8rem;font-weight:800;box-shadow:0 4px 0 var(--line)}
.pad .okbtn{background:var(--good);color:#fff;box-shadow:0 4px 0 var(--good-dark);font-size:1.4rem}
.help{background:var(--card);border-radius:22px;padding:12px 14px 16px;box-shadow:0 5px 0 var(--line);text-align:center}
.help .said{color:var(--muted);margin:0 0 6px;font-weight:700}
.help .vis>svg{width:min(70vw,260px);height:auto}
.help .tapgrid{max-width:320px;margin:0 auto}
.help .tip{background:#FFF4CC;border-radius:12px;padding:8px 12px;margin:10px 0 0;font-size:1.05rem;text-align:left}
.result{text-align:center;padding-top:20px}
.rbig{font-size:clamp(3.2rem,16vw,4.6rem);font-weight:800;line-height:1;margin:6px 0}
.rsub{color:var(--muted);font-size:1.15rem;margin:0 0 14px}
.big{display:block;width:100%;padding:12px 16px;border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:1.2rem;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:6;max-width:90vw;text-align:center}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:7}
/* Skyltpromenaden (Hörn och sidor): skylt på stolpe, elevens djur bredvid, gräs under */
.skylt{display:flex;align-items:flex-end;justify-content:center;gap:2px;max-width:330px;margin:4px auto 0;border-bottom:10px solid #8FD07E;border-radius:0 0 8px 8px}
.content .skylt .sg,.help .skylt .sg{width:min(44vw,170px);height:auto;display:block}
.skylt .pet{width:min(27vw,104px);margin-bottom:-2px}
.skylt .pet svg{width:100%;height:auto;display:block;transform-origin:50% 90%}
.cap{font-weight:800;color:var(--muted);font-size:1.05rem;margin-top:4px}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-22px) rotate(-4deg)}70%{transform:translateY(0) rotate(3deg)}}
@keyframes hmm{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(-9deg)}}
.pet.hop svg{animation:hop .55s ease-out 2}
.pet.hmm svg{animation:hmm .9s ease-in-out}
/* Elevens djur vid frågan, i bilder och i Formjakten */
.instr .hpet{margin-left:auto;flex:none;width:50px}
.pet svg{width:100%;height:auto;display:block;transform-origin:50% 90%}
.pov{position:absolute;pointer-events:none}
.hunt,.pen{position:relative;max-width:360px;margin:4px auto 0}
.hunt svg,.pen svg{width:100%;height:auto;display:block}
.hs{cursor:pointer}
.hs.sel{stroke:#3D5AFE;stroke-width:5px;filter:drop-shadow(0 0 3px #3D5AFE)}
.hl{stroke:#1E9E5E;stroke-width:4.5px}
.dim{opacity:.35}
.necksvg{width:100%;max-width:380px;height:auto}
.bigpet{width:120px;margin:2px auto 0}
.mgrid.fj{margin-top:26px}
.mgrid.fj i.f,.mgrid.fj i.tap.f{background:var(--wing)}
.mgrid .fbody{position:absolute;left:calc(50% - 7px);top:-14px;bottom:-10px;width:14px;border-radius:7px;background:#4A3428}
.mgrid .fbody::before,.mgrid .fbody::after{content:"";position:absolute;top:-16px;width:3px;height:19px;background:#4A3428;border-radius:2px;transform-origin:50% 100%}
.mgrid .fbody::before{left:2px;transform:rotate(-28deg)}
.mgrid .fbody::after{right:2px;transform:rotate(28deg)}
/* Spegelmåla */
.pbanner{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:22px;padding:14px 16px;margin:4px 0 14px;color:#fff;background:linear-gradient(135deg,#7B61FF,#FF5FA2);box-shadow:0 6px 0 #5A3FD6}
.pbanner:active{transform:translateY(3px);box-shadow:0 3px 0 #5A3FD6}
.pbanner .pbi{width:84px;height:72px;flex:none;background:#fff;border-radius:16px;padding:4px}
.pbanner .pbi svg{width:100%;height:100%}
.pbanner b{display:block;font-size:1.5rem;line-height:1.1}.pbanner small{display:block;font-size:1rem;opacity:.95}
.pbanner .pnew{display:inline-block;background:#fff;color:#7B61FF;border-radius:999px;padding:0 10px;font-size:.8rem;font-weight:800;transform:rotate(-3deg);margin-bottom:2px}
.pmirror{display:flex;gap:6px}
.pmirror button,.pbrush button,.pact button{background:var(--card);border-radius:12px;padding:6px 10px;font-weight:800;font-size:.95rem;box-shadow:0 3px 0 var(--line);min-height:42px}
.pmirror button[aria-pressed="true"],.pbrush button[aria-pressed="true"]{background:var(--ink);color:#fff}
.pwrap{position:relative;margin:8px auto 0;width:min(100%,58vh,560px)}
.pboard{position:relative;width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;box-shadow:0 4px 0 var(--line);background:#fff}
.pboard canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#pov{touch-action:none;cursor:crosshair}
.ppet{position:absolute;right:-8px;bottom:-14px;width:62px;pointer-events:none}
.pbub{position:absolute;right:40px;bottom:46px;max-width:70%;background:var(--card);border-radius:14px;padding:6px 10px;font-weight:700;font-size:.92rem;box-shadow:0 3px 0 var(--line);pointer-events:none}
.pbrush,.pact{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.pcolors{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.pcolors button{width:38px;height:38px;border-radius:50%;background:var(--c);box-shadow:0 3px 0 rgba(29,43,83,.25)}
.pcolors button[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:2px}
.pact .ptest{background:#FFF4CC}
.pact .pgo{background:var(--good);color:#fff;box-shadow:0 3px 0 var(--good-dark)}
.pact button:disabled{opacity:.45}
.pres{text-align:center;font-weight:800;font-size:1.25rem;margin:10px 0 0;min-height:1.3em}
.pgal{position:fixed;inset:0;z-index:30;background:rgba(29,43,83,.45);display:grid;place-items:center;padding:12px}
.pgal .box{background:var(--card);border-radius:20px;padding:12px;width:min(560px,100%);max-height:88vh;overflow:auto}
.pgal .ptop{display:flex;align-items:center;justify-content:space-between}.pgal h3{margin:0}
.pgal .ptop button{width:40px;height:40px;border-radius:50%;background:var(--bg);font-weight:800}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:8px}
.glist figure{margin:0;background:var(--bg);border-radius:12px;padding:6px;text-align:center}
.glist img{width:100%;border-radius:8px;display:block;background:#fff}
.glist figcaption{font-size:.8rem;color:var(--muted);font-weight:700}
.gbtn{display:flex;gap:6px;justify-content:center;margin-top:4px}
.gbtn button{background:var(--card);border-radius:10px;padding:4px 10px;font-weight:800;box-shadow:0 2px 0 var(--line);min-height:36px}
.gbtn button.sure{background:var(--bad);color:#fff}
/* På dator: duken så stor som skärmen tillåter, verktygen i en spalt bredvid */
@media (min-width:900px) and (min-height:540px){
  .wrap:has(#paint:not([hidden])){max-width:1280px;padding-bottom:12px}
  #paint:not([hidden]){display:grid;grid-template-columns:auto 290px;grid-template-areas:"top top" "board tools";gap:10px 22px;align-items:start;justify-content:center}
  #paint .gtop{grid-area:top}
  #paint .pwrap{grid-area:board;width:min(calc(100vh - 176px),calc(100vw - 380px),940px);margin:0}
  #paint #ptools,#paint #ptestBar{grid-area:tools;padding-top:4px}
  #paint .pbrush,#paint .pact,#paint .pcolors{justify-content:flex-start;margin-top:12px}
  #paint .pbrush button,#paint .pact button{font-size:1.05rem;min-height:48px;padding:6px 12px}
  #paint .pcolors button{width:44px;height:44px}
  #paint .ppet{width:84px;right:-28px}
}
.gempty,.gnote{color:var(--muted);font-weight:700;text-align:center}.gnote{font-size:.85rem;margin:10px 0 0}
@media (prefers-reduced-motion:reduce){.pet svg{animation:none !important}}
</style>
</head>
<body>
<div class="wrap">
<section id="home" class="screen">
  <h1>Geometri</h1>
  <p class="lead">Former, kroppar, mönster, symmetri och mycket mer.</p>
  <button class="pbanner" id="pBanner"><span class="pbi" aria-hidden="true"></span><span><span class="pnew">Nytt!</span><b>🎨 Spegelmåla</b><small>Rita med en magisk spegel. Allt du ritar blir symmetriskt!</small></span></button>
  <div class="areas" id="areas"></div>
  <p class="note">Tre stjärnor får du om alla tio uppgifter blir rätt direkt.</p>
</section>
<section id="paint" class="screen" hidden>
  <div class="gtop"><button class="back" id="pBack">← Tillbaka</button><div class="pmirror" id="pMirror"><button data-m="v">┃ Lodrät</button><button data-m="h">━ Vågrät</button><button data-m="b">✚ Båda</button></div></div>
  <div class="pwrap"><div class="pboard"><canvas id="pcv"></canvas><canvas id="pov" aria-label="Rityta. Rita med fingret eller musen."></canvas></div><div class="pbub" id="pbub" hidden></div><div class="ppet pet" id="ppet" aria-hidden="true"></div></div>
  <div id="ptools">
    <div class="pbrush" id="pBrush"><button data-t="thin">✏️ Tunn</button><button data-t="mid">🖍️ Mellan</button><button data-t="thick">🖌️ Tjock</button><button data-t="rain" aria-label="Regnbåge">🌈</button><button data-t="stamp" aria-label="Stämpel">⭐</button><button data-t="erase">🧽 Sudd</button></div>
    <div class="pcolors" id="pColors"></div>
    <div class="pact"><button id="pUndo">↶ Ångra</button><button id="pClear">🗑️ Börja om</button><button id="pSave">💾 Spara</button><button id="pGalBtn">🖼️ Galleri</button><button id="pTest" class="ptest">🎯 Testa mig</button></div>
  </div>
  <div id="ptestBar" hidden>
    <p class="pres" id="pTestRes"></p>
    <div class="pact"><button id="pTestDone" class="pgo">✔ Klar, visa spegeln</button><button id="pTestNew" class="pgo" hidden>🎯 Ny figur</button><button id="pUndoT">↶ Ångra</button><button id="pTestEnd">🎨 Tillbaka till målningen</button></div>
  </div>
  <div class="pgal" id="pGal" hidden><div class="box"><div class="ptop"><h3>🖼️ Mitt galleri</h3><button id="pGalClose" aria-label="Stäng">✕</button></div><div class="glist" id="pGalList"></div><p class="gnote">Bilderna sparas bara i den här webbläsaren. ⬇️ laddar ner bilden, 🗑️ tar bort den.</p></div></div>
</section>
<section id="game" class="screen" hidden>
  <div class="gtop"><button class="back" id="quit">← Avsluta</button><span class="info" id="info"></span></div>
  <div class="progress"><i id="prog"></i></div>
  <div class="task" id="task">
    <div class="instr"><button class="spk" id="spk" aria-label="Läs upp">🔊</button><span id="instr"></span><span class="hpet pet" id="hpet" aria-hidden="true"></span></div>
    <div class="content" id="content"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </div>
  <div class="pad" id="pad" hidden>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="del" aria-label="Sudda">⌫</button><button data-k="0">0</button><button data-k="ok" class="okbtn">OK</button>
  </div>
  <div class="help" id="help" hidden>
    <p class="said" id="helpSaid"></p>
    <div class="vis" id="helpVis"></div>
    <p class="tip" id="helpTip"></p>
    <button class="go" id="helpGo">Fortsätt</button>
  </div>
</section>
<section id="result" class="screen result" hidden>
  <h2 id="rTitle"></h2>
  <div class="rbig" id="rBig"></div>
  <p class="rsub" id="rSub"></p>
  <button class="go" id="rAgain">Spela igen</button>
  <button class="big" id="rHome">Välj något annat</button>
  <button class="pbanner" id="rPaint" hidden style="margin-top:16px"><span class="pbi" aria-hidden="true"></span><span><b>🎨 Prova att spegelmåla!</b><small>Rita själv, och spegeln gör andra halvan symmetrisk.</small></span></button>
</section>
</div>
<div class="toast" id="toast" hidden></div>
<canvas id="fx" hidden></canvas>
<script src="../ljud.js"></script>
<script src="../djur.js"></script>
<script src="../huvud.js" data-titel="Geometri" data-ikon="🔺"></script>
<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const cap=s=>s[0].toUpperCase()+s.slice(1);
const KEY="mattespel-geometri-v1";
const data=(()=>{try{return Object.assign({stars:{}},JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return{stars:{}}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const COLS=["#3D8BFD","#FF6B6B","#2BB673","#FF9F43","#7B61FF","#FF5FA2","#17AFC4","#F7C531"];

/* ---------- Former (2D) ---------- */
const svg=(inner,vb="0 0 100 100")=>`<svg viewBox="${vb}" aria-hidden="true">${inner}</svg>`;
const pts=a=>a.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ");
function regPoly(n,cx,cy,r,rot,jit){const p=[];for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n,rr=r*(1-(jit||0)*Math.random());p.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)]);}return p;}
function shape2D(kind,col,o={}){
  const s=o.s||1,st=`fill="${col}" stroke="#1D2B53" stroke-width="3" stroke-linejoin="round"`,rot=o.rot||0;
  let el;
  if(kind==="cirkel")el=`<circle cx="50" cy="50" r="${36*s}" ${st}/>`;
  else if(kind==="triangel"){const t=o.tri||[[50,14],[88,84],[12,84]];el=`<polygon points="${pts(t.map(([x,y])=>[50+(x-50)*s,50+(y-50)*s]))}" ${st}/>`;}
  else if(kind==="kvadrat"){const a=62*s;el=`<rect x="${50-a/2}" y="${50-a/2}" width="${a}" height="${a}" ${st} transform="rotate(${rot} 50 50)"/>`;}
  else if(kind==="rektangel"){const w=80*s,h=(o.ratio?80/o.ratio:42)*s;el=`<rect x="${50-w/2}" y="${50-h/2}" width="${w}" height="${h}" ${st} transform="rotate(${rot} 50 50)"/>`;}

const BEADS=[["#FF6B6B","rund"],["#3D8BFD","fyrkant"],["#FF5FA2","hjärta"],["#F7C531","romb"]];
function beadEl(i,x,y,r){
  x=+x;y=+y;
  const [c,k]=BEADS[i],st=`fill="${c}" stroke="#1D2B53" stroke-width="${(r/6).toFixed(2)}" stroke-linejoin="round"`;let e;
  if(k==="rund")e=`<circle cx="${x}" cy="${y}" r="${r}" ${st}/>`;
  else if(k==="fyrkant")e=`<rect x="${x-r*.9}" y="${y-r*.9}" width="${r*1.8}" height="${r*1.8}" rx="${r*.3}" ${st}/>`;
  else if(k==="hjärta")e=`<path d="M${x} ${y+r} C${x-r*1.6} ${y-r*.1} ${x-r*.8} ${y-r*1.5} ${x} ${y-r*.5} C${x+r*.8} ${y-r*1.5} ${x+r*1.6} ${y-r*.1} ${x} ${y+r}Z" ${st}/>`;
  else e=`<polygon points="${x},${y-r*1.15} ${x+r},${y} ${x},${y+r*1.15} ${x-r},${y}" ${st}/>`;
  return e+`<circle cx="${x-r*.35}" cy="${y-r*.4}" r="${r*.2}" fill="#fff" opacity=".7"/>`;
}
const beadSVG=i=>`<svg viewBox="-14 -14 28 28" aria-hidden="true">${beadEl(i,0,0,11)}</svg>`;
/* Pärlorna hänger på ett snöre som svänger lite nedåt. unit/len: ramar runt varje del av mönstret i hjälpen. */
function necklaceSVG(seq,q,unit,len){
  const N=seq.length+(q?1:0),gap=31,W=N*gap+14,pos=i=>{const t=N>1?i/(N-1):.5;return[7+gap/2+i*gap,22+16*4*t*(1-t)];};
  let h=`<svg viewBox="0 0 ${W} 62" class="necksvg" aria-hidden="true">`;
  if(unit)for(let g=0;g*unit<N;g++){const a=g*unit,b=Math.min(N,a+unit)-1,ys=[];for(let i=a;i<=b;i++)ys.push(pos(i)[1]);
    h+=`<rect x="${pos(a)[0]-15}" y="${Math.min(...ys)-17}" width="${(b-a)*gap+30}" height="${Math.max(...ys)-Math.min(...ys)+34}" rx="8" fill="none" stroke="${len>=a&&len<=b?"#1E9E5E":"#FFC93C"}" stroke-width="3"/>`;}
  h+=`<polyline points="2,10 ${Array.from({length:N},(_,i)=>pos(i).join(",")).join(" ")} ${W-2},10" fill="none" stroke="#56668F" stroke-width="1.6" stroke-linejoin="round"/>`;
  seq.forEach((b,i)=>{const[x,y]=pos(i);h+=beadEl(b,x,y,12.5);});
  if(q){const[x,y]=pos(N-1);h+=`<circle cx="${x}" cy="${y}" r="13.5" fill="#EEF1FF" stroke="#3D5AFE" stroke-width="2.2" stroke-dasharray="4 3"/><text x="${x}" y="${y+5.5}" text-anchor="middle" font-size="16" font-weight="800" fill="#3D5AFE">?</text>`;}
  return h+"</svg>";
}
/* Halsbandet ritas på elevens djur när mönstret är klart */
function petBeads(arr){
  const a=arr.slice(-9),n=a.length,pt=t=>[(1-t)**2*34+2*(1-t)*t*60+t*t*86,(1-t)**2*74+2*(1-t)*t*100+t*t*74];

/* ---------- Punkt, linje, sträcka, stråle ---------- */
function edgePt(p,dx,dy,W,H,pad){let t=Infinity;
  if(dx>0)t=Math.min(t,(W-pad-p.x)/dx);else if(dx<0)t=Math.min(t,(pad-p.x)/dx);
  if(dy>0)t=Math.min(t,(H-pad-p.y)/dy);else if(dy<0)t=Math.min(t,(pad-p.y)/dy);
  return{x:p.x+dx*t,y:p.y+dy*t};}
function arrowHead(x,y,angDeg){return`<g transform="translate(${x} ${y}) rotate(${angDeg})"><path d="M0 0 L-11 -6 L-11 6 Z" fill="#1D2B53"/></g>`;}
function dotLbl(p,l,filled){return filled?`<circle cx="${p.x}" cy="${p.y}" r="6" fill="#1D2B53"/><text x="${p.x}" y="${p.y-12}" text-anchor="middle" font-size="15" font-weight="800" fill="#1D2B53">${l}</text>`
  :`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#fff" stroke="#1D2B53" stroke-width="2"/><text x="${p.x}" y="${p.y-12}" text-anchor="middle" font-size="15" font-weight="800" fill="#1D2B53">${l}</text>`;}
function figKind(kind){
  const W=160,H=94,pad=12,p1={x:34,y:72},p2={x:106,y:28},dx=p2.x-p1.x,dy=p2.y-p1.y,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;
  const LN=(a,b)=>`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#1D2B53" stroke-width="3.5" stroke-linecap="round"/>`;
  let body="";
  if(kind==="punkt")body=dotLbl(p1,"A",true);
  else if(kind==="sträcka")body=LN(p1,p2)+dotLbl(p1,"A",true)+dotLbl(p2,"B",true);
  else if(kind==="stråle"){const e=edgePt(p2,ux,uy,W,H,pad),ang=Math.atan2(uy,ux)*180/Math.PI;
    body=LN(p1,e)+arrowHead(e.x,e.y,ang)+dotLbl(p1,"A",true);}
  else{const e1=edgePt(p1,-ux,-uy,W,H,pad),e2=edgePt(p2,ux,uy,W,H,pad),a1=Math.atan2(-uy,-ux)*180/Math.PI,a2=Math.atan2(uy,ux)*180/Math.PI;
    body=LN(e1,e2)+arrowHead(e1.x,e1.y,a1)+arrowHead(e2.x,e2.y,a2);}
  return svg(body,`0 0 ${W} ${H}`);
}
const FIGNAME={punkt:"Punkt",sträcka:"Sträcka",stråle:"Stråle",linje:"Linje"};
const FIGTIP={punkt:"En punkt är bara ett läge, ett ställe. Den har ingen längd.",
  sträcka:"En sträcka har två ändpunkter, här A och B. Den slutar i båda ändarna.",
  stråle:"En stråle har en ändpunkt, här A, och fortsätter sedan hur långt som helst åt ett håll, dit pilen pekar.",
  linje:"En linje har ingen ändpunkt alls. Den fortsätter hur långt som helst åt båda hållen, dit pilarna pekar."};
function genPunkt(){
  const kind=pickOne(["punkt","sträcka","stråle","linje"]),vis=figKind(kind),opts=shuffle(Object.values(FIGNAME));
  return{kind:"opts",instr:"Vad heter figuren?",speak:"Vad heter figuren?",html:vis,options:opts,answer:FIGNAME[kind],
    help:()=>({vis,tip:FIGTIP[kind]})};
}
function genRita(){
  const n=pickOne([5,6]),letters=shuffle(["A","B","C","D","E","F"]).slice(0,n);
  const W=240,H=170,cols=3,rows=Math.ceil(n/cols),cw=W/cols,ch=H/rows;
  const cells=shuffle([...Array(cols*rows).keys()]).slice(0,n);
  const points=letters.map((label,i)=>{const cell=cells[i],col=cell%cols,row=Math.floor(cell/cols);
    let x=col*cw+cw/2+(Math.random()-.5)*(cw*.5),y=row*ch+ch/2+(Math.random()-.5)*(ch*.5);
    return{label,x:Math.max(20,Math.min(W-20,x)),y:Math.max(20,Math.min(H-20,y))};});
  const[pa,pb]=shuffle(points.slice()).slice(0,2).map(p=>p.label),target=[pa,pb];
  const fig=(sel,hl)=>{const gp=l=>points.find(p=>p.label===l);
    const line=hl?`<line x1="${gp(pa).x}" y1="${gp(pa).y}" x2="${gp(pb).x}" y2="${gp(pb).y}" stroke="#1E9E5E" stroke-width="4.5" stroke-linecap="round"/>`
      :(sel&&sel.length===2?`<line x1="${gp(sel[0]).x}" y1="${gp(sel[0]).y}" x2="${gp(sel[1]).x}" y2="${gp(sel[1]).y}" stroke="#3D5AFE" stroke-width="4.5" stroke-linecap="round"/>`:"");
    const pts=points.map(p=>{const on=hl?target.includes(p.label):sel&&sel.includes(p.label);
      return`<g class="ptw" data-l="${p.label}"><circle cx="${p.x}" cy="${p.y}" r="18" fill="transparent"/><circle cx="${p.x}" cy="${p.y}" r="7" fill="${on?(hl?"#1E9E5E":"#3D5AFE"):"#1D2B53"}"/><text x="${p.x}" y="${p.y-13}" text-anchor="middle" font-size="16" font-weight="800" fill="#1D2B53">${p.label}</text></g>`;}).join("");
    return`<svg viewBox="0 0 ${W} ${H}" class="drawsvg">${line}${pts}</svg>`;};
  return{kind:"draw",instr:`Rita sträckan ${pa}${pb}.`,speak:`Rita sträckan ${pa} ${pb}. Tryck på punkt ${pa} och sedan på punkt ${pb}, och tryck sedan på Klar.`,
    points,target,fig,
    help:()=>({vis:fig(null,true),tip:`En sträcka ritas som en rak linje mellan två punkter. Sträckan ${pa}${pb} går mellan punkt ${pa} och punkt ${pb}.`})};
}
const genStracka=()=>Math.random()<.55?genPunkt():genRita();

function mirrorTask(){
  const R=6,C=8,half=4,left=new Set(),col=pickOne(WINGC);let r=rnd(1,4),c=rnd(1,3);left.add(r+","+c);
  const N=rnd(5,8);let g=0;while(left.size<N&&g++<200){const[rr,cc]=pickOne([...left]).split(",").map(Number),[dr,dc]=pickOne([[1,0],[-1,0],[0,1],[0,-1]]),nr=rr+dr,nc=cc+dc;if(nr>=0&&nr<R&&nc>=0&&nc<half)left.add(nr+","+nc);}
  const want=new Set([...left].map(k=>{const[a,b]=k.split(",").map(Number);return a+","+(C-1-b);}));
  const grid=(state,mark)=>{let h=`<div class="mgrid fj" style="grid-template-columns:repeat(${C},auto);--wing:${col}">`;
    for(let a=0;a<R;a++)for(let b=0;b<C;b++){const k=a+","+b;let cls="";
      if(b<half)cls=left.has(k)?"f":"";else{cls="tap";if(mark){if(want.has(k)&&state.has(k))cls="okc";else if(want.has(k))cls="miss";else if(state.has(k))cls="extra";}else if(state.has(k))cls+=" f";}
      h+=`<i class="${cls}" data-k="${k}"></i>`;}

  const used=shuffle(L.map((_,i)=>i)),nl=rnd(2,3),left=used.slice(0,nl).map(i=>L[i]),spare=used.slice(nl).map(i=>L[i]);

  const dots=[...left.map(([x,y])=>({x,y,c:dc})),...left.map(([x,y])=>({x:mx-x,y,c:dc}))];let odd=null;
  if(!yes){const j=nl+rnd(0,nl-1),v=rnd(0,lady?1:2);odd={x:dots[j].x,y:dots[j].y};

    dots.forEach(d=>{if(!d.gone)h+=`<circle cx="${d.x}" cy="${d.y}" r="${r}" fill="${d.c}" stroke="#1D2B53" stroke-width="${lady?0:.15}"/>`;});
    if(mark){h+=`<line x1="${mx/2}" y1="${lady?0:-.5}" x2="${mx/2}" y2="${lady?100:15.5}" stroke="#3D5AFE" stroke-width="${lady?2.5:.25}" stroke-dasharray="${lady?"6 5":".8 .6"}"/>`;

    return h+"</svg>";};

    help:()=>({vis:draw(true),tip:yes?`Ja! Om du viker ${vem} längs den blå linjen hamnar prickarna exakt på varandra.`:"Nej. Titta på den orange ringen. Där är det inte likadant på båda sidorna."})};
}
function symYesNo(){
  const R=5,C=6,left=new Set();let g=0;while(left.size<6&&g++<200)left.add(rnd(0,R-1)+","+rnd(0,2));
  const cells=new Set([...left,...[...left].map(k=>{const[a,b]=k.split(",").map(Number);return a+","+(C-1-b);})]);

const VEG=[["🥕","morötter"],["🥬","sallad"],["🍓","jordgubbar"],["🌻","solrosor"]];
const SQ=30;
function gridLines(C,R){let h="";
  for(let a=0;a<=R;a++)h+=`<line x1="0" y1="${a*SQ}" x2="${C*SQ}" y2="${a*SQ}" stroke="#C6D6F2" stroke-width="1"/>`;
  for(let b=0;b<=C;b++)h+=`<line x1="${b*SQ}" y1="0" x2="${b*SQ}" y2="${R*SQ}" stroke="#C6D6F2" stroke-width="1"/>`;return h;}
/* Hagen: gräs innanför, ett staket med en stolpe i varje rutas hörn. help = staketet orange och sidornas längd utskriven. */
function penHTML(C,R,x0,y0,w,hh,help){
  const W=C*SQ+16,H=R*SQ+16,X=x0*SQ,Y=y0*SQ,PW=w*SQ,PH=hh*SQ,col=help?"#FF9F43":"#8B5A2B";
  let h=`<svg viewBox="-8 -8 ${W} ${H}" aria-hidden="true">${gridLines(C,R)}<rect x="${X}" y="${Y}" width="${PW}" height="${PH}" fill="#CDEFC0"/>`;
  h+=`<rect x="${X}" y="${Y}" width="${PW}" height="${PH}" fill="none" stroke="${col}" stroke-width="${help?5:4}"/>`;
  for(let a=0;a<=hh;a++)for(let b=0;b<=w;b++)if(a===0||b===0||a===hh||b===w)h+=`<rect x="${X+b*SQ-3.5}" y="${Y+a*SQ-3.5}" width="7" height="7" rx="1.5" fill="#6B4423"/>`;
  if(help){const ty=y0>0?Y-9:Y+PH+20,right=x0+w<C;
    h+=`<text x="${X+PW/2}" y="${ty}" text-anchor="middle" font-size="15" font-weight="800" fill="#C96A0C" paint-order="stroke" stroke="#fff" stroke-width="4">${w} m</text><text x="${right?X+PW+9:X-9}" y="${Y+PH/2+5}" text-anchor="${right?"start":"end"}" font-size="15" font-weight="800" fill="#C96A0C" paint-order="stroke" stroke="#fff" stroke-width="4">${hh} m</text>`;}
  h+="</svg>";
  /* djuret står i hagen om det får plats, annars visas det uppe vid frågan */
  if(w>=2&&hh>=2){const pw=Math.min(w,2)*SQ*.8;h+=`<div class="pet pov" style="left:${(X+8+(PW-pw)/2)/W*100}%;width:${pw/W*100}%;bottom:${(H-(Y+8+PH-2))/H*100}%">${owlSVG(pet)}</div>`;}
  return`<div class="pen">${h}</div>`;
}
function plotHTML(cells,C,R,veg,num){

const ROUND=10;let G=null;
function start(area){G={area,n:ROUND,i:-1,missed:0,pending:[]};show("game");next();}
function next(){
  G.i++;if(G.i>=G.n)return finish();
  let t=null;if(G.pending.length&&G.pending[0].at<=G.i)t=G.pending.shift().t;
  if(!t){for(let k=0;k<6;k++){t=G.area.gen();if(t.instr+t.answer!==G.lastKey)break;}}
  G.lastKey=t.instr+t.answer;G.t=t;$("hpet").innerHTML=owlSVG(pet);G.first=true;G.input="";G.busy=false;
  if("speechSynthesis" in window)speechSynthesis.cancel();
  $("info").textContent=`${G.i+1} av ${G.n}`;$("prog").style.width=(G.i/G.n*100)+"%";
  $("instr").textContent=t.instr;$("feedback").textContent="";$("task").className="task";$("help").hidden=true;$("task").hidden=false;
  render();
}
function render(){
  const t=G.t,c=$("content");$("pad").hidden=t.kind!=="keys";
  if(t.kind==="opts"){
    c.innerHTML=t.html+`<div class="opts${t.emo?" emo":""}${t.pics?" pics":""}">${t.options.map((o,i)=>`<button data-o="${o}">${t.labels?t.labels[i]:o}</button>`).join("")}</div>`;
    c.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{if(G.busy)return;if(b.dataset.o===String(t.answer)){b.classList.add("right");done();}else{b.classList.add("bad");wrong(b.dataset.o,t.labels?b.innerHTML:null);}});
  }else if(t.kind==="keys"){
    c.innerHTML=t.html+`<div><span class="box1" id="box">?</span>${t.unit?` <b>${t.unit}</b>`:""}</div>`;
  }else if(t.kind==="tap"){
    c.innerHTML=`<div class="tapgrid">${t.items.map((p,i)=>`<button class="tapit" data-i="${i}">${p}</button>`).join("")}</div><button class="go" id="done">Klar</button>`;
    c.querySelectorAll(".tapit").forEach(b=>b.onclick=()=>{if(!G.busy)b.classList.toggle("sel");});
    $("done").onclick=()=>{if(G.busy)return;const sel=[...c.querySelectorAll(".tapit.sel")].map(b=>+b.dataset.i);
      const ok=sel.length===t.correct.length&&t.correct.every(i=>sel.includes(i));ok?done():wrong(sel.length?`${sel.length} former`:"ingen form");};
  }else if(t.kind==="hunt"){
    c.innerHTML=t.html+`<button class="go" id="done">Klar</button>`;
    c.querySelectorAll(".hs").forEach(el=>el.addEventListener("click",()=>{if(!G.busy)el.classList.toggle("sel");}));
    $("done").onclick=()=>{if(G.busy)return;const sel=[...c.querySelectorAll(".hs.sel")].map(e=>+e.dataset.i);
      const ok=sel.length===t.correct.length&&t.correct.every(i=>sel.includes(i));ok?done():wrong(sel.length?`${sel.length} ${sel.length===1?"form":"former"}`:"ingen form");};
  }else if(t.kind==="draw"){
    G.sel=[];const draw=()=>{c.innerHTML=t.fig(G.sel)+`<button class="go" id="done">Klar</button>`;
      c.querySelectorAll(".ptw").forEach(el=>el.onclick=()=>{if(G.busy)return;const l=el.dataset.l,i=G.sel.indexOf(l);
        if(i>=0)G.sel.splice(i,1);else if(G.sel.length<2)G.sel.push(l);else G.sel=[l];draw();});
      $("done").onclick=()=>{if(G.busy||G.sel.length!==2)return;
        const ok=t.target.every(l=>G.sel.includes(l));ok?done():wrong(`sträckan ${G.sel.join("")}`);};};
    draw();
  }else{
    G.state=new Set();const draw=()=>{c.innerHTML=t.grid(G.state,false)+`<button class="go" id="done">Klar</button>`;
      c.querySelectorAll("i.tap").forEach(el=>el.onclick=()=>{if(G.busy)return;const k=el.dataset.k;G.state.has(k)?G.state.delete(k):G.state.add(k);draw();});
      $("done").onclick=()=>{if(G.busy)return;const ok=G.state.size===t.want.size&&[...t.want].every(k=>G.state.has(k));ok?done():wrong("din spegling");};};
    draw();
  }
  $("hpet").hidden=!!c.querySelector(".pet");
}
function press(k){if(!G||G.busy||G.t.kind!=="keys")return;if(k==="del")G.input=G.input.slice(0,-1);else if(k==="ok"){if(G.input!==""){+G.input===G.t.answer?done():wrong(G.input);}return;}else if(G.input.length<3)G.input+=k;$("box").textContent=G.input||"?";}

  if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==="Backspace"){e.preventDefault();press("del");}else if(e.key==="Enter"){e.preventDefault();press("ok");}});

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("fx"),x=c.getContext("2d"),dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);c.hidden=false;
  const P=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*120,y:H*.3,vx:(Math.random()-.5)*16,vy:-Math.random()*15-4,r:Math.random()*7+5,c:pickOne(COLS),a:Math.random()*6,va:(Math.random()-.5)*.4}));
  const t0=performance.now();(function f(now){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(now-t0<2800)requestAnimationFrame(f);else{x.clearRect(0,0,W,H);c.hidden=true;}})(t0);
}
/* ---------- Spegelmåla ----------
   Fritt verktyg (inga stjärnor). Allt man ritar speglas i symmetrilinjen: lodrät, vågrät eller båda (kalejdoskop).
   Penslar: tunn, mellan, tjock, regnbåge, stämpel (stjärna, hjärta, prick) och sudd. Ångra, Börja om (går att ångra), Spara.
   Galleriet sparas i den här webbläsaren per profil (matteportalen-galleri, inte i profilernas flyttkod), max 12 bilder.
   "Testa mig": djuret ritar en halv figur, eleven ritar andra halvan utan spegel, sedan visas spegelbilden och hur nära man kom. */
const PS=600,PCOL=["#1D2B53","#E5484D","#FF9F43","#F2B707","#2BB673","#17AFC4","#3D5AFE","#7B61FF","#FF5FA2","#A0673C"];
const GKEY="matteportalen-galleri";
const PT={mirror:"v",tool:"mid",color:"#3D5AFE",stamp:0,strokes:[],cleared:null,cur:null,test:null,saved:null};
const pcv=$("pcv"),pctx=pcv.getContext("2d"),pov=$("pov"),povx=pov.getContext("2d");
pcv.width=pcv.height=pov.width=pov.height=PS;
const PSIZE={thin:6,mid:14,thick:30,rain:16,erase:34};
const STAMPS=["⭐","❤️","●"];
const pOwner=()=>{try{return sessionStorage.getItem("mp-active")||"gast";}catch(e){return"gast";}};
const gGet=()=>{try{return JSON.parse(localStorage.getItem(GKEY)||"[]")}catch(e){return[]}};
const gPut=l=>{try{localStorage.setItem(GKEY,JSON.stringify(l));return true;}catch(e){return false;}};
function pSay(t){const b=$("pbub");b.textContent=t;b.hidden=false;clearTimeout(pSay.t);pSay.t=setTimeout(()=>b.hidden=true,3200);}

  renderPaintUI();pRedraw();show("paint");pSay("Rita på ena sidan. Spegeln ritar den andra!");

function renderPaintUI(){

  $("pBrush").querySelectorAll("button").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.t===PT.tool);if(b.dataset.t==="stamp")b.textContent=STAMPS[PT.stamp];});

  $("pUndo").disabled=!PT.strokes.length&&!PT.cleared;

/* Spegelbilder av en punkt */
function mirrors(x,y,m){const a=[[x,y]];if(m==="v"||m==="b")a.push([PS-x,y]);if(m==="h"||m==="b")a.push([x,PS-y]);if(m==="b")a.push([PS-x,PS-y]);return a;}
function drawStamp(c,s,x,y,col,size){
  c.save();c.translate(x,y);c.fillStyle=col;
  if(s===2){c.beginPath();c.arc(0,0,size*.55,0,7);c.fill();}
  else if(s===0){c.beginPath();for(let i=0;i<10;i++){const r=i%2?size*.42:size,a=-Math.PI/2+i*Math.PI/5;c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}c.closePath();c.fill();}
  else{const r=size*.55;c.beginPath();c.moveTo(0,r*.9);c.bezierCurveTo(-r*1.6,-r*.2,-r*.7,-r*1.5,0,-r*.5);c.bezierCurveTo(r*.7,-r*1.5,r*1.6,-r*.2,0,r*.9);c.fill();}
  c.restore();
}
function drawStroke(c,s){
  const m=s.mirror,pts=s.pts;
  if(s.tool==="stamp"){pts.forEach(([x,y])=>mirrors(x,y,m).forEach(([a,b],k)=>drawStamp(c,s.stamp,a,b,s.color,26)));return;}
  c.lineCap="round";c.lineJoin="round";c.lineWidth=PSIZE[s.tool];
  const copies=mirrors(0,0,m).length;
  for(let k=0;k<copies;k++){
    const tr=([x,y])=>mirrors(x,y,m)[k];
    if(pts.length===1){const [x,y]=tr(pts[0]);c.fillStyle=s.tool==="erase"?"#fff":s.tool==="rain"?`hsl(${s.h0%360},90%,55%)`:s.color;c.beginPath();c.arc(x,y,PSIZE[s.tool]/2,0,7);c.fill();continue;}
    if(s.tool==="rain"){for(let i=1;i<pts.length;i++){const [x0,y0]=tr(pts[i-1]),[x1,y1]=tr(pts[i]);c.strokeStyle=`hsl(${(s.h0+i*6)%360},90%,55%)`;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();}}
    else{c.strokeStyle=s.tool==="erase"?"#fff":s.color;c.beginPath();pts.forEach((p,i)=>{const [x,y]=tr(p);i?c.lineTo(x,y):c.moveTo(x,y);});c.stroke();}
  }
}
function pRedraw(){
  pctx.fillStyle="#fff";pctx.fillRect(0,0,PS,PS);
  if(PT.test)drawTestFigure(pctx);
  PT.strokes.forEach(s=>drawStroke(pctx,s));if(PT.cur)drawStroke(pctx,PT.cur);
  // symmetrilinjerna i ett eget lager (följer inte med när bilden sparas)
  povx.clearRect(0,0,PS,PS);povx.strokeStyle="rgba(61,90,254,.55)";povx.lineWidth=3;povx.setLineDash([14,10]);
  const m=PT.test?"v":PT.mirror;
  if(m==="v"||m==="b"){povx.beginPath();povx.moveTo(PS/2,0);povx.lineTo(PS/2,PS);povx.stroke();}
  if(m==="h"||m==="b"){povx.beginPath();povx.moveTo(0,PS/2);povx.lineTo(PS,PS/2);povx.stroke();}
  povx.setLineDash([]);
  if(PT.test&&PT.test.shown)drawTestAnswer(povx);
  renderPaintUI();
}
function pPos(e){const r=pcv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*PS,(e.clientY-r.top)/r.height*PS];}
pov.addEventListener("pointerdown",e=>{
  e.preventDefault();try{pov.setPointerCapture(e.pointerId);}catch(_){}
  const p=pPos(e);if(PT.test&&PT.test.shown)return;
  const tool=PT.test?"mid":PT.tool;
  PT.cur={tool,color:PT.test?"#3D5AFE":PT.color,mirror:PT.test?"n":PT.mirror,stamp:PT.stamp,pts:[p],h0:Math.floor(Math.random()*360)};
  if(tool==="stamp"){window.Ljud&&Ljud.pop&&Ljud.pop(PT.stamp*3);}
  pRedraw();
});
pov.addEventListener("pointermove",e=>{
  if(!PT.cur)return;const p=pPos(e),l=PT.cur.pts[PT.cur.pts.length-1];
  if(PT.cur.tool==="stamp"){if(Math.hypot(p[0]-l[0],p[1]-l[1])>46)PT.cur.pts.push(p);}else if(Math.hypot(p[0]-l[0],p[1]-l[1])>2)PT.cur.pts.push(p);
  pRedraw();
});
const pEnd=()=>{if(!PT.cur)return;PT.strokes.push(PT.cur);PT.cur=null;PT.cleared=null;pRedraw();
  if(!PT.test&&PT.strokes.length===3)pSay(pickOne(["Titta, båda sidorna blir likadana!","Snyggt! Det blir symmetriskt.","Spegeln hänger med!"]));};
pov.addEventListener("pointerup",pEnd);pov.addEventListener("pointercancel",pEnd);
$("pMirror").onclick=e=>{const b=e.target.closest("[data-m]");if(!b||PT.test)return;PT.mirror=b.dataset.m;pRedraw();
  pSay(PT.mirror==="v"?"Lodrät spegel, som en fjäril.":PT.mirror==="h"?"Vågrät spegel, som en spegling i vatten.":"Två speglar: ett kalejdoskop!");};
$("pBrush").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;if(b.dataset.t==="stamp"&&PT.tool==="stamp")PT.stamp=(PT.stamp+1)%STAMPS.length;PT.tool=b.dataset.t;renderPaintUI();};
$("pColors").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;PT.color=b.dataset.c;if(PT.tool==="erase")PT.tool="mid";renderPaintUI();};
$("pUndoT").onclick=()=>$("pUndo").onclick();
$("pUndo").onclick=()=>{if(PT.strokes.length)PT.strokes.pop();else if(PT.cleared){PT.strokes=PT.cleared;PT.cleared=null;}pRedraw();};
$("pClear").onclick=()=>{if(!PT.strokes.length)return;PT.cleared=PT.strokes;PT.strokes=[];pRedraw();pSay("Ny duk! Ångra om du ångrar dig.");};
$("pBack").onclick=()=>openHome();

  {name:"en gran",pts:[[300,110],[220,240],[260,240],[175,350],[235,350],[150,465],[275,465],[275,540],[300,540]]},
  {name:"ett hus",pts:[[300,130],[150,260],[185,260],[185,500],[300,500]]},
  {name:"en fjärilsvinge",pts:[[300,210],[230,120],[140,110],[100,190],[150,280],[110,380],[160,470],[250,430],[300,360]]},
  {name:"en raket",pts:[[300,80],[255,150],[240,390],[180,470],[245,455],[260,500],[300,500]]},
  {name:"en stjärna",pts:[[300,90],[255,235],[110,235],[225,325],[180,470],[300,385]]}
];
function drawTestFigure(c){const f=PT.test.fig;c.strokeStyle="#FF5FA2";c.lineWidth=12;c.lineCap="round";c.lineJoin="round";c.beginPath();f.pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();}
function drawTestAnswer(c){const f=PT.test.fig;c.strokeStyle="rgba(30,158,94,.75)";c.lineWidth=8;c.setLineDash([16,10]);c.lineCap="round";c.beginPath();f.pts.forEach(([x,y],i)=>i?c.lineTo(PS-x,y):c.moveTo(PS-x,y));c.stroke();c.setLineDash([]);}
$("pTest").onclick=()=>{
  if(!PT.test)PT.saved={strokes:PT.strokes,mirror:PT.mirror};PT.strokes=[];PT.cleared=null;
  let f;do f=pickOne(PFIG);while(PT.test&&f===PT.test.fig&&PFIG.length>1);
  PT.test={fig:f,shown:false};$("ptools").hidden=true;$("pMirror").hidden=true;$("ptestBar").hidden=false;$("pTestDone").hidden=false;$("pTestNew").hidden=true;$("pTestRes").textContent="";
  pRedraw();pSay(`Jag ritade halva ${f.name}. Kan du rita andra halvan på högra sidan?`);
};
$("pTestDone").onclick=()=>{
  if(!PT.strokes.length){pSay("Rita andra halvan först!");return;}
  PT.test.shown=true;
  // hur nära: andel punkter längs spegelbilden som har något ritat i närheten
  const f=PT.test.fig,samples=[];for(let i=1;i<f.pts.length;i++){const [x0,y0]=f.pts[i-1],[x1,y1]=f.pts[i],n=Math.max(1,Math.round(Math.hypot(x1-x0,y1-y0)/10));for(let k=0;k<n;k++){const t=k/n;samples.push([PS-(x0+(x1-x0)*t),y0+(y1-y0)*t]);}}
  const drawn=PT.strokes.flatMap(s=>s.pts);
  const hits=samples.filter(([x,y])=>drawn.some(([a,b])=>Math.hypot(a-x,b-y)<26)).length,pct=Math.round(hits/samples.length*100);
  $("pTestRes").textContent=pct>=85?`Jättenära! ${pct} % 🎉`:pct>=60?`Bra! ${pct} % stämmer.`:`${pct} % stämmer. Det gröna visar hur det skulle bli.`;
  if(pct>=60){pHop();window.Ljud&&Ljud.ok&&Ljud.ok();}else window.Ljud&&Ljud.bad&&Ljud.bad();
  pSay(pct>=85?"Wow, nästan exakt spegelvänt!":"Det gröna är spegelbilden. Jämför med din!");
  $("pTestDone").hidden=true;$("pTestNew").hidden=false;pRedraw();
};
$("pTestNew").onclick=()=>$("pTest").onclick.call(null);
$("pTestEnd").onclick=()=>{PT.test=null;if(PT.saved){PT.strokes=PT.saved.strokes;PT.mirror=PT.saved.mirror;}PT.saved=null;$("ptools").hidden=false;$("pMirror").hidden=false;$("ptestBar").hidden=true;pRedraw();pSay("Tillbaka till spegelmålningen!");};

openHome();
</script>
